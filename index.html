 {part:1,nr:2,type:'mc',pts:2,req:'Încercuiește litera corespunzătoare răspunsului corect, valorificând informațiile din textul 1. Repetarea replicii „Ionel! vin’ la mama!” are rolul',o:['de a evidenția că mama nu reușește să-și impună autoritatea asupra copilului.','de a arăta că Ionel ascultă imediat de mama sa.','de a sugera că mama este foarte severă cu fiul ei.','de a arăta că naratorul se grăbește să plece.'],a:0,e:'Mama strigă de mai multe ori, dar Ionel nu ascultă: educația de care se laudă nu are niciun efect.'},
 {part:1,nr:3,type:'mc',pts:2,req:'Încercuiește litera corespunzătoare răspunsului corect, valorificând informațiile din textul 2. Înainte de vizită, părinții ar trebui',o:['să le explice copiilor ce urmează.','să le cumpere copiilor jucării noi.','să-i lase pe copii acasă.','să le dea copiilor dulciuri.'],a:0,e:'„înainte de vizită, părinții să le explice celor mici ce urmează”.'},
 {part:1,nr:4,type:'mc',pts:2,req:'Încercuiește litera corespunzătoare răspunsului corect, valorificând informațiile din textul 2. Psihologa citată afirmă că bunele maniere se învață mai ales',o:['din exemplul celor din jur.','din predicile adulților.','din cărțile de povești.','numai la școală.'],a:0,e:'„nu învață bunele maniere din predici, ci din ce văd în jurul lor”.'},
 {part:1,nr:5,type:'tf',pts:6,req:'Notează „X” în dreptul fiecărui enunț pentru a marca dacă acesta este adevărat sau fals, bazându-te pe informațiile din cele două texte.',rows:[
   {t:'Textul 1: Vizita are loc de ziua numelui lui Ionel.',a:true},
   {t:'Textul 1: Doamna Popescu spune că merge tot mai des la petreceri.',a:false},
   {t:'Textul 1: Ajuns acasă, naratorul descoperă dulceață în șoșoni.',a:true},
   {t:'Textul 2: Psihologa lucrează de zece ani cu familiile.',a:false},
   {t:'Textul 2: Gazdele pot amenaja un colț cu jocuri pentru copii.',a:true},
   {t:'Textul 2: Limitele sunt prezentate ca pedepse.',a:false}]},
 {part:1,nr:6,type:'open',pts:6,min:0,max:0,minSent:2,req:'Precizează, în minimum două enunțuri, o trăsătură a tiparului textual dialogat, identificată în textul 1, ilustrând-o cu o secvență relevantă.',crit:C_TIPAR,
  model:'O trăsătură a tiparului textual dialogat este alternanța replicilor personajelor, marcate prin linie de dialog. De exemplu, în secvența „— Unde te duci? întreabă mama. / — Viu acu! răspunde Ionel.”, replicile mamei și ale copilului se succedă, iar verbele „întreabă” și „răspunde” arată cine vorbește.'},
 {part:1,nr:7,type:'open',pts:6,min:30,max:0,req:'Compară, în minimum 30 de cuvinte, comportamentul copilului din textul 1 cu regulile pentru vizite prezentate în textul 2, valorificând câte o secvență relevantă din fiecare text.',crit:C_COMPAR,
  model:'Comportamentul lui Ionel este opusul regulilor din textul 2. Textul 2 recomandă ca, la masă, copiii să se servească „cu măsură”, însă Ionel mănâncă dulceață până când mama îi spune „Ajunge, Ionel! destulă dulceață”. De asemenea, în loc să ceară voie, aruncă mingea până la policandru.'},
 {part:1,nr:8,type:'open',pts:6,min:50,max:100,req:'Crezi că un copil învață bunele maniere mai ales din exemplul părinților? Motivează, în 50–100 de cuvinte, răspunsul la întrebarea dată, valorificând textul 2.',crit:C_OPINIE,
  model:'Cred că un copil învață bunele maniere mai ales din exemplul părinților. Psihologa din textul 2 explică faptul că cei mici nu învață „din predici, ci din ce văd în jurul lor”. Dacă un copil își vede părinții salutând, mulțumind și vorbind calm, va face la fel fără să i se mai spună. În plus, textul arată că un „nu” spus cu blândețe îl învață pe copil să respecte limitele. Așadar, exemplul contează mai mult decât vorbele.'},
 {part:1,nr:9,type:'open',pts:6,min:50,max:100,req:'Asociază schița „Vizită...” de I.L. Caragiale cu un alt text literar studiat la clasă sau citit ca lectură suplimentară, prezentând, în 50–100 de cuvinte, o valoare comună, prin referire la câte o secvență relevantă din fiecare text.',crit:C_ASOC,
  model:'Schița „Vizită...” poate fi asociată cu „D-l Goe...” de I.L. Caragiale, prin valoarea educației. În ambele texte, adulții răsfață copiii și nu le impun limite. Mama lui Ionel îl sărută și îl scuipă „să nu-l deoache”, deși băiatul face numai nebunii. La fel, cele trei doamne îl numesc pe Goe „puișorul mamii”, deși el se poartă urât în tren. Ambele texte arată că educația adevărată înseamnă și reguli, nu doar alint.'},
 {part:2,nr:1,type:'mc',pts:2,req:'Încercuiește litera corespunzătoare răspunsului corect. Conțin diftong ambele cuvinte din seria:',o:['„pierduți”, „iese”','„ceașcă”, „mai”','„cafea”, „copilaș”','„mingea”, „trâmbița”'],a:0,e:'pier-duți (ie), ie-se (ie). În „ceașcă” și „mingea”, „e” este literă ajutătoare (ce/ge + vocală).'},
 {part:2,nr:2,type:'mc',pts:2,req:'Încercuiește litera corespunzătoare răspunsului corect. Cuvintele subliniate în secvențele „un <u class=s>copilaș</u> (1) foarte drăguț” și „cu multă <u class=s>bunătate</u> (2)” s-au format prin:',o:['derivare (1), derivare (2).','compunere (1), derivare (2).','derivare (1), conversiune (2).','conversiune (1), compunere (2).'],a:0,e:'copil + -aș; bun + -ătate – ambele derivate cu sufix.'},
 {part:2,nr:3,type:'mc',pts:2,req:'Încercuiește litera corespunzătoare răspunsului corect. Secvența subliniată în fragmentul „Explicația mea <u class=s>prinde bine</u>” are sensul de',o:['are efectul dorit.','este prinsă de cineva.','este greu de înțeles.','îl supără pe copil.'],a:0,e:'„a prinde bine” = a fi de folos, a avea efect.'},
 {part:2,nr:4,type:'mc',pts:2,req:'Încercuiește litera corespunzătoare răspunsului corect. Sunt omonime cuvintele subliniate în secvențele din seria:',o:['„Mingea <u class=s>sare</u> până la policandru”; Pune <u class=s>sare</u> în supă.','„cu sabia <u class=s>scoasă</u>”; A <u class=s>scos</u> apă din fântână.','„o <u class=s>voce</u> răgușită”; Are o <u class=s>voce</u> frumoasă.','„pe două <u class=s>mese</u>”; Am cumpărat o <u class=s>masă</u> nouă.'],a:0,e:'„sare” (verbul „a sări”) și „sare” (condiment) au aceeași formă, dar sensuri fără legătură.'},
 {part:2,nr:5,type:'morph',pts:6,req:'Menționează valoarea morfologică a fiecărui cuvânt subliniat.',rows:[
   {w:'„este” – din „d. Popescu tatăl <u class=s>este</u> mare agricultor”',a:'verb copulativ'},
   {w:'„a” – din „Atențiunea mea <u class=s>a</u> făcut mare plăcere”',a:'verb auxiliar'},
   {w:'„sunt” – din „Nu e frumos când <u class=s>sunt</u> musafiri!”',a:'verb predicativ'}]},
 {part:2,nr:6,type:'open',pts:6,min:0,max:0,req:'Alcătuiește o propoziție negativă, în care pronumele personal „el” să fie în cazul dativ (1), și un enunț exclamativ, în care adverbul „acasă” să aibă funcția sintactică de atribut (2).',
  crit:[{c:'(1) Propoziție negativă',p:1},{c:'(1) Pronumele „el” în dativ (lui / îi)',p:1},{c:'(1) Norme de exprimare, ortografie, punctuație',p:1},{c:'(2) Enunț exclamativ',p:1},{c:'(2) „acasă” – atribut',p:1},{c:'(2) Norme de exprimare, ortografie, punctuație',p:1}],
  model:'(1) Nu i-am dat lui nicio jucărie. (2) Ce frumoasă e grădina de acasă!'},
 {part:2,nr:7,type:'clauses',pts:6,req:'Precizează felul fiecărei propoziții din fraza de mai jos (subordonatele valorează câte 2 p).',phrase:'Când am ajuns acasă, am înțeles de ce maiorul ieșise în vestibul, care era întunecat.',props:[
   {t:'Când am ajuns acasă',a:'circumstanțială de timp'},{t:'am înțeles',a:'principală'},{t:'de ce maiorul ieșise în vestibul',a:'completivă directă'},{t:'care era întunecat',a:'atributivă'}]},
 {part:2,nr:8,type:'forms',pts:6,req:'Alege forma corectă a cuvintelor din mesajul lui Ionel către musafir.',html:'„Domnule, [[0]] adus o minge grozavă! [[1]] plăcut tare mult. Mama zice că [[2]] supărat puțin din cauza dulceții, dar [[3]] trecut. Sper să [[4]] iar la noi. [[5]] din bloc vor să se joace și ei cu mingea.”',
  sel:[{o:['mi-ați','miați'],a:0},{o:['Mia','Mi-a'],a:1},{o:['v-ați','vați'],a:0},{o:['v-a','va'],a:0},{o:['vi','vii'],a:1},{o:['Copiii','Copii'],a:0}],
  e:'mi-ați adus · Mi-a plăcut · v-ați supărat · v-a trecut · să vii · Copiii (articulat)'},
 {part:3,nr:1,type:'essay',pts:20,min:150,max:0,req:'Scrie un text de minimum 150 de cuvinte, în care să prezinți o semnificație a/un mesaj al fragmentului din schița „Vizită...” de I.L. Caragiale (textul 1).',
  bullets:['să precizezi mesajul textului/o semnificație a textului, prin referire la temă','să prezinți două elemente specifice textului narativ prin care se construiește semnificația/mesajul','să interpretezi două secvențe din text, relevante pentru semnificație/mesaj','să menționezi o emoție exprimată a/un sentiment al unui personaj, justificându-ți alegerea'],
  crit:C_SEMN_EPIC,
  model:'Schița „Vizită...” de I.L. Caragiale are ca temă educația greșită a copiilor, iar mesajul ei este că un copil lăsat fără limite devine un mic tiran, iar răsfățul nu înseamnă iubire.\n\nUn prim element specific textului narativ este naratorul-personaj, musafirul, care povestește la persoana I și observă cu ironie tot ce se întâmplă. Al doilea element este personajul principal, Ionel, construit prin fapte: suflă în trâmbiță, atacă jupâneasa cu sabia, fumează și aruncă mingea până la policandru.\n\nO secvență relevantă este afirmația mamei: „trebuie să-i fac educația”. Ea contrastează puternic cu faptele, pentru că doamna Popescu nu-i interzice nimic copilului, ci îl sărută și îl scuipă „să nu-l deoache”. A doua secvență este finalul, în care naratorul descoperă că Ionel îi turnase „dulceață în șoșoni”. Răutatea copilului rămâne nepedepsită, iar musafirul suportă urmările.\n\nUn sentiment al naratorului este stânjeneala, justificată de faptul că nu știe cum să reacționeze când copilul îi cere foc: „Eu nu știu ce trebuie să fac”.\n\nAșadar, textul ne amuză, dar ne și avertizează că dragostea părintească are nevoie de reguli.'}
 ]},

{id:'s7', title:'Simularea 7 · „Iarna”', emoji:'❄️', sub:'Vasile Alecsandri (pastel) + text explicativ despre zăpadă · după modelul oficial 2027',
 texts:[
 {h:'Textul 1', html:`<p>Din văzduh cumplita iarnă cerne norii de zăpadă,<br>Lungi troiene călătoare adunate-n cer grămadă;<br>Fulgii zbor*, plutesc în aer ca un roi de fluturi albi,<br>Răspândind fiori de gheață pe ai țării umeri dalbi*.</p>
<p>Ziua ninge, noaptea ninge, dimineața ninge iară!<br>Cu o zale* argintie se îmbracă mândra țară;<br>Soarele rotund și palid se prevede* pintre nori<br>Ca un vis de tinerețe pintre anii trecători.</p>
<p>Tot e alb pe câmp, pe dealuri, împregiur, în depărtare,<br>Ca fantasme albe plopii înșirați se perd în zare,<br>Și pe-ntinderea pustie, fără urme, fără drum,<br>Se văd satele perdute sub clăbuci albii* de fum.</p>
<p>Dar ninsoarea încetează, norii fug, doritul soare<br>Strălucește și dismiardă oceanul de ninsoare.<br>Iată-o sanie ușoară care trece peste văi...<br>În văzduh voios răsună clinchete de zurgălăi.</p>`,
  src:'Vasile Alecsandri, <i>Iarna</i><br>*zbor – zboară (formă veche); *dalb – alb, imaculat; *zale – armură din inele mici de fier; *a se prevedea – a se întrezări; *albiu – albicios'},
 {h:'Textul 2', html:`<p><b>De ce scârțâie zăpada?</b></p>
<p>Un fulg de zăpadă se naște sus, în nori, atunci când vaporii de apă îngheață în jurul unui grăunte minuscul de praf. Cristalul de gheață crește pe măsură ce cade și capătă, de obicei, o formă cu șase brațe. Pentru că temperatura și umezeala se schimbă de la un loc la altul, doi fulgi nu cresc niciodată exact la fel.</p>
<p>Fiecare cristal este, de fapt, transparent, ca gheața dintr-un pahar. Zăpada ni se pare albă pentru că milioanele de cristale și aerul dintre ele împrăștie lumina în toate direcțiile.</p>
<p>Zăpada proaspăt căzută conține foarte mult aer – uneori peste 90% din volumul ei. De aceea, ea este un bun izolator: sub stratul de nea, pământul nu îngheață la fel de tare, iar semințele și unele animale mici trec mai ușor iarna.</p>
<p>Dacă ați observat că zăpada scârțâie sub ghete doar în zilele foarte geroase, aveți dreptate. Când temperatura scade sub aproximativ –10 °C, cristalele sunt tari și se rup cu un sunet scurt atunci când călcăm pe ele. Pe vreme mai blândă, ele se topesc puțin sub greutatea noastră și alunecă fără zgomot.</p>
<p>Primul om care a fotografiat un fulg de zăpadă a fost americanul Wilson Bentley, în 1885. El a adunat, în timpul vieții, peste cinci mii de fotografii cu fulgi.</p>`, src:'text realizat pentru acest exercițiu'}
 ],
 items:[
 {part:1,nr:1,type:'blanks',pts:2,req:'Completează spațiile punctate cu informațiile din textul 1.',html:'Fulgii plutesc în aer ca un roi de {{0}} albi, iar plopii înșirați se pierd în zare ca niște {{1}} albe.',ans:[['fluturi'],['fantasme']]},
 {part:1,nr:2,type:'mc',pts:2,req:'Încercuiește litera corespunzătoare răspunsului corect, valorificând informațiile din textul 1. Apariția saniei în ultima strofă sugerează',o:['revenirea vieții și a bucuriei după ninsoare.','plecarea oamenilor din satele pierdute.','începutul unei noi furtuni de zăpadă.','tristețea eului liric în fața iernii.'],a:0,e:'Soarele „strălucește”, iar „voios răsună clinchete de zurgălăi” – lumea se trezește la viață.'},
 {part:1,nr:3,type:'mc',pts:2,req:'Încercuiește litera corespunzătoare răspunsului corect, valorificând informațiile din textul 2. Zăpada ni se pare albă deoarece',o:['cristalele și aerul dintre ele împrăștie lumina.','cristalele de gheață sunt colorate în alb.','fulgii conțin mult praf.','zăpada reflectă culoarea norilor.'],a:0,e:'„milioanele de cristale și aerul dintre ele împrăștie lumina în toate direcțiile”.'},
 {part:1,nr:4,type:'mc',pts:2,req:'Încercuiește litera corespunzătoare răspunsului corect, valorificând informațiile din textul 2. Zăpada este un bun izolator, deoarece',o:['conține foarte mult aer.','este foarte grea.','se topește repede.','are cristale colorate.'],a:0,e:'„conține foarte mult aer – uneori peste 90% din volumul ei. De aceea, ea este un bun izolator”.'},
 {part:1,nr:5,type:'tf',pts:6,req:'Notează „X” în dreptul fiecărui enunț pentru a marca dacă acesta este adevărat sau fals, bazându-te pe informațiile din cele două texte.',rows:[
   {t:'Textul 1: Ninsoarea durează o singură zi.',a:false},
   {t:'Textul 1: Soarele este comparat cu un vis de tinerețe.',a:true},
   {t:'Textul 1: Satele se văd limpede, fără fum.',a:false},
   {t:'Textul 2: Fiecare cristal de gheață este, de fapt, transparent.',a:true},
   {t:'Textul 2: Wilson Bentley a fotografiat primul fulg de zăpadă în 1885.',a:true},
   {t:'Textul 2: Pe vreme blândă, zăpada scârțâie mai tare.',a:false}]},
 {part:1,nr:6,type:'open',pts:6,min:0,max:0,minSent:2,req:'Precizează, în minimum două enunțuri, o trăsătură a tiparului textual descriptiv, identificată în textul 1, ilustrând-o cu o secvență relevantă.',crit:C_TIPAR,
  model:'O trăsătură a tiparului textual descriptiv este folosirea imaginilor artistice vizuale, realizate prin epitete și comparații. De exemplu, în secvența „Soarele rotund și palid se prevede pintre nori”, epitetele „rotund” și „palid” redau imaginea unui soare slab, abia vizibil prin ninsoare.'},
 {part:1,nr:7,type:'open',pts:6,min:30,max:0,req:'Prezintă, în minimum 30 de cuvinte, o diferență de limbaj între cele două texte, valorificând câte o secvență relevantă din fiecare text.',crit:C_COMPAR,
  model:'Textul 1 folosește un limbaj expresiv, figurat, cu comparații și epitete: fulgii plutesc „ca un roi de fluturi albi”. Textul 2 folosește un limbaj științific, precis, cu termeni de specialitate și cifre: „Când temperatura scade sub aproximativ –10 °C, cristalele sunt tari”. Primul text transmite emoții, al doilea explică un fenomen.'},
 {part:1,nr:8,type:'open',pts:6,min:50,max:100,req:'Crezi că este important să înțelegem fenomenele naturii pe care le vedem în fiecare zi? Motivează, în 50–100 de cuvinte, răspunsul la întrebarea dată, valorificând textul 2.',crit:C_OPINIE,
  model:'Cred că este important să înțelegem fenomenele naturii. Textul 2 ne arată că zăpada nu este doar frumoasă, ci și utilă: stratul de nea, care conține mult aer, protejează pământul, semințele și animalele mici. Când știm acest lucru, prețuim mai mult natura și o protejăm. În plus, explicațiile despre scârțâitul zăpezii sau despre fulgii cu șase brațe ne fac mai curioși și mai atenți la ce ne înconjoară. Așadar, cunoașterea face lumea mai interesantă.'},
 {part:1,nr:9,type:'open',pts:6,min:50,max:100,req:'Asociază poezia „Iarna” de Vasile Alecsandri cu un alt text literar studiat la clasă sau citit ca lectură suplimentară, prezentând, în 50–100 de cuvinte, o valoare comună, prin referire la câte o secvență relevantă din fiecare text.',crit:C_ASOC,
  model:'Poezia „Iarna” de Vasile Alecsandri poate fi asociată cu „Iarna pe uliță” de George Coșbuc, prin valoarea frumuseții naturii și a bucuriei pe care o aduce iarna. La Alecsandri, după ninsoare, „În văzduh voios răsună clinchete de zurgălăi”. La Coșbuc, iarna adună copiii pe uliță, iar ninsoarea începe încet: „A-nceput de ieri să cadă / Câte-un fulg”. Ambele texte arată că iarna, deși aspră, poate fi un anotimp al bucuriei.'},
 {part:2,nr:1,type:'mc',pts:2,req:'Încercuiește litera corespunzătoare răspunsului corect. Conțin diftong ambele cuvinte din seria:',o:['„iarnă”, „soare”','„aer”, „dealuri”','„ninge”, „zurgălăi”','„pustie”, „gheață”'],a:0,e:'iar-nă (ia), soa-re (oa). „aer” și „pustie” au hiat; în „gheață”, „e” e literă ajutătoare.'},
 {part:2,nr:2,type:'mc',pts:2,req:'Încercuiește litera corespunzătoare răspunsului corect. Cuvintele subliniate în secvențele „Cu o zale <u class=s>argintie</u> (1)” și „<u class=s>Ziua</u> (2) ninge” s-au format prin:',o:['derivare (1), conversiune (2).','compunere (1), derivare (2).','derivare (1), derivare (2).','conversiune (1), compunere (2).'],a:0,e:'argint + -iu (derivare); „ziua” – substantiv folosit ca adverb de timp (conversiune).'},
 {part:2,nr:3,type:'mc',pts:2,req:'Încercuiește litera corespunzătoare răspunsului corect. Cuvântul subliniat în versul „Strălucește și <u class=s>dismiardă</u> oceanul de ninsoare” are sensul de',o:['mângâie.','topește.','acoperă.','ascunde.'],a:0,e:'„a dismierda” (azi: a dezmierda) = a mângâia.'},
 {part:2,nr:4,type:'mc',pts:2,req:'Încercuiește litera corespunzătoare răspunsului corect. Sunt sinonime cuvintele din seria:',o:['„cumplită” – „aspră”','„palid” – „strălucitor”','„văzduh” – „pământ”','„pustie” – „populată”'],a:0,e:'Celelalte perechi sunt antonime.'},
 {part:2,nr:5,type:'morph',pts:6,req:'Menționează valoarea morfologică a fiecărui cuvânt subliniat.',rows:[

 {part:3,nr:1,type:'essay',pts:20,min:150,max:0,req:'Scrie un text de minimum 150 de cuvinte, în care să prezinți o semnificație a/un mesaj al poeziei „Iarna” de Vasile Alecsandri (textul 1).',
  bullets:['să precizezi mesajul textului/o semnificație a textului, prin referire la temă','să prezinți două elemente specifice textului liric (de exemplu: imaginile artistice, figurile de stil, versificația, vocea lirică) prin care se construiește semnificația/mesajul','să interpretezi două secvențe din text, relevante pentru semnificație/mesaj','să menționezi un sentiment al eului liric, justificându-ți alegerea'],
  crit:[{c:'Mesajul/semnificația poeziei',p:1},{c:'Tema',p:1},{c:'Primul element specific textului liric (adecvat 2 p, schematic 1 p)',p:2},{c:'Al doilea element specific textului liric',p:2},{c:'Interpretarea primei secvențe (adecvat 2 p, încercare 1 p)',p:2},{c:'Interpretarea celei de-a doua secvențe',p:2},{c:'Sentimentul eului liric – menționare',p:1},{c:'Sentimentul – justificare',p:1}],
  model:'Poezia „Iarna” de Vasile Alecsandri este un pastel care are ca temă natura în anotimpul rece. Mesajul ei este că iarna, deși la început pare cumplită, ascunde o frumusețe luminoasă și aduce bucurie.\n\nUn prim element specific textului liric este imaginea artistică vizuală. Culoarea dominantă este albul: „Tot e alb pe câmp, pe dealuri, împregiur, în depărtare”. Al doilea element îl reprezintă figurile de stil, mai ales comparațiile, ca în versul „Fulgii zbor, plutesc în aer ca un roi de fluturi albi”, care transformă ninsoarea într-un spectacol delicat.\n\nSecvența „Ziua ninge, noaptea ninge, dimineața ninge iară!” folosește repetiția verbului „ninge” pentru a sugera o ninsoare fără sfârșit, care acoperă totul. A doua secvență, „În văzduh voios răsună clinchete de zurgălăi”, aduce o imagine auditivă veselă: viața revine după ce ninsoarea încetează.\n\nSentimentul eului liric este admirația, justificată de epitetul „mândra țară” și de exclamația din strofa a doua.\n\nAșadar, poezia ne învață să vedem frumusețea chiar și în anotimpul cel mai aspru.'}
 ]},

{id:'s8', title:'Simularea 8 · „Zâna Munților”', emoji:'🕊️', sub:'basm cules de Petre Ispirescu + articol despre turturică · după modelul oficial 2027',
 texts:[
 {h:'Textul 1', html:`<p>A fost odată un împărat foarte viteaz; toate împărățiile dimprejurul împărăției sale îi cereau sfaturi: atâta era de drept și înțelept. Când se isca sfadă* între dânșii, la acest împărat mergeau mai întâi la judecată și, cum zicea el așa se și făcea, fiindcă era judecător drept și iubitor de pace. Când fu aproape de bătrânețe îi dărui Dumnezeu un fecior. Nu se poate spune câtă bucurie simți împăratul când văzu că dobândi un moștenitor. [...]</p>
<p>După ce se mări, îl puse de învăță carte. El era așa de silitor, încât se mirau dascălii de dânsul cum de învață așa repede. Ceea ce învățau ceilalți copii într-un an, el învăța numai într-o săptămână. Ajunsese să nu mai aibă dascălii ce să-i dea să învețe. Iară tată-său scrise carte împărătească la niște filozofi* vestiți ca să vie să ispitească cu învățăturile lor pe fiul său.</p>
<p>La curtea acelui împărat se afla pe atunci un vânător vestit; și, până să vie filozofii cei vestiți, împăratul dete pe fiu-său acestui vânător ca să-l învețe meșteșugul său. [...] Iară el de ce se mărea d-aia se făcea mai cu minte și mai frumos. [...] N-ajunsese să-și răsucească mustăcioara, și foile de zestre curgeau de la fel de fel de împărați, care voiau să-și dea fetele după dânsul, dară el nu voia să se însoare așa de tânăr.</p>
<p>Într-una din zile mergând la vânătoare, văzu o turturică, care tot sărea înaintea lui; lui îi fu milă să o vâneze; el căuta vânaturi mari, fiindcă nu se temea de primejdii; era vânător meșter și viteaz. În cele din urmă, dacă văzu și văzu că tot îi sărea în cale, întinse arcul și dete cu o săgeată. El se miră prea mult cum de nu o putu omorî el, care era așa de bun vânător, ci o răni puțin în aripă, care, așa rănită, se duse de nu o mai văzu. Cum se duse turturica, simți, nu știu cum, nu știu de ce, că îi tâcâia inima.</p>
<p>După ce se întoarse acasă, era tot cam galeș*. Împăratul văzând că tânjește* fiu-său cu sănătatea, îl întrebă ce are, iară el răspunse că n-are nimic.</p>
<p>Turturica aceea era Zâna Munților care se îndrăgostise de frumusețea lui. Ei nu-i venea la socoteală să se arate lui aievea*, ca să-i dea pricină, și d-aia se făcuse turturică și îi tot sărea în cale. Nu știa însă cum să facă, cum să dreagă, ca să se cunoască cu fiul împăratului.</p>`,
  src:'Petre Ispirescu, <i>Zâna Munților</i> (fragment)<br>*sfadă – ceartă; *filozof – om învățat; *galeș – melancolic, trist; *a tânji – a fi slăbit, bolnăvicios; *aievea – în realitate'},
 {h:'Textul 2', html:`<p><b>Turturica, glasul verii</b></p>
<p>Turturica (<i>Streptopelia turtur</i>) este una dintre cele mai mici specii de porumbei sălbatici din Europa. O recunoști ușor după penele ruginii, cu pete negre, de pe spate și după gâtul împodobit cu dungi alb-negre. Numele ei vine chiar de la cântecul pe care îl scoate: un „turrr-turrr” moale, care se aude în zilele calde de vară.</p>
<p>Turturica este o pasăre migratoare. Ajunge în România la sfârșitul lui aprilie sau la începutul lui mai, își face cuibul în tufișuri și la marginea pădurilor, iar toamna pleacă spre Africa, la sud de deșertul Sahara.</p>
<p>În ultimele decenii, numărul turturelelor din Europa a scăzut îngrijorător. Cauzele sunt mai multe: dispariția gardurilor vii și a tufărișurilor, folosirea pesticidelor, care distrug semințele buruienilor cu care se hrănește, dar și vânătoarea din timpul migrației. Uniunea Internațională pentru Conservarea Naturii o consideră specie vulnerabilă.</p>
<p>Ornitologii spun că fiecare dintre noi poate ajuta: păstrând tufișurile de la marginea câmpurilor, renunțând la otrăvurile din grădină și raportând pe platformele de observații ale voluntarilor păsările văzute.</p>`, src:'articol realizat pentru acest exercițiu'}
 ],

  model:'O trăsătură a tiparului textual narativ este succesiunea de acțiuni, redate prin verbe la timpuri trecute. De exemplu, în secvența „întinse arcul și dete cu o săgeată”, verbele la perfect simplu prezintă, una după alta, faptele fiului de împărat.'},
 {part:1,nr:7,type:'open',pts:6,min:30,max:0,req:'Prezintă, în minimum 30 de cuvinte, un element de conținut comun celor două texte, valorificând câte o secvență relevantă din fiecare text.',crit:C_COMUN,

 {part:1,nr:8,type:'open',pts:6,min:50,max:100,req:'Crezi că oamenii au datoria să ocrotească păsările sălbatice? Motivează, în 50–100 de cuvinte, răspunsul la întrebarea dată, valorificând textul 2.',crit:C_OPINIE,
  model:'Cred că oamenii au datoria să ocrotească păsările sălbatice, pentru că tot ei le pun în pericol. Textul 2 arată că numărul turturelelor a scăzut din cauza pesticidelor, a dispariției tufișurilor și a vânătorii. Dacă oamenii au produs aceste schimbări, tot ei le pot repara. Ornitologii explică faptul că fiecare poate ajuta, de exemplu „renunțând la otrăvurile din grădină”. Așadar, ocrotirea păsărilor este o responsabilitate a tuturor.'},
 {part:1,nr:9,type:'open',pts:6,min:50,max:100,req:'Asociază fragmentul din basmul „Zâna Munților” cu un alt text literar studiat la clasă sau citit ca lectură suplimentară, prezentând, în 50–100 de cuvinte, o valoare comună, prin referire la câte o secvență relevantă din fiecare text.',crit:C_ASOC,
  model:'Basmul „Zâna Munților” poate fi asociat cu „Tinerețe fără bătrânețe și viață fără de moarte”, cules tot de Petre Ispirescu, prin prețuirea învățăturii. Fiul de împărat din primul text învăța „într-o săptămână” ceea ce alții învățau într-un an. La fel, Făt-Frumos din al doilea basm învăța foarte repede și îi uimea pe dascăli. Ambele texte arată că înțelepciunea și dorința de a învăța sunt calități ale eroului.'},
 {part:2,nr:1,type:'mc',pts:2,req:'Încercuiește litera corespunzătoare răspunsului corect. Conțin diftong ambele cuvinte din seria:',o:['„vânătoare”, „iară”','„turturică”, „fecior”','„filozofi”, „aievea”','„săgeată”, „inima”'],a:0,e:'vâ-nă-toa-re (oa), ia-ră (ia). În „fecior” și „săgeată”, „i”/„e” sunt litere ajutătoare.'},

  crit:SIMS[1].items.find(i=>i.type==='essay').crit,
  model:'Fiul de împărat este personajul principal al fragmentului din basmul „Zâna Munților”, cules de Petre Ispirescu. El este singurul fecior și moștenitorul unui împărat drept și înțelept, născut când tatăl său era „aproape de bătrânețe”, iar fetele de împărat îl doresc de soț.\n\nO primă trăsătură este hărnicia la învățătură. Naratorul îl caracterizează direct: „El era așa de silitor, încât se mirau dascălii de dânsul”. Ceea ce alții învățau într-un an, el învăța „într-o săptămână”, așa că tatăl său trebuie să aducă filozofi vestiți.\n\nA doua trăsătură este bunătatea, reieșită indirect din fapte. Deși era un vânător „meșter și viteaz”, lui „îi fu milă” de turturică și nu voia s-o vâneze. Doar când pasărea îi sare mereu în cale, trage cu arcul, iar apoi devine trist, „cam galeș”.\n\nPrin urmare, personajul este construit prin caracterizare directă (de către narator) și indirectă (prin fapte și gesturi).\n\nO valoare a personajului este prețuirea învățăturii. Și eu cred că învățătura este importantă, pentru că, la fel ca fiul de împărat, care îi uimea pe dascăli, un elev care învață cu drag își poate alege singur drumul în viață.'}

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip = h => String(h).replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/\n{3,}/g,'\n\n').trim();
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pad = n => String(n).padStart(2,'0');
const dayKey = (d=new Date()) => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const yday = () => { const d=new Date(); d.setDate(d.getDate()-1); return dayKey(d); };
const wc = s => (String(s||'').trim().match(/[A-Za-zĂÂÎȘȚăâîșțŞŢşţÀ-ž0-9]+(?:[-’'][A-Za-zĂÂÎȘȚăâîșțşţ]+)*/g)||[]).length;
const sentCount = s => String(s||'').split(/[.!?…]+/).filter(x=>x.trim().split(/\s+/).length>=3).length;
const deacc = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'');
function norm(s, strict){ s = String(s||'').toLowerCase().replace(/ş/g,'ș').replace(/ţ/g,'ț').replace(/[„”"“'’.,!?;:()]/g,' ').replace(/\s+/g,' ').trim(); return strict ? s : deacc(s); }
const fmt = n => (Math.round(n*100)/100).toLocaleString('ro-RO',{minimumFractionDigits:2,maximumFractionDigits:2});
function seeded(seed){ let s=0; for(const c of seed) s=(s*31+c.charCodeAt(0))>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
const noteLevel = n => NOTE_LEVELS.find(l => n >= l.min);

let saveT = null, writing = false, pendingWrite = false;
function save(){
  ST.updated = Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(ST)); }catch(e){}
  clearTimeout(saveT); saveT = setTimeout(cloudWrite, 1500);
  if(SY.token && SY.gist){ clearTimeout(SY.t); SY.t = setTimeout(()=>ghPush(false), 2500); }

async function cloudWrite(){
  if(!CAP.db || !CAP.uid) return;
  if(writing){ pendingWrite = true; return; }
  writing = true;
  try{ await CAP.db.doc('data/users/'+CAP.uid+'/progress').set(JSON.parse(JSON.stringify(ST))); CAP.sync='cloud'; }
  catch(e){ if(e && (e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')) { CAP.db=null; CAP.sync='local'; } }
  writing = false; renderSync();
  if(pendingWrite){ pendingWrite=false; cloudWrite(); }
}
async function initCaps(){
  if(!(window.claude && typeof window.claude.use === 'function')) { CAP.ready = true; renderSync(); return; }
  try{ CAP.sample = await window.claude.use('sample'); }catch(e){ CAP.sample = null; }
  try{
    CAP.user = await window.claude.use('user');
    CAP.db = await window.claude.use('db');
    if(CAP.user && CAP.db){
      CAP.uid = await CAP.user.id();
      if(CAP.uid){
        const t = setTimeout(()=>{ renderSync(); }, 10000);
        const snap = await CAP.db.doc('data/users/'+CAP.uid+'/progress').get();
        clearTimeout(t);
        if(snap.exists){
          const remote = snap.data();
          if(remote && (remote.updated||0) > (ST.updated||0)){ ST = Object.assign({}, DEF, JSON.parse(JSON.stringify(remote))); try{localStorage.setItem(LS_KEY, JSON.stringify(ST));}catch(e){} render(); }
          else if((ST.updated||0) > (remote.updated||0)) cloudWrite();
        } else if(ST.updated) cloudWrite();
        CAP.sync = 'cloud';
      } else CAP.db = null;
    } else CAP.db = null;
  }catch(e){ CAP.db = null; CAP.sync = 'local'; }
  CAP.ready = true; renderSync(); renderTop();
}

// ---------- XP, level, streak ----------
const levelOf = xp => Math.floor(Math.sqrt(xp/40))+1;
const xpFor = l => 40*(l-1)*(l-1);
const rankOf = l => RANKS.slice().reverse().find(r => l >= r.l);
function curStreak(){ if(!ST.lastDay) return 0; return (ST.lastDay===dayKey()||ST.lastDay===yday()) ? ST.streak : 0; }
function addXP(n){
  if(n<=0) return;
  const before = levelOf(ST.xp);
  ST.xp += n; const t = dayKey();
  ST.days[t] = (ST.days[t]||0) + n;
  if(ST.lastDay !== t){ ST.streak = (ST.lastDay===yday()) ? ST.streak+1 : 1; ST.lastDay = t; }
  const after = levelOf(ST.xp);
  if(after > before) setTimeout(()=>toast('⬆️ Nivel nou: '+after+' · '+rankOf(after).e+' '+rankOf(after).n), 600);
  checkBadges();
}
function award(id){ if(!ST.badges.includes(id)){ ST.badges.push(id); const b = BADGES.find(x=>x.id===id); setTimeout(()=>toast('🏅 Insignă nouă: '+b.e+' '+b.n), 1200); } }
function checkBadges(){
  if(curStreak()>=3) award('streak3'); if(curStreak()>=7) award('streak7');
  if(ST.xp>=1000) award('xp1000');
  if(GRAM.every(m => (ST.mods[m.id]||{}).stars>0)) award('gramAll');
  if(LIT.every(m => (ST.mods[m.id]||{}).stars>0)) award('litAll');
  if(ST.fixed>=20) award('fixer');
  if(ST.maxCombo>=10) award('combo10');
}
function toast(msg){ document.querySelectorAll('.toast').forEach(t=>t.remove()); const d=document.createElement('div'); d.className='toast'; d.innerHTML=msg; document.body.appendChild(d); setTimeout(()=>d.remove(), 2600); }

let AC=null;
function beep(ok){ if(!ST.sound) return; try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(), g=AC.createGain(); o.connect(g); g.connect(AC.destination); const t=AC.currentTime; o.type='triangle';
  if(ok){ o.frequency.setValueAtTime(660,t); o.frequency.setValueAtTime(990,t+.09); } else { o.frequency.setValueAtTime(220,t); o.frequency.setValueAtTime(160,t+.12); }
  g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.28); o.start(t); o.stop(t+.3); }catch(e){} }
function confetti(){
  const c=document.createElement('canvas'); c.className='confetti'; c.width=innerWidth; c.height=innerHeight; document.body.appendChild(c);
  const x=c.getContext('2d'), cols=['#58cc02','#1cb0f6','#ffc800','#a560f8','#ff4b4b','#ff9600'];
  const P=[...Array(140)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:5+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6}));
  let f=0; (function step(){ x.clearRect(0,0,c.width,c.height); P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();}); if(++f<170) requestAnimationFrame(step); else c.remove(); })();
}

function ansText(q,a){ if(a==null||a==='') return '<i>(fără răspuns)</i>'; if(a==='__timeout__') return '⏱️ timpul a expirat';

  if(q.t==='drop') return q.rows.map((r,j)=>strip(r.w)+': '+esc((a||[])[j]||'—')).join(' · '); if(q.t==='wr') return esc(a); if(q.t==='mc') return q.o[a]; if(q.t==='tf') return a?'Adevărat':'Fals'; if(q.t==='in') return esc(Array.isArray(a)?a[0]:a); return esc(a); }
function isRight(q,a){ if(a==='__timeout__') return false;

  if(q.t==='ms') return Array.isArray(a) && a.length===q.a.length && q.a.every(i=>a.includes(i));
  if(q.t==='drop') return Array.isArray(a) && q.rows.every((r,j)=>a[j]===r.a);
  if(q.t==='wr'){ if(q.check==='coord') return coordOK(q,a); return q.a.some(x=>normW(x,false)===normW(a,false)); }
  return a===q.a; }
function normW(s, strict){ s=String(s||'').toLowerCase().replace(/ş/g,'ș').replace(/ţ/g,'ț').replace(/[„”“"«»]/g,'').replace(/[’']/g,'’').replace(/\s+/g,' ').replace(/\s+([,.;:!?])/g,'$1').replace(/[.!?…\s]+$/,'').trim(); return strict?s:deacc(s); }

  return words.length-idx-1>=2; }
function diffHTML(a,b){ const wa=String(a||'').split(/\s+/).filter(Boolean), wb=String(b||'').split(/\s+/).filter(Boolean); const nb=wb.map(w=>normW(w,true)); const out=wa.map(w=>{ const ok=nb.includes(normW(w,true)); return ok?esc(w):`<span style="background:rgba(255,75,75,.35);border-radius:4px;padding:0 2px">${esc(w)}</span>`; }).join(' '); return `<div class="small" style="margin-top:4px">Ce ai scris (cu roșu – ce diferă): ${out}</div>`; }
function pCheck(){

function wcLabel(it,w){ const lim = it.max ? `${it.min}–${it.max}` : (it.min?`min. ${it.min}`:''); const ok = (!it.min||w>=it.min)&&(!it.max||w<=it.max); return `${w} cuvinte${lim?` · cerință: ${lim} ${ok?'✅':'⚠️'}`:''}`; }
function tick(){ const el=$('#timer'); if(!el||!SM||!SM.start) return; const left = 120*60 - Math.floor((Date.now()-SM.start)/1000);

// ----- grading -----
function autoGrade(it, a){
  if(it.type==='blanks'){ const det = it.ans.map((acc,j)=>acc.some(x=>norm(x)===norm((a||[])[j]))); return {pts:det.filter(Boolean).length, det}; }
  if(it.type==='mc') return {pts: a===it.a ? it.pts : 0};
  if(it.type==='tf'){ const det = it.rows.map((r,j)=>(a||[])[j]===r.a); return {pts:det.filter(Boolean).length, det}; }
  if(it.type==='morph'){ const det = it.rows.map((r,j)=>(a||[])[j]===r.a); return {pts:2*det.filter(Boolean).length, det}; }
  if(it.type==='clauses'){ const det = it.props.map((p,j)=>(a||[])[j]===p.a); const pts = Math.min(it.pts, 2*it.props.filter((p,j)=>p.a!=='principală'&&det[j]).length); return {pts, det}; }
  if(it.type==='forms'){ const det = it.sel.map((s,j)=>(a||[])[j]===s.a); return {pts:det.filter(Boolean).length, det}; }
  return null;
}
function fullCrit(it){ return it.type==='essay' ? it.crit.concat(RED_CRIT) : it.crit; }
function localRules(it, a, pts){
  // aplică regulile de barem care se pot verifica automat
  const crit = fullCrit(it), w = wc(a), out = pts.slice();
  const empty = !String(a||'').trim();
  crit.forEach((c,i)=>{
    if(/cuvinte/.test(c.c)){ const ok = (!it.min||w>=it.min)&&(!it.max||w<=it.max); out[i] = ok && !empty ? c.p : 0; }
    if(/două enunțuri/.test(c.c)){ out[i] = sentCount(a)>=2 ? c.p : 0; }
  });
  if(it.type==='essay'){ const n0 = it.crit.length; const okLen = w >= it.min; if(!okLen || empty) for(let i=n0;i<crit.length;i++) out[i]=0; }
  if(empty) return out.map(()=>0);
  return out;
}
async function aiGrade(it, answer, s){
  const crit = fullCrit(it), w = wc(answer);
  const texts = s ? s.texts.map(t=>t.h+':\n'+strip(t.html)).join('\n\n') : '';
  const prompt = `Ești profesor evaluator la Evaluarea Națională pentru clasa a VIII-a (Limba și literatura română, România). Corectează STRICT după barem răspunsul unui elev. Fii corect și realist, nici generos, nici excesiv de sever, exact ca un evaluator oficial.

TEXTELE-SUPORT:
${texts}

CERINȚA (${it.pts} puncte): ${strip(it.req)}
${it.bullets?'Cerințe obligatorii:\n- '+it.bullets.join('\n- '):''}

BAREMUL (criterii, în ordine):
${crit.map((c,i)=>`${i+1}. ${c.c} – maximum ${c.p} p`).join('\n')}

Principii: se punctează orice modalitate corectă de rezolvare; punctajele sunt numere întregi între 0 și maximul criteriului; criteriile de exprimare/ortografie/punctuație și de număr de cuvinte se acordă doar dacă cerința este rezolvată.${it.type==='essay'?' Criteriile de redactare se acordă doar dacă textul are numărul minim de cuvinte și tratează subiectul. Pentru lizibilitate, acordă punctul dacă textul este îngrijit (este scris pe calculator).':''}
${it.model?'Răspuns-model orientativ (NU este singurul corect): '+it.model:''}

RĂSPUNSUL ELEVULUI (${w} cuvinte, numărate automat):
"""${answer}"""

Răspunde DOAR cu un obiect JSON, fără alt text, de forma:
{"criterii":[{"puncte":0,"comentariu":"scurt, în română"}],"feedback":"2-3 propoziții prietenoase, la persoana a II-a, cu ce a făcut bine și ce să îmbunătățească","greseli":["greșeli de ortografie/punctuație/exprimare găsite, cu forma corectă"]}
Lista "criterii" trebuie să aibă exact ${crit.length} elemente, în ordinea baremului.`;
  let r = null;
  try{ r = await CAP.sample.json(prompt, {modelTier:'default'}); }catch(e){ r = null; }
  if(!r || typeof r!=='object' || !Array.isArray(r.criterii)){
    const t = await CAP.sample(prompt, {modelTier:'default'}); const txt = (t&&t.text)||String(t||''); const m = txt.match(/\{[\s\S]*\}/); r = m ? JSON.parse(m[0]) : null; }
  if(!r || !Array.isArray(r.criterii)) throw new Error('format');
  let pts = crit.map((c,i)=>Math.max(0,Math.min(c.p, Math.round(+((r.criterii[i]||{}).puncte)||0))));
  pts = localRules(it, answer, pts);
  return {mode:'ai', pts, com: crit.map((c,i)=>String((r.criterii[i]||{}).comentariu||'')), feedback:String(r.feedback||''), errors:Array.isArray(r.greseli)?r.greseli.map(String).slice(0,10):[]};
}
async function gradeSim(useAI){
  const s = SIMMAP[SM.id]; stopTimer();
  const res = {items:{}, ai:useAI};
  s.items.forEach(it=>{ const g = autoGrade(it, SM.ans[ikey(it)]); if(g) res.items[ikey(it)] = Object.assign(g,{max:it.pts}); });
  const open = s.items.filter(it=>it.type==='open'||it.type==='essay');
  SM.phase='grading'; SM.prog=5; SM.msg='Corectez itemii închiși…'; render();
  for(let i=0;i<open.length;i++){
    const it=open[i], k=ikey(it), a=SM.ans[k]||'';
    SM.msg = `Corectez ${it.part===3?'compunerea':'itemul '+it.nr+(it.part===2?' (Partea a II-a)':'')}… (${i+1}/${open.length})`; SM.prog = 5+Math.round(90*i/open.length); render();
    let g = null;
    if(useAI && CAP.sample && String(a).trim()){ try{ g = await aiGrade(it, a, s); }catch(e){ if(e && e.code==='not_granted'){ CAP.sample=null; } g=null; } }
    if(!g) g = {mode: String(a).trim()?'self':'empty', pts: localRules(it,a,fullCrit(it).map(()=>0)), com:[], feedback:'', errors:[]};
    g.max = it.pts; g.sum = g.pts.reduce((x,y)=>x+y,0); res.items[k]=g;
  }
  SM.res = res; SM.attempt = Date.now(); SM.phase='result'; recordSim(); try{ localStorage.removeItem(draftKey(SM.id)); }catch(e){}
  render(); window.scrollTo(0,0);
  const t = simTotal(); if(t.nota>=8.5) confetti();
}
function simTotal(){

}
function recordSim(){

}

   <div class="row" style="justify-content:center;margin-top:14px"><button class="btn sm" onclick="A.sim('${s.id}')">🔁 Reia simularea</button><button class="btn blue sm" onclick="A.back()">Gata</button></div></div>
  ${anySelf?`<div class="trap"><b>✍️ Autoevaluare:</b> la răspunsurile scrise, bifează sincer punctajele după barem (folosește răspunsul-model ca reper). Nota se actualizează automat.</div>`:''}
  ${[1,2,3].map(p=>`<div class="subtitle">${['','Subiectul I – Partea I','Subiectul I – Partea a II-a','Subiectul al II-lea'][p]}</div>`+s.items.filter(i=>i.part===p).map(it=>revItem(it)).join('')).join('')}`;

function revItem(it){
  const k=ikey(it), a=SM.ans[k], g=SM.res.items[k]; const got = g.sum!=null?g.sum:g.pts;
  const head = `<div class="ih"><span class="nr">${it.part===3?'✍️':it.nr+'.'}</span><span class="req small">${it.req}</span><span class="pts ${got===it.pts?'ok-t':got===0?'bad-t':''}">${got}/${it.pts} p</span></div>`;
  let body='';
  if(it.type==='blanks') body = it.ans.map((acc,j)=>`<div class="small">${g.det[j]?'✅':'❌'} Spațiul ${j+1}: <b>${esc((a||[])[j]||'—')}</b>${!g.det[j]?` → corect: <b class="ok-t">${esc(acc[0])}</b>`:''}</div>`).join('');
  if(it.type==='mc') body = `<div class="small">Răspunsul tău: <b>${a!=null?'abcd'[a]+') '+it.o[a]:'—'}</b>${a!==it.a?`<br>Corect: <b class="ok-t">${'abcd'[it.a]}) ${it.o[it.a]}</b>`:''}</div><div class="small mut">💡 ${it.e}</div>`;
  if(it.type==='tf') body = it.rows.map((r,j)=>`<div class="small">${g.det[j]?'✅':'❌'} ${r.t} → <b>${r.a?'Adevărat':'Fals'}</b></div>`).join('');
  if(it.type==='morph') body = it.rows.map((r,j)=>`<div class="small">${g.det[j]?'✅':'❌'} ${r.w}: tu – <b>${esc((a||[])[j]||'—')}</b>${!g.det[j]?` · corect – <b class="ok-t">${r.a}</b>`:''}</div>`).join('');
  if(it.type==='clauses') body = `<div class="small dim"><i>${esc(it.phrase)}</i></div>`+it.props.map((p,j)=>`<div class="small">${g.det[j]?'✅':'❌'} „${esc(p.t)}” – tu: <b>${esc((a||[])[j]||'—')}</b>${!g.det[j]?` · corect: <b class="ok-t">${p.a}</b>`:''}</div>`).join('');

function openReview(it,k,a,g){
  const crit = fullCrit(it); const w=wc(a||'');

      ? `<select class="inp" style="width:auto;padding:4px 8px" onchange="A.selfPts('${k}',${i},+this.value)">${[...Array(c.p+1).keys()].map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`
      : `<b>${v}/${c.p}</b>`;
    return `<div class="crit"><span>${c.c}${g.com&&g.com[i]?`<br><span class="tiny dim">${esc(g.com[i])}</span>`:''}</span><span class="p">${ctl}</span></div>`; }).join('');

function searchResults(q){
  const words = deacc(String(q||'').toLowerCase()).split(/[^a-z0-9-]+/).filter(w=>w.length>=2);
  if(!words.length) return `<p class="small mut">Exemple: <a href="#" onclick="A.doSearch('virgula');document.getElementById('sq').value='virgula';return false">virgula</a> · <a href="#" onclick="A.doSearch('diftong');document.getElementById('sq').value='diftong';return false">diftong</a> · <a href="#" onclick="A.doSearch('complement direct');document.getElementById('sq').value='complement direct';return false">complement direct</a> · <a href="#" onclick="A.doSearch('caracterizare');document.getElementById('sq').value='caracterizare';return false">caracterizare</a> · <a href="#" onclick="A.doSearch('s-a');document.getElementById('sq').value='s-a';return false">s-a</a></p>`;
  SIDX = SIDX || buildIndex();
  const res = SIDX.map(e=>{ let sc=0; for(const w of words){ const k=e.n.split(w).length-1; if(!k) return null; sc+=k + (deacc(e.title.toLowerCase()).includes(w)?5:0); } return [sc,e]; }).filter(Boolean).sort((a,b)=>b[0]-a[0]).slice(0,30);
  if(!res.length) return '<p class="mut">Nimic găsit. Încearcă alt cuvânt (fără diacritice merge și așa).</p>';
  return `<p class="tiny dim">${res.length} rezultate</p>` + res.map(([sc,e])=>{ const nt=deacc(e.txt.toLowerCase()); const pos=Math.max(0,nt.indexOf(words[0])); const st=Math.max(0,pos-70);
    let snip=(st>0?'…':'')+e.txt.slice(st,st+220)+(e.txt.length>st+220?'…':''); snip=esc(snip);
    words.filter(w=>w.length>=3).forEach(w=>{ const re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').split('').map(c=>({a:'[aăâ]',i:'[iî]',s:'[sș]',t:'[tț]'}[c]||c)).join('')+')','gi'); snip=snip.replace(re,'<mark>$1</mark>'); });
    const click = e.tpl!=null ? `A.templates()` : `A.openAt('${e.id}','${e.tab}',${e.idx==null?'null':e.idx})`;
    return `<button class="list-btn" onclick="${click}" style="align-items:flex-start"><span class="em" style="font-size:1.3rem">${e.icon}</span><span><div class="tt">${esc(e.title)}</div><div class="tiny dim">${esc(e.mod)}</div><div class="ds" style="margin-top:4px">${snip}</div></span></button>`; }).join('');
}

// ---------- SINCRONIZARE PRIN GITHUB (fără server propriu) ----------
const SY_KEY='levelup-sync', GH='https://api.github.com/gists', GH_FILE='levelup-progres.json';
let SY = (()=>{ try{ return JSON.parse(localStorage.getItem(SY_KEY)||'{}'); }catch(e){ return {}; } })();
function inClaude(){ return !!(window.claude && typeof window.claude.use==='function'); }
function sySave(){ try{ localStorage.setItem(SY_KEY, JSON.stringify({token:SY.token,gist:SY.gist,last:SY.last})); }catch(e){} }
function ghHeaders(){ return {'Authorization':'Bearer '+SY.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'}; }
function syStatus(msg,err){ SY.msg=msg; SY.err=!!err; const el=document.getElementById('syStat'); if(el){ el.textContent=msg; el.style.color=err?'var(--red)':'var(--mut)'; } }
async function ghPull(silent){
  if(!SY.token||!SY.gist) return false;
  try{ const r = await fetch(GH+'/'+SY.gist, {headers:ghHeaders(), cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json(); const f = j.files && j.files[GH_FILE]; if(!f) throw new Error('fișier lipsă');
    let txt = f.content; if(f.truncated && f.raw_url){ txt = await (await fetch(f.raw_url)).text(); }
    const remote = JSON.parse(txt||'{}');
    SY.last = Date.now(); sySave();
    if((remote.updated||0) > (ST.updated||0)){ ST = Object.assign({}, DEF, remote); try{ localStorage.setItem(LS_KEY, JSON.stringify(ST)); }catch(e){} render(); toast('☁️ Progresul a fost preluat de pe celălalt dispozitiv'); }
    else if((ST.updated||0) > (remote.updated||0)) setTimeout(()=>ghPush(false), 50);
    syStatus('☁️ Sincronizat – '+new Date().toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'})); return true;
  }catch(e){ syStatus('⚠️ Nu s-a putut prelua progresul ('+(e.message||'eroare')+'). Verifică internetul sau cheia.', true); return false; }
}
async function ghPush(keepalive){
  if(!SY.token||!SY.gist) return false;
  try{ const r = await fetch(GH+'/'+SY.gist, {method:'PATCH', headers:ghHeaders(), keepalive:!!keepalive, body:JSON.stringify({files:{[GH_FILE]:{content:JSON.stringify(ST)}}})}); if(!r.ok) throw new Error('HTTP '+r.status);
    SY.last=Date.now(); sySave(); syStatus('☁️ Salvat în cloud – '+new Date().toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'})); return true;
  }catch(e){ syStatus('⚠️ Nu s-a putut salva în cloud ('+(e.message||'eroare')+'). Progresul e păstrat pe dispozitiv și se trimite la următoarea conectare.', true); return false; }
}
async function ghActivate(v){
  v = String(v||'').trim(); if(!v){ toast('Lipește întâi cheia'); return; }
  let token=v, gist=null; if(v.includes(':')){ [token,gist]=v.split(':'); }
  SY.token=token.trim(); SY.gist=gist?gist.trim():null; syStatus('⏳ Se conectează…');
  try{
    if(SY.gist){ const ok = await ghPull(false); if(!ok) throw new Error('cheie greșită'); }
    else { const r = await fetch(GH, {method:'POST', headers:ghHeaders(), body:JSON.stringify({description:'LevelUp Română – progres (nu șterge)', public:false, files:{[GH_FILE]:{content:JSON.stringify(ST)}}})});
      if(!r.ok) throw new Error(r.status===401?'token invalid':'HTTP '+r.status); const j=await r.json(); SY.gist=j.id; }
    SY.last=Date.now(); sySave(); render(); toast('✅ Sincronizarea este activă'); A.syKey();
  }catch(e){ SY.token=null; SY.gist=null; sySave(); render(); toast('⚠️ '+(e.message||'Nu s-a putut activa')); }
}
function syncCard(){
  if(inClaude()) return '';
  if(!(SY.token&&SY.gist)) return `<div class="card" style="background:var(--bg2)"><h4 style="margin:0 0 6px">☁️ Salvare automată între telefon și laptop</h4>
   <p class="small mut">Progresul se salvează singur în contul tău GitHub (într-un fișier privat), la fiecare răspuns și când ieși din aplicație. Când deschizi aplicația pe alt dispozitiv, continuă de unde ai rămas.</p>
   <p class="small mut"><b>Prima dată (pe un singur dispozitiv):</b> lipește tokenul GitHub (începe cu „ghp_”). <b>Pe celelalte dispozitive:</b> lipește <b>cheia de sincronizare</b> afișată după activare.</p>
   <div class="row"><input class="inp" id="syIn" style="flex:1;min-width:180px;font-size:.85rem" placeholder="Token (ghp_…) sau cheia de sincronizare" autocomplete="off" spellcheck="false"><button class="btn sm" onclick="ghActivate(document.getElementById('syIn').value)">Activează</button></div>
   <p class="tiny dim" id="syStat">${esc(SY.msg||'')}</p></div>`;
  return `<div class="card" style="background:var(--bg2)"><h4 style="margin:0 0 6px">☁️ Salvare automată: ACTIVĂ</h4>
   <p class="small" id="syStat" style="color:${SY.err?'var(--red)':'var(--mut)'}">${esc(SY.msg || (SY.last?'Ultima sincronizare: '+new Date(SY.last).toLocaleString('ro-RO'):''))}</p>
   <div class="row"><button class="btn sm" onclick="ghPush(false)">☁️ Salvează acum</button><button class="btn ghost sm" onclick="ghPull(false)">⬇️ Preia acum</button><button class="btn ghost sm" onclick="A.syKey()">🔑 Cheia pentru alt dispozitiv</button><button class="btn ghost sm" onclick="A.syOff()">Dezactivează aici</button></div></div>`;
}
Object.assign(A, {
  syKey(){ overlay(`<h3>🔑 Cheia de sincronizare</h3><p class="small mut">Copiaz-o și lipește-o pe celălalt dispozitiv, la Progres → Setări → Salvare automată. Păstreaz-o doar pentru voi.</p><textarea class="inp" id="syKeyTxt" style="min-height:90px;font-size:.75rem" readonly>${esc(SY.token+':'+SY.gist)}</textarea><div class="row" style="margin-top:8px"><button class="btn sm" onclick="(function(){const el=document.getElementById('syKeyTxt');try{navigator.clipboard.writeText(el.value).then(()=>toast('📋 Copiat!'),()=>el.select());}catch(e){el.select();}})()">Copiază</button><button class="btn ghost sm" onclick="A.close()">Închide</button></div>`); },

 {id:'t9',n:'Coordonare și subordonare (propoziție și frază)',ic:'🪢',cat:'gram',parts:[

   tm:['Coordonare = termeni egali, cu aceeași funcție (subiect multiplu).','Subordonare = regent → subordonat (cartea colegului).','Conjuncțiile coordonatoare pot lega și cuvinte: încet, dar sigur.']},
  {p:'Coordonarea în frază',th:[['g10','Câte propoziții'],['g10','2. Coordonarea'],['g13','Coordonarea']],m:[['g10',/coordon|juxtapun|copulativ|adversativ|disjunctiv|conclusiv/i],['g13',/coordonare/i]],g:[],
   h:'Copulativă: și, nici · adversativă: dar, iar, însă, ci · disjunctivă: sau, ori, fie · conclusivă: deci, așadar, prin urmare · juxtapunere: virgulă.',
   tm:['Câte verbe la moduri personale, atâtea propoziții.','Copulativă (și), adversativă (dar), disjunctivă (sau), conclusivă (deci).','Juxtapunere = propoziții legate doar prin virgulă.','Virgulă înainte de dar, iar, însă, ci.']},

 {id:'t10',n:'Derivarea, compunerea, conversiunea',ic:'🧱',cat:'gram',parts:[

 {id:'t11',n:'Familie lexicală și câmp lexical',ic:'🌳',cat:'gram',parts:[

   h:'Aceeași rădăcină (pădure – pădurar – împăduri) → familie lexicală. Aceeași temă, rădăcini diferite (pădure – copac – frunză) → câmp lexical.',
   tm:['Familia lexicală: cuvântul de bază + derivatele + compusele.','Câmpul lexical: cuvinte din aceeași temă.','Intrusul din familie e cuvântul cu altă rădăcină.']}]},
 {id:'t12',n:'Despărțirea în silabe și accentul',ic:'🗣️',cat:'gram',parts:[

 {id:'t13',n:'Vocală, semivocală, consoană',ic:'🔤',cat:'gram',parts:[

   tm:['a, ă, â/î – mereu vocale.','e, i, o, u – vocale sau semivocale.','Semivocala nu poate forma singură silabă.','ce/ci/ge/gi/che/chi/ghe/ghi + vocală → e/i sunt litere ajutătoare.']}]},
 {id:'t14',n:'Diftong, triftong, hiat',ic:'🔊',cat:'gram',parts:[

function pickFrom(pool, n, d, avoid, genRatio){

 while(out.length<n && gTot && guard++<n*40){ const [g,idx]=pool.gen[Math.floor(Math.random()*pool.gen.length)]; let best=null;
  for(let t=0;t<6;t++){ const i=idx[Math.floor(Math.random()*idx.length)]; const k='gen:'+g+':'+i; if(used.has(k)) continue; const sc=seenN(k)+Math.random()*0.5; if(!best||sc<best[0]) best=[sc,i,k]; }

 pTh(sa){ const c=PS().cur; if(c){ c.sa=sa; if(!c.steps.th) stepDone('th',{sa}); else { c.t0=null; save(); } } SUB=null; go('plan'); toast(sa==='low'?'👍 Exercițiile pornesc mai ușor, cu indicii.':'👍 Super! Urmează exercițiile.'); },

 pRetry(){ const c=PS().cur; if(!c) return; c.retried=true; c.failed=false; delete c.steps.test; const tl=todayLog(); if(c.counted){ tl.n=Math.max(0,tl.n-1); c.counted=false; } save(); startStep('test'); },
 pMore(){ const tl=todayLog(); tl.allow=tl.n+1; save(); render(); window.scrollTo(0,0); },
 pWork(){ todayLog().work=true; save(); render(); },
 pLater(){ const P=PS(), c=P.cur; if(!c) return; P.later.push({L:c.L, at:P.pos}); if(!c.later) P.pos++; P.cur=null; save(); toast('📆 Simularea revine în weekend.'); render(); },
 pRest(x){ const P=PS(); const i=P.rest.indexOf(x); if(i>=0) P.rest.splice(i,1); else { if(P.rest.length>=3){ toast('Maximum 3 zile de pauză pe săptămână.'); return; } P.rest.push(x); } save(); render(); },
 pJump(v){ if(v==='') return; const P=PS(); const i=+v; overlay(`<h3>Sari la lecția ${i+1}?</h3><p class="small mut">${esc(SEQ[i].title)}. Lecția începută acum se oprește (rezultatele de până acum rămân).</p><div class="row"><button class="btn ghost" onclick="A.close();render()">Anulează</button><button class="btn" onclick="A.pJumpDo(${i})">Da, sari</button></div>`); },
 pJumpDo(i){ const P=PS(); P.pos=i; P.cur=null; save(); closeOv(); render(); toast('Programul continuă de la lecția '+(i+1)); },
 pResetAsk(){ overlay(`<h2>Iei programul de la capăt?</h2><p class="mut small">Se șterg doar datele programului zilnic (XP-ul, stelele și simulările rămân).</p><div class="row"><button class="btn ghost" onclick="A.close()">Anulează</button><button class="btn red" onclick="A.pReset()">Da</button></div>`); },
 pReset(){ delete ST.plan; PS(); save(); closeOv(); render(); toast('Program nou! 🚀'); },
 hint(){ if(!PL||PL.checked) return; const q=PL.qs[PL.i]; PL.hintOpen=PL.hintOpen||{}; PL.hinted=PL.hinted||{}; PL.elim=PL.elim||{}; PL.hintOpen[PL.i]=true; PL.hinted[PL.i]=true;
  if(q.t==='mc' && q.o.length>=4){ const wrong=shuffle(q.o.map((_,i)=>i).filter(i=>i!==q.a)); PL.elim[PL.i]=wrong.slice(0,2); if(PL.sel!=null&&PL.elim[PL.i].includes(PL.sel)) PL.sel=null; }
  if(q.t==='ms' && q.o.length>=4){ const wrong=shuffle(q.o.map((_,i)=>i).filter(i=>!q.a.includes(i))); PL.elim[PL.i]=wrong.slice(0,1); if(Array.isArray(PL.sel)) PL.sel=PL.sel.filter(x=>!PL.elim[PL.i].includes(x)); }
  render(); }
});
