<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LevelUp Română – Evaluarea Națională</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1220; --bg2:#161a2e; --card:#1d2240; --card2:#252b50; --line:#323a6b;
  --txt:#eef0ff; --mut:#a9b0d6; --dim:#7c84b3;
  --green:#58cc02; --green-d:#46a302; --blue:#1cb0f6; --blue-d:#1899d6;
  --purple:#a560f8; --purple-d:#8a45dd; --gold:#ffc800; --gold-d:#e0a800;
  --red:#ff4b4b; --red-d:#d93a3a; --orange:#ff9600; --pink:#ff6bcb;
  --r:16px; --sh:0 4px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:'Nunito',system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body{min-height:100vh}
a{color:var(--blue)}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,h4{margin:.2em 0 .5em;line-height:1.2;font-weight:900}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.1rem}
.pix{font-family:'Press Start 2P',monospace;letter-spacing:.5px}

/* layout */
.app{display:flex;min-height:100vh}
.side{width:240px;flex:0 0 240px;background:var(--bg2);border-right:2px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;padding:6px 10px 18px}
.logo .pix{font-size:.72rem;line-height:1.5;color:var(--green)}
.logo .em{font-size:1.9rem}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:14px;border:2px solid transparent;background:none;color:var(--mut);font-weight:800;font-size:.95rem;text-align:left;text-transform:uppercase;letter-spacing:.4px}
.nav-btn .ic{font-size:1.35rem;width:28px;text-align:center}
.nav-btn:hover{background:var(--card)}
.nav-btn.on{background:rgba(28,176,246,.12);border-color:var(--blue);color:var(--blue)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(15,18,32,.92);backdrop-filter:blur(6px);border-bottom:2px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 18px}
.topbar .ttl{font-weight:900;font-size:1.05rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{display:flex;align-items:center;gap:5px;font-weight:900;font-size:.95rem}
.stat.fire{color:var(--orange)} .stat.xp{color:var(--gold)} .stat.lvl{color:var(--purple)}
.content{padding:20px 18px 110px;max-width:980px;width:100%;margin:0 auto}
.bottom{display:none}
.sync{font-size:.72rem;color:var(--dim);padding:8px 12px;margin-top:auto}

@media (max-width:820px){
  .side{display:none}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg2);border-top:2px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom button{flex:1;background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.66rem;font-weight:800;padding:4px 0;border-radius:12px}
  .bottom button .ic{font-size:1.45rem;line-height:1.1}
  .bottom button.on{color:var(--blue);background:rgba(28,176,246,.1)}
  .content{padding:14px 12px 100px}
  .topbar{padding:8px 12px;gap:10px}
  .topbar .ttl{font-size:.95rem}
  h1{font-size:1.35rem}
}

/* cards & bits */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card.hl{border-color:var(--blue)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:820px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.g2.st{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.mut{color:var(--mut)} .dim{color:var(--dim)} .small{font-size:.86rem} .tiny{font-size:.75rem}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:800;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.tag.g{background:rgba(88,204,2,.15);color:var(--green);border-color:rgba(88,204,2,.4)}
.tag.b{background:rgba(28,176,246,.15);color:var(--blue);border-color:rgba(28,176,246,.4)}
.tag.p{background:rgba(165,96,248,.15);color:var(--purple);border-color:rgba(165,96,248,.4)}
.tag.y{background:rgba(255,200,0,.13);color:var(--gold);border-color:rgba(255,200,0,.4)}
.tag.r{background:rgba(255,75,75,.13);color:var(--red);border-color:rgba(255,75,75,.4)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 20px;font-weight:900;font-size:.95rem;text-transform:uppercase;letter-spacing:.5px;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-d);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.purple{background:var(--purple);box-shadow:0 4px 0 var(--purple-d)}
.btn.gold{background:var(--gold);color:#3a2a00;box-shadow:0 4px 0 var(--gold-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.ghost{background:var(--card2);color:var(--txt);box-shadow:0 4px 0 #11152b;border:2px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:.8rem;border-radius:12px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

.bar{height:14px;background:var(--card2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .4s}
.bar.gold>i{background:var(--gold)} .bar.blue>i{background:var(--blue)} .bar.purple>i{background:var(--purple)}

/* hero */
.hero{background:linear-gradient(135deg,#2a1f5c,#14325a);border:2px solid #3d3f8f;border-radius:20px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero h1{margin:0 0 4px}
.hero .big{font-size:2.2rem;font-weight:900;color:var(--gold)}
.kpi{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.kpi .v{font-size:1.5rem;font-weight:900}
.kpi .l{font-size:.75rem;color:var(--mut);font-weight:700;text-transform:uppercase}

/* path */
.unit{margin:8px 0 26px}
.unit-head{border-radius:16px;padding:14px 16px;color:#fff;margin-bottom:14px;box-shadow:var(--sh)}
.unit-head h2{margin:0;font-size:1.15rem}
.unit-head p{margin:2px 0 0;opacity:.9;font-size:.88rem}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:6px 0}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:200px}
.node button.circ{width:76px;height:70px;border-radius:50%;border:0;font-size:1.9rem;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.4);position:relative}
.node button.circ:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.node .nm{font-weight:800;font-size:.85rem;text-align:center;line-height:1.2}
.node .stars{font-size:.85rem;letter-spacing:2px;height:1em}
.node.next button.circ{outline:4px solid rgba(255,255,255,.25);outline-offset:4px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{outline-color:rgba(255,255,255,.05)}}
.node .crown{position:absolute;top:-6px;right:52px;font-size:1.1rem}

/* theory */
.theory h3{color:var(--blue);margin-top:1.2em}
.theory h4{color:var(--gold);margin:1em 0 .3em}
.theory p{margin:.4em 0}
.theory ul,.theory ol{padding-left:1.3em;margin:.4em 0}
.theory li{margin:.2em 0}
.ex{background:rgba(28,176,246,.08);border-left:4px solid var(--blue);border-radius:10px;padding:9px 12px;margin:8px 0}
.tip{background:rgba(88,204,2,.09);border-left:4px solid var(--green);border-radius:10px;padding:9px 12px;margin:8px 0}
.trap{background:rgba(255,75,75,.09);border-left:4px solid var(--red);border-radius:10px;padding:9px 12px;margin:8px 0}
.exam{background:rgba(255,200,0,.08);border-left:4px solid var(--gold);border-radius:10px;padding:9px 12px;margin:8px 0}
.tip b:first-child,.trap b:first-child,.exam b:first-child{display:inline}
table.t{width:100%;border-collapse:collapse;margin:8px 0;font-size:.9rem}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--card2);color:var(--gold)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
u.s{text-decoration:none;border-bottom:2px solid var(--gold)}
mark{background:rgba(255,200,0,.25);color:var(--txt);border-radius:4px;padding:0 2px}

.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.tabs button{flex:0 0 auto;border:2px solid var(--line);background:var(--card);color:var(--mut);padding:9px 14px;border-radius:12px;font-weight:800;font-size:.85rem}
.tabs button.on{border-color:var(--blue);color:var(--blue);background:rgba(28,176,246,.1)}

/* quiz player */
.player{max-width:720px;margin:0 auto}
.phead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.phead .x{background:none;border:0;color:var(--dim);font-size:1.6rem;padding:0 4px}
.phead .bar{flex:1;height:16px}
.combo{font-weight:900;color:var(--orange);font-size:.9rem;min-width:56px;text-align:right}
.qtype{font-size:.75rem;font-weight:900;color:var(--purple);text-transform:uppercase;letter-spacing:1px}
.qtext{font-size:1.2rem;font-weight:800;margin:6px 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--txt);font-size:1rem;font-weight:700;box-shadow:0 3px 0 var(--line)}
.opt .k{flex:0 0 28px;height:28px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--mut)}
.opt.sel{border-color:var(--blue);background:rgba(28,176,246,.12);box-shadow:0 3px 0 var(--blue-d)}
.opt.sel .k{border-color:var(--blue);color:var(--blue)}
.opt.ok{border-color:var(--green);background:rgba(88,204,2,.14);box-shadow:0 3px 0 var(--green-d)}
.opt.bad{border-color:var(--red);background:rgba(255,75,75,.13);box-shadow:0 3px 0 var(--red-d)}
.opt[disabled]{cursor:default}
.inp{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg2);color:var(--txt);font-size:1.05rem;font-family:inherit;font-weight:700}
.inp:focus{outline:none;border-color:var(--blue)}
textarea.inp{min-height:140px;font-weight:600;line-height:1.5;resize:vertical}
select.inp{padding:10px 12px;font-size:.95rem}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb{position:sticky;bottom:0;margin-top:18px;border-radius:16px;padding:14px 16px;font-weight:700}
.fb.ok{background:#1f3a12;border:2px solid var(--green);color:#c9f7a6}
.fb.bad{background:#3d1717;border:2px solid var(--red);color:#ffc9c9}
.fb .h{font-weight:900;font-size:1.1rem;margin-bottom:4px}
.pfoot{margin-top:18px;display:flex;gap:10px}
.pfoot .btn{flex:1}
@media (max-width:820px){.pfoot{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg2);border-top:2px solid var(--line);z-index:40}
  .player{padding-bottom:70px}.fb{bottom:76px}}

.res-hero{text-align:center;padding:10px 0 4px}
.res-hero .em{font-size:3.4rem}
.rev{border:2px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:var(--card)}
.rev.ok{border-color:rgba(88,204,2,.5)} .rev.bad{border-color:rgba(255,75,75,.55)}
.rev .q{font-weight:800;margin-bottom:6px}
.rev .a{font-size:.9rem}

/* exam */
.exam-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.texts{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
.txt{background:#151935;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:.95rem;margin-bottom:12px}
.txt h4{margin:0 0 6px;color:var(--gold)}
.txt p{margin:.45em 0}
.txt .src{font-size:.8rem;color:var(--dim);font-style:italic}
.item{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.item .ih{display:flex;gap:8px;align-items:baseline;margin-bottom:8px}
.item .nr{font-weight:900;color:var(--blue)}
.item .pts{margin-left:auto;font-size:.78rem;font-weight:800;color:var(--gold);white-space:nowrap}
.item .req{font-weight:700}
.tfgrid{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;align-items:center;font-size:.93rem}
.tfgrid label{display:flex;align-items:center;gap:4px;font-weight:800}
.wc{font-size:.78rem;color:var(--dim);text-align:right;margin-top:4px}
.subtitle{font-weight:900;color:var(--purple);text-transform:uppercase;letter-spacing:1px;font-size:.85rem;margin:18px 0 8px}
.mobile-texts{display:none}
.fab{display:none}
@media (max-width:980px){.exam-wrap{grid-template-columns:1fr}.texts{display:none}.mobile-texts{display:block}.fab{display:inline-flex;position:fixed;right:14px;bottom:84px;z-index:35;box-shadow:0 4px 0 var(--blue-d),0 6px 20px rgba(0,0,0,.5)}}
details.acc{background:var(--card);border:2px solid var(--line);border-radius:14px;margin-bottom:10px}
details.acc>summary{padding:12px 14px;font-weight:900;cursor:pointer;list-style:none}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:'▾';float:right;color:var(--dim)}
details.acc[open]>summary::after{content:'▴'}
details.acc>.in{padding:0 14px 12px}
.crit{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.crit:last-child{border-bottom:0}
.crit .p{margin-left:auto;font-weight:900;color:var(--gold);white-space:nowrap}
.timer{font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(5,6,15,.75);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.ov .sheet{background:var(--bg2);border:2px solid var(--line);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;width:100%;max-width:760px;padding:16px}
@media (min-width:821px){.ov{align-items:center}.ov .sheet{border-radius:20px}}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--card2);border:2px solid var(--gold);color:var(--txt);padding:10px 18px;border-radius:14px;font-weight:900;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:pop .3s}
@keyframes pop{from{transform:translate(-50%,-10px);opacity:0}}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px 6px;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.badge .e{font-size:2rem;filter:grayscale(1);opacity:.35}
.badge.got .e{filter:none;opacity:1}
.badge .n{font-weight:900;font-size:.8rem}
.badge .d{font-size:.7rem;color:var(--dim)}
.badge.got{border-color:var(--gold)}
.chart{display:flex;align-items:flex-end;gap:5px;height:120px;padding-top:8px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.chart .c i{display:block;width:100%;background:var(--purple);border-radius:6px 6px 2px 2px;min-height:3px}
.chart .c.today i{background:var(--gold)}
.chart .c span{font-size:.6rem;color:var(--dim)}
.lvlbox{display:flex;align-items:center;gap:14px}
.lvlbox .ring{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.9rem;background:var(--card2);border:3px solid var(--purple)}
.list-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--txt);margin-bottom:10px;box-shadow:0 3px 0 var(--line)}
.list-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.list-btn .em{font-size:1.7rem;width:40px;text-align:center}
.list-btn .tt{font-weight:900}
.list-btn .ds{font-size:.82rem;color:var(--mut)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--card);color:var(--mut);padding:7px 12px;border-radius:10px;font-weight:800}
.seg button.on{border-color:var(--gold);color:var(--gold)}
.clause{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
@media (max-width:560px){.clause{grid-template-columns:1fr}}
.ai-box{background:rgba(165,96,248,.08);border:2px solid rgba(165,96,248,.45);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.92rem}
.ok-t{color:var(--green)} .bad-t{color:var(--red)} .gold-t{color:var(--gold)}
hr.s{border:0;border-top:2px solid var(--line);margin:14px 0}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content" id="view"></div>
  </div>
</div>
<nav class="bottom" id="bottom"></nav>
<div id="ovl"></div>
<script>
// ===================== GRAMATICĂ =====================
const GRAM_UNITS = [
 {name:'Unitatea 1 · Sunete și cuvinte', desc:'Fonetică, vocabular, stil', color:'#1cb0f6', ids:['g1','g2','g12']},
 {name:'Unitatea 2 · Părțile de vorbire', desc:'Verbul, substantivul, pronumele și restul gașcii', color:'#a560f8', ids:['g3','g4','g5','g6','g7','g8']},
 {name:'Unitatea 3 · Sintaxa', desc:'Propoziția și fraza', color:'#ff9600', ids:['g9','g10']},
 {name:'Unitatea 4 · Scriere corectă', desc:'Ortografie și punctuație', color:'#58cc02', ids:['g11']}
];

const GRAM = [
// ---------------------------------------------------------------- g1
{id:'g1', title:'Fonetica: diftong, triftong, hiat, silabe', icon:'🔊',
 exam:'Subiectul I, Partea a II-a, itemul 1 (2 p): „seria în care ambele cuvinte conțin diftong”.',
 theory:`
<h3>1. Sunetele limbii române</h3>
<ul>
<li><b>Vocalele</b> (a, ă, â/î, e, i, o, u) pot forma singure o silabă: <i>a-ur</i>, <i>o-ră</i>.</li>
<li><b>Consoanele</b> nu pot forma singure silabă.</li>
<li><b>Semivocalele</b> (e, i, o, u) arată ca vocalele, dar <b>nu pot fi centrul silabei</b>; apar doar lângă o vocală, în aceeași silabă: <i>s<b>oa</b>-re</i> (o = semivocală).</li>
</ul>
<h3>2. Diftongul, triftongul, hiatul</h3>
<table class="t"><tr><th>Ce e</th><th>Formula</th><th>Exemple</th></tr>
<tr><td><b>Diftong</b></td><td>vocală + semivocală (sau invers) în <b>aceeași silabă</b></td><td><i>stea</i> (ea), <i>soa-re</i> (oa), <i>iar-nă</i> (ia), <i>fier</i> (ie), <i>iu-bi-re</i> (iu), <i>mai</i> (ai), <i>lei</i> (ei), <i>doi</i> (oi), <i>pui</i> (ui), <i>sau</i> (au), <i>leu</i> (eu), <i>nou</i> (ou), <i>câi-ne</i> (âi), <i>rău</i> (ău), <i>do-uă</i> (uă), <i>zi-ua</i> (ua)</td></tr>
<tr><td><b>Triftong</b></td><td>2 semivocale + 1 vocală, în aceeași silabă</td><td><i>beau</i> (eau), <i>iau</i> (iau), <i>tă-iai</i> (iai), <i>le-oai-că</i> (oai)</td></tr>
<tr><td><b>Hiat</b></td><td>două vocale alăturate, în <b>silabe diferite</b></td><td><i>a-er</i>, <i>po-e-zi-e</i>, <i>a-ur</i>, <i>ze-ul</i>, <i>al-co-ol</i>, <i>fi-ind</i>, <i>i-de-e</i></td></tr></table>
<div class="tip"><b>Truc „silaba”:</b> desparte mai întâi cuvântul în silabe. Dacă două vocale ajung în <b>aceeași</b> silabă → diftong. Dacă ajung în silabe <b>diferite</b> → hiat.</div>
<h3>3. Litere ajutătoare (capcana nr. 1!)</h3>
<p>În grupurile <b>ce, ci, ge, gi, che, chi, ghe, ghi</b>, când după <i>e</i>/<i>i</i> urmează altă vocală, <i>e</i> și <i>i</i> <b>nu sunt sunete</b>, ci doar arată cum se citește consoana:</p>
<div class="ex"><i>ceas</i> = 4 litere, 3 sunete [č-a-s] → <b>fără diftong</b>!<br><i>geam, ciorbă, chiar, ghiocel</i> → la fel, <i>e</i>/<i>i</i> sunt litere ajutătoare.</div>
<div class="trap"><b>Capcană:</b> <i>i</i> final scurt (asilabic): <i>pomi, lupi, ochi</i> – nu e vocală, nu face silabă și nu formează diftong. <i>Pomi</i> are <b>o singură silabă</b>.</div>
<h3>4. Litere vs. sunete</h3>
<ul><li><b>x</b> = 2 sunete [cs] sau [gz]: <i>taxi, examen</i>.</li>
<li><b>ch, gh</b> + e/i: <i>h</i> nu se pronunță separat → <i>chibrit</i> = 7 litere, 6 sunete.</li>
<li><b>â</b> și <b>î</b> notează același sunet.</li></ul>
<h3>5. Despărțirea în silabe (principiul fonetic)</h3>
<ol>
<li><b>O consoană</b> între vocale trece la silaba următoare: <i>ca-să, ma-să</i>.</li>
<li><b>Două consoane</b>: prima rămâne, a doua trece: <i>ar-tă, ver-de, mun-te</i>. <br>Excepție: <b>b, c, d, f, g, h, p, t, v + l sau r</b> trec împreună: <i>co-dru, a-cru, su-flet, a-plauze</i>.</li>
<li><b>Trei sau mai multe consoane</b>: prima rămâne, celelalte trec: <i>as-tru, mon-stru, sfin-xul</i>. Excepție: grupurile <i>lpt, mpt, mpț, nct, ncț, ndv, rct, rtf, stm</i> se despart după a doua: <i>sculp-tor, somp-tu-os, punc-taj, linc-șii</i>.</li>
<li><b>Vocală + vocală</b> (hiat) se despart: <i>po-e-zi-e</i>.</li></ol>
<h3>6. Accentul</h3>
<p>Corect: <i>ca-rac-TER</i>, <i>bu-te-LI-e</i>, <i>U-nic</i>, <i>re-gi-ZOR</i>, <i>a-va-RI-e</i>, <i>du-MI-ni-că</i>. Variante acceptate (ambele corecte): <i>AN-tic / an-TIC</i>.</p>`,
 tricks:`
<div class="tip"><b>🎯 Strategie pentru itemul „diftong” (2 p):</b> scrie fiecare cuvânt despărțit în silabe pe ciornă. Verifică fiecare variantă – <b>ambele</b> cuvinte trebuie să aibă diftong.</div>
<div class="tip"><b>🧠 Mnemonic:</b> „<b>D</b>iftong = <b>D</b>oi în aceeași cameră” (o silabă). „<b>H</b>iat = <b>H</b>otel cu camere separate”.</div>
<div class="trap"><b>⚠️ Cele 3 capcane clasice:</b> 1) <i>ce/ci/ge/gi/che/chi/ghe/ghi</i> + vocală (litere ajutătoare); 2) <i>i</i> final scurt (<i>pomi</i>); 3) cuvinte cu hiat care „par” diftong: <i>poezie, fiind, alcool, aer, idee</i>.</div>
<div class="ex"><b>Verificare rapidă:</b> <i>ceai</i> → c-ea-i? Nu! se citește [čai]: <i>e</i> e literă ajutătoare, dar <b>ai</b> e diftong. Deci <i>ceai</i> <b>are</b> diftong (ai).</div>`,
 q:[

 {t:'mc',q:'Cuvântul care conține triftong este:',o:['„soare”','„beau”','„poezie”','„ceai”'],a:1,e:'„beau” – eau într-o singură silabă (2 semivocale + vocală).'},

 {t:'mc',q:'Cuvântul care conține hiat este:',o:['„mai”','„aer”','„stea”','„geam”'],a:1,e:'a-er: două vocale în silabe diferite.'},
 {t:'mc',q:'Despărțirea corectă în silabe este:',o:['a-stru','as-tru','ast-ru','astr-u'],a:1,e:'La trei consoane, prima rămâne la silaba dinainte: as-tru.'},
 {t:'mc',q:'Despărțirea corectă în silabe este:',o:['cod-ru','co-dru','codr-u','c-odru'],a:1,e:'Grupul d + r trece împreună la silaba următoare: co-dru.'},
 {t:'in',q:'Câte sunete are cuvântul „ceas”? (scrie cifra)',a:['3','trei'],e:'c-e-a-s are 4 litere, dar „e” e literă ajutătoare: [č][a][s] = 3 sunete.'},

{id:'g2', title:'Vocabularul: formarea cuvintelor și sensuri', icon:'📚',
 exam:'Subiectul I, Partea a II-a, itemii 2, 3, 4 (câte 2 p): modul de formare, sensul unei expresii, sinonime/antonime/omonime.',
 theory:`
<h3>1. Formarea cuvintelor</h3>
<table class="t"><tr><th>Mijloc</th><th>Cum funcționează</th><th>Exemple</th></tr>
<tr><td><b>Derivarea</b></td><td>cuvânt de bază + <b>prefix</b> (în față) și/sau <b>sufix</b> (la final)</td><td><i>ne+cunoscut, re+citi, des+face, dez+lega, stră+bunic</i><br><i>copil+aș, căsu+ță, pădur+ar, frumus+ețe, stânc+os, iepur+ește</i></td></tr>
<tr><td><b>Compunerea</b></td><td>două sau mai multe cuvinte formează unul nou</td><td>prin <b>sudare</b>: <i>untdelemn, binevoitor, deodată, bunăvoință, optzeci</i><br>cu <b>cratimă</b>: <i>floarea-soarelui, bună-cuviință, nord-est</i><br>prin <b>abreviere</b>: <i>ONU, CFR</i></td></tr>
<tr><td><b>Conversiunea</b></td><td>cuvântul își schimbă <b>partea de vorbire</b>, fără să-și schimbe forma</td><td><i>Cântă <b>frumos</b>.</i> (adjectiv → adverb)<br><i><b>Binele</b> învinge.</i> (adverb → substantiv)<br><i>geam <b>spart</b></i> (participiu → adjectiv)</td></tr></table>
<p>Sufixe utile: diminutivale <i>-aș, -el, -uț, -ică, -ișor, -iță</i>; augmentative <i>-oi, -oaie</i>; de agent <i>-tor, -ar, -ist</i>; abstracte <i>-ie, -ime, -eală, -ință</i>; adjectivale <i>-os, -esc, -bil</i>; adverbiale <i>-ește</i>.</p>
<h3>2. Familia lexicală vs. câmpul lexical</h3>
<ul><li><b>Familia lexicală</b> = cuvântul de bază + toate derivatele și compusele lui: <i>floare, floricică, înflori, floral, floare-de-colț</i>.</li>
<li><b>Câmpul lexical</b> = cuvinte din aceeași temă, chiar dacă nu se aseamănă: <i>școală, elev, tablă, catalog, profesor</i>.</li></ul>
<h3>3. Categorii semantice</h3>
<table class="t"><tr><th>Categorie</th><th>Definiție</th><th>Exemplu</th></tr>
<tr><td><b>Sinonime</b></td><td>formă diferită, sens asemănător</td><td><i>urbe – oraș; a zice – a spune</i></td></tr>
<tr><td><b>Antonime</b></td><td>sens opus</td><td><i>harnic – leneș; cunoscut – necunoscut</i></td></tr>
<tr><td><b>Omonime</b></td><td>aceeași formă, sensuri <b>fără legătură</b></td><td><i>lac</i> (apă) – <i>lac</i> (vopsea); <i>roman</i> (carte) – <i>roman</i> (locuitor al Romei)</td></tr>
<tr><td><b>Cuvinte polisemantice</b></td><td>un cuvânt cu mai multe sensuri <b>înrudite</b></td><td><i>ochi</i> (organ), <i>ochi</i> de apă, <i>ochiul</i> acului</td></tr>
<tr><td><b>Paronime</b></td><td>formă aproape la fel, sens diferit – se confundă!</td><td><i>eminent</i> (remarcabil) / <i>iminent</i> (gata să se întâmple); <i>original / originar; familial / familiar; literal / literar; emigrant / imigrant; a evoca / a invoca</i></td></tr></table>
<h3>4. Sensuri</h3>
<ul><li><b>Sens propriu (de bază)</b>: <i>inimă</i> = organ.</li><li><b>Sens secundar</b>: <i>inima orașului</i> (centrul).</li><li><b>Sens figurat</b> (expresiv): <i>om cu inimă de piatră</i>.</li></ul>
<h3>5. Locuțiuni, expresii, pleonasm</h3>
<p>Expresii frecvente: <i>a-și lua inima în dinți</i> (a prinde curaj), <i>a-i turui gura</i> (a vorbi mult, repede), <i>nici în ruptul capului</i> (deloc), <i>a trage cu urechea</i> (a asculta pe ascuns), <i>a lua peste picior</i> (a ironiza), <i>cu noaptea-n cap</i> (foarte devreme), <i>a tăia frunză la câini</i> (a pierde vremea), <i>a fi cu capul în nori</i> (a fi distrat).</p>
<div class="trap"><b>Pleonasmul</b> = repetarea inutilă a aceleiași idei: <i>a coborî jos, a urca sus, a reveni din nou, a prevedea dinainte, colaborare comună, panaceu universal</i>. ❌</div>`,
 tricks:`
<div class="tip"><b>🎯 Derivat sau compus?</b> Taie bucata „în plus”. Dacă rămâne un <b>cuvânt + o bucată care nu e cuvânt</b> (<i>-aș, ne-</i>) → derivat. Dacă rămân <b>două cuvinte</b> (<i>bună + voință</i>) → compus.</div>
<div class="tip"><b>🎯 Conversiune?</b> Întreabă: „Ce parte de vorbire e AICI?” Dacă e alta decât cea din dicționar (<i>frumos</i> lângă verb = adverb), e conversiune.</div>
<div class="tip"><b>🧠 Omonime vs. polisemie:</b> dacă sensurile au <b>legătură</b> (ochi – ochi de apă: ambele „rotunde, deschise”) → polisemie. Dacă <b>nu au nicio legătură</b> (lac de apă – lac de unghii) → omonime.</div>
<div class="trap"><b>⚠️ La itemul cu sensul expresiei</b> citește secvența întreagă din text – sensul se stabilește din <b>context</b>.</div>`,
 q:[
 {t:'mc',q:'Seria care cuprinde doar cuvinte derivate:',o:['„frumusețe”, „copilăresc”','„floare”, „copilăresc”','„deodată”, „pădurar”','„untdelemn”, „nebun”'],a:0,e:'frumos + -ețe, copil + -ăresc. „floare” e cuvânt de bază; „deodată” și „untdelemn” sunt compuse.'},
 {t:'mc',q:'Cuvântul „untdelemn” este format prin:',o:['derivare cu sufix','compunere prin sudare','conversiune','derivare cu prefix'],a:1,e:'unt + de + lemn, sudate într-un singur cuvânt.'},
 {t:'mc',q:'În „Ea cântă frumos.”, cuvântul „frumos” a devenit adverb prin:',o:['derivare','compunere','conversiune','abreviere'],a:2,e:'Adjectivul a trecut în altă parte de vorbire (adverb), fără să-și schimbe forma.'},
 {t:'mc',q:'Seria care formează o familie lexicală:',o:['floare, petală, tulpină, frunză','floare, floricică, înflori, floral','floare, grădină, vază, buchet','floare, plantă, copac, iarbă'],a:1,e:'Toate pleacă de la același cuvânt de bază (floare). Celelalte sunt câmpuri lexicale.'},
 {t:'mc',q:'Seria în care cuvintele subliniate sunt omonime:',o:['„Am înotat în <u class=s>lac</u>.” / „Am dat mobila cu <u class=s>lac</u>.”','„un om <u class=s>harnic</u>” / „un elev <u class=s>sârguincios</u>”','„<u class=s>ochiul</u> drept” / „<u class=s>ochiul</u> acului”','„a <u class=s>urca</u>” / „a <u class=s>coborî</u>”'],a:0,e:'„lac” (apă) și „lac” (vopsea) au aceeași formă și sensuri fără legătură.'},
 {t:'mc',q:'Sensul expresiei „a-și lua inima în dinți” este:',o:['a se îmbolnăvi','a prinde curaj','a se supăra','a mânca repede'],a:1,e:'„A-și lua inima în dinți” = a se îmbărbăta, a prinde curaj.'},
 {t:'mc',q:'Enunțul în care paronimul este folosit corect:',o:['Ne aflăm într-un pericol eminent.','Andrei este un elev eminent.','Furtuna era eminentă.','Plecarea e eminentă.'],a:1,e:'„eminent” = remarcabil. Pentru pericol/furtună se folosește „iminent” (gata să se producă).'},
 {t:'mc',q:'Enunțul care conține un pleonasm:',o:['Am coborât pe scări.','Am coborât jos, în curte.','Am urcat în pod.','Am revenit acasă.'],a:1,e:'„a coborî jos” – „jos” repetă inutil ideea din „a coborî”.'},
 {t:'mc',q:'În „ochiul acului”, cuvântul „ochiul” are sens:',o:['propriu','figurat (secundar)','arhaic','regional'],a:1,e:'Sensul de bază e „organul vederii”; aici e un sens secundar, figurat.'},
 {t:'mc',q:'Antonimul cuvântului „harnic” este:',o:['muncitor','leneș','sârguincios','vrednic'],a:1,e:'harnic ≠ leneș. Celelalte sunt sinonime.'},
 {t:'mc',q:'Secvența „Două ceasuri îi tot turuise gura” înseamnă că personajul:',o:['a mâncat mult','a vorbit mult și repede','a tăcut','a cântat'],a:1,e:'„a-i turui gura” = a vorbi mult, repede, fără oprire.'},
 {t:'mc',q:'Cuvântul derivat cu prefix este:',o:['„necunoscut”','„cunoscător”','„cunoștință”','„cunoaște”'],a:0,e:'ne- + cunoscut. Celelalte sunt derivate cu sufix sau cuvânt de bază.'},
 {t:'mc',q:'Sensul expresiei „nici în ruptul capului” este:',o:['foarte repede','deloc, sub nicio formă','cu greu','din când în când'],a:1,e:'„nici în ruptul capului” = în niciun caz, deloc.'}
 ]},

{id:'g12', title:'Stil, registre, vorbire directă/indirectă', icon:'🎭',
 exam:'Apare în cerințele de vocabular (Subiectul I) și în redactare (proprietatea termenilor, claritatea).',
 theory:`
<h3>1. Limba standard și variantele ei</h3>
<table class="t"><tr><th>Registru</th><th>Ce este</th><th>Exemple</th></tr>
<tr><td><b>Limba literară (standard)</b></td><td>respectă normele (DOOM)</td><td><i>varză, porumb, acum</i></td></tr>
<tr><td><b>Regionalisme</b></td><td>cuvinte folosite doar într-o zonă</td><td><i>curechi</i> (varză), <i>păpușoi</i> (porumb), <i>imală</i> (lut)</td></tr>
<tr><td><b>Arhaisme</b></td><td>cuvinte ieșite din uz</td><td><i>poporean</i> (sătean), <i>a grăi</i> (a vorbi), <i>urbe</i> (oraș)</td></tr>
<tr><td><b>Neologisme</b></td><td>cuvinte împrumutate recent</td><td><i>computer, impacient, filologic</i></td></tr>
<tr><td><b>Limbaj popular / familiar</b></td><td>vorbire de zi cu zi, nesupravegheată</td><td><i>a ști, mam' mare, d-ta</i></td></tr>
<tr><td><b>Argou / jargon</b></td><td>argou = limbaj „secret” al unui grup; jargon = cuvinte străine folosite pretențios</td><td><i>mișto, nasol</i> (argou); <i>parol!</i> (jargon)</td></tr>
<tr><td><b>Termeni științifici</b></td><td>specifici unui domeniu</td><td><i>fitonutrient, polenizare, predicat</i></td></tr></table>
<p><b>Diminutivele</b> au valoare <b>afectivă</b> (drag, alint) sau <b>ironică</b>: <i>puișorul mamii, nepoțel, mititelul</i>.</p>
<h3>2. Vorbirea directă → vorbirea indirectă</h3>
<ol><li>Dispar <b>linia de dialog</b> și ghilimelele.</li><li>Se introduce un <b>verb de declarație</b> (a spune, a întreba, a răspunde) + <b>că / să / dacă</b>.</li><li>Persoana I și a II-a trec la <b>persoana a III-a</b>.</li><li>Se adaptează timpul și adverbele (<i>azi → în acea zi, mâine → a doua zi</i>).</li><li>Interjecțiile și vocativele dispar.</li></ol>
<div class="ex"><b>Direct:</b> — Mam' mare, de ce nu mai vine trenul? întreabă Goe.<br><b>Indirect:</b> Goe o întreabă pe bunica lui de ce nu mai vine trenul.</div>
<div class="ex"><b>Direct:</b> — Vin mâine la voi! a spus Ana.<br><b>Indirect:</b> Ana a spus că va veni la ei a doua zi.</div>`,
 tricks:`
<div class="tip"><b>🎯 În compunere:</b> scrie în <b>limba standard</b>. Folosește regionalisme sau argou doar în citate din text.</div>
<div class="tip"><b>🧠 Truc vorbire indirectă:</b> „Imaginează-ți că povestești unui prieten ce a zis cineva”. Nu poți „povesti” cu linie de dialog.</div>
<div class="trap"><b>⚠️</b> Nu uita să schimbi persoana: „Eu vin” → „<b>el</b> vine”.</div>`,
 q:[
 {t:'mc',q:'Cuvântul „curechi” (varză) este:',o:['neologism','regionalism','termen științific','argou'],a:1,e:'„curechi” se folosește doar în anumite zone (Moldova, Transilvania) → regionalism.'},
 {t:'mc',q:'Cuvântul „a grăi” (a vorbi) este:',o:['arhaism','neologism','argou','termen științific'],a:0,e:'„a grăi” este ieșit din uzul obișnuit → arhaism.'},
 {t:'mc',q:'În „puișorul mamii”, diminutivul exprimă:',o:['dispreț','alint, afecțiune','mărime','ironie fină'],a:1,e:'Diminutivul are aici valoare afectivă.'},
 {t:'mc',q:'Varianta corectă în vorbire indirectă pentru „— Vin mâine! a spus Ana.” este:',o:['Ana a spus: vin mâine.','Ana a spus că va veni a doua zi.','Ana a spus că vin mâine.','— Ana vine mâine.'],a:1,e:'Persoana I → persoana a III-a, „mâine” → „a doua zi”, verb de declarație + „că”.'},

{id:'g3', title:'Verbul: moduri, timpuri, valorile lui „a fi”', icon:'⚡',
 exam:'Subiectul I, Partea a II-a, itemul 5 (6 p – valoarea morfologică: verb predicativ/copulativ/auxiliar) și itemul 6 (verb la un timp dat).',
 theory:`
<h3>1. Moduri și timpuri</h3>
<div class="tw"><table class="t"><tr><th>Mod</th><th>Timp</th><th>a cânta (eu)</th><th>a spune (eu)</th></tr>
<tr><td rowspan=6><b>Indicativ</b><br><span class="dim">(acțiune sigură)</span></td><td>prezent</td><td>cânt</td><td>spun</td></tr>
<tr><td>imperfect</td><td>cântam</td><td>spuneam</td></tr>
<tr><td>perfect compus</td><td>am cântat</td><td>am spus</td></tr>
<tr><td>perfect simplu</td><td>cântai</td><td>spusei</td></tr>
<tr><td>mai-mult-ca-perfect</td><td>cântasem</td><td>spusesem</td></tr>
<tr><td>viitor / viitor anterior</td><td>voi cânta (pop. o să cânt) / voi fi cântat</td><td>voi spune / voi fi spus</td></tr>
<tr><td rowspan=2><b>Conjunctiv</b></td><td>prezent</td><td>să cânt</td><td>să spun</td></tr>
<tr><td>perfect</td><td>să fi cântat</td><td>să fi spus</td></tr>
<tr><td rowspan=2><b>Condițional-optativ</b></td><td>prezent</td><td>aș cânta</td><td>aș spune</td></tr>
<tr><td>perfect</td><td>aș fi cântat</td><td>aș fi spus</td></tr>
<tr><td><b>Imperativ</b></td><td>(doar pers. a II-a)</td><td>cântă! / nu cânta!</td><td>spune! / nu spune!</td></tr></table></div>
<h4>Conjugări-cheie (le cer des la examen!)</h4>
<div class="tw"><table class="t"><tr><th>Persoana</th><th>Mai-mult-ca-perfect</th><th>Perfect simplu</th><th>Imperfect</th></tr>
<tr><td>eu</td><td>spusesem</td><td>spusei</td><td>spuneam</td></tr>
<tr><td>tu</td><td><b>spuseseși</b></td><td>spuseși</td><td>spuneai</td></tr>
<tr><td>el/ea</td><td>spusese</td><td>spuse</td><td>spunea</td></tr>
<tr><td>noi</td><td>spuseserăm</td><td>spuserăm</td><td>spuneam</td></tr>
<tr><td>voi</td><td>spuseserăți</td><td>spuserăți</td><td>spuneați</td></tr>
<tr><td>ei/ele</td><td>spuseseră</td><td>spuseră</td><td>spuneau</td></tr></table></div>
<h3>2. Modurile nepersonale</h3>
<table class="t"><tr><th>Mod</th><th>Semn</th><th>Exemplu</th></tr>
<tr><td>Infinitiv</td><td>a + verb</td><td><i>a citi</i></td></tr>
<tr><td>Gerunziu</td><td>-ând / -ind</td><td><i>citind, cântând</i></td></tr>
<tr><td>Participiu</td><td>-t, -s (se acordă ca adjectivul)</td><td><i>citit, citită, spuse</i></td></tr>
<tr><td>Supin</td><td>de/la/pentru + participiu</td><td><i>Am de <b>citit</b>. Mașină de <b>spălat</b>.</i></td></tr></table>
<h3>3. Verb predicativ, copulativ sau auxiliar?</h3>
<table class="t"><tr><th>Valoare</th><th>Cum îl recunoști</th><th>Exemple cu „a fi”</th></tr>
<tr><td><b>Predicativ</b></td><td>are sens de sine stătător (a exista, a se afla, a avea loc, a trăi, a costa) → predicat verbal</td><td><i>Bunica <b>e</b> în grădină.</i> (se află)<br><i><b>A fost</b> odată...</i> (a existat)<br><i>Ce <b>e</b>?</i> (ce se întâmplă)</td></tr>
<tr><td><b>Copulativ</b></td><td>leagă subiectul de un <b>nume predicativ</b> (ce/cum este subiectul) → predicat nominal</td><td><i>Lecția <b>este</b> ușoară.</i><br><i>Cartea <b>e</b> a mea.</i><br><i>Cânepa <b>era</b> crudă.</i></td></tr>
<tr><td><b>Auxiliar</b></td><td>ajută la formarea unui timp/mod sau a diatezei pasive; nu are sens singur</td><td><i>aș <b>fi</b> venit, să <b>fi</b> știut, voi <b>fi</b> terminat</i><br><i>Romanul <b>este</b> scris de Andrei.</i> (pasiv)</td></tr></table>
<p>Alte verbe copulative: <b>a deveni, a ajunge</b> (= a deveni), <b>a ieși</b> (= a deveni), <b>a părea, a se face</b> (= a deveni), <b>a rămâne, a însemna</b>.</p>
<p><b>„A avea”</b>: predicativ = a poseda (<i>Am o carte.</i>); auxiliar în perfectul compus (<i><b>am</b> citit</i>) și condițional (<i><b>aș</b> citi</i>).<br><b>„A vrea”</b>: predicativ (<i>Vreau o carte.</i>) / auxiliar la viitor (<i><b>voi</b> citi</i>).</p>
<div class="exam"><b>Din modelul oficial 2026–2027:</b> trei forme ale lui „a fi” au fost cerute într-un singur item: una predicativă, una copulativă, una auxiliară. Simplul răspuns „verb” <b>nu se punctează</b> – trebuie precizată valoarea!</div>`,
 tricks:`
<div class="tip"><b>🎯 Testul înlocuirii pentru „a fi”:</b><br>1️⃣ Poți pune <b>„a se afla / a exista / a se întâmpla”</b>? → <b>predicativ</b>.<br>2️⃣ După el vine un cuvânt care spune <b>ce/cum e subiectul</b>? → <b>copulativ</b>.<br>3️⃣ Face parte dintr-o formă compusă (aș fi, să fi, voi fi, este + participiu + „de cineva”)? → <b>auxiliar</b>.</div>
<div class="tip"><b>🧠 Mai-mult-ca-perfect:</b> „-se-” e semnătura lui: canta<b>se</b>m, spuse<b>se</b>și, merse<b>se</b>.</div>
<div class="exam"><b>Model de răspuns la alcătuire:</b> „propoziție negativă cu verbul «a spune» la mai-mult-ca-perfect, persoana a II-a, singular” → <i>Nu îmi <b>spuseseși</b> adevărul.</i> ✅</div>
<div class="trap"><b>⚠️ Scriere:</b> „să <b>fii</b>” (conjunctiv, pers. a II-a) dar „a <b>fi</b>, voi <b>fi</b>, aș <b>fi</b>, nu <b>fi</b> trist!” (imperativ negativ = infinitiv).</div>`,
 q:[
 {t:'mc',q:'Valoarea verbului „a fi” în „Bunica <u class=s>este</u> în grădină.”:',o:['predicativ','copulativ','auxiliar','interjecție'],a:0,e:'„este” = se află → verb predicativ.'},
 {t:'mc',q:'Valoarea verbului „a fi” în „Lecția <u class=s>este</u> ușoară.”:',o:['predicativ','copulativ','auxiliar','nu e verb'],a:1,e:'Leagă subiectul de numele predicativ „ușoară” → copulativ.'},
 {t:'mc',q:'Valoarea lui „fi” în „Aș <u class=s>fi</u> venit mai devreme.”:',o:['predicativ','copulativ','auxiliar','substantiv'],a:2,e:'Ajută la formarea condiționalului perfect → auxiliar.'},
 {t:'mc',q:'În „Romanul <u class=s>este</u> scris de Andrei.”, „este” este:',o:['predicativ','copulativ','auxiliar (diateza pasivă)','adverb'],a:2,e:'Construcție pasivă (este + participiu + complement de agent) → auxiliar.'},
 {t:'in',q:'Scrie verbul „a spune” la indicativ mai-mult-ca-perfect, persoana a II-a, singular:',a:['spuseseși'],strict:true,e:'tu spuseseși (cu „ș” la final!).'},
 {t:'mc',q:'„cântând” este la modul:',o:['infinitiv','gerunziu','participiu','supin'],a:1,e:'Terminația -ând/-ind = gerunziu.'},
 {t:'mc',q:'În „Am de citit o carte.”, „de citit” este:',o:['infinitiv','gerunziu','participiu','supin'],a:3,e:'de + formă de participiu = supin.'},
 {t:'mc',q:'Timpul verbului „mersese” este:',o:['perfect simplu','imperfect','mai-mult-ca-perfect','perfect compus'],a:2,e:'„-se-” → mai-mult-ca-perfect.'},
 {t:'mc',q:'„ar fi câștigat” este la modul:',o:['indicativ','conjunctiv','condițional-optativ perfect','imperativ'],a:2,e:'aș/ai/ar + fi + participiu = condițional-optativ perfect.'},
 {t:'mc',q:'Enunțul cu un verb copulativ:',o:['El a devenit medic.','El a plecat acasă.','El are o mașină.','El scrie o scrisoare.'],a:0,e:'„a devenit” + nume predicativ „medic”.'},
 {t:'mc',q:'În „<u class=s>Am</u> o bicicletă nouă.”, „am” este:',o:['verb auxiliar','verb predicativ','verb copulativ','pronume'],a:1,e:'„am” = posed → verb predicativ.'},
 {t:'in',q:'Scrie verbul „a citi” la indicativ perfect simplu, persoana I, singular:',a:['citii'],strict:true,e:'eu citii (cu doi „i”).'},

{id:'g4', title:'Construcții active, pasive, impersonale', icon:'🔄',
 exam:'Apare la valori morfologice („a fi” auxiliar), la alcătuire de enunțuri și la recunoașterea construcțiilor (programa EN 2027).',
 theory:`
<h3>1. Construcția activă vs. construcția pasivă</h3>
<div class="tw"><table class="t"><tr><th></th><th>Activă</th><th>Pasivă</th></tr>
<tr><td>Exemplu</td><td><i><b>Andrei</b> scrie un roman.</i></td><td><i><b>Romanul</b> este scris de Andrei.</i></td></tr>
<tr><td>Subiectul</td><td><b>face</b> acțiunea</td><td><b>suportă</b> acțiunea</td></tr>
<tr><td>Verbul</td><td>formă activă</td><td><b>a fi</b> (auxiliar) + <b>participiu acordat</b></td></tr>
<tr><td>Autorul acțiunii</td><td>subiect</td><td><b>complement de agent</b> (de / de către + Ac)</td></tr></table></div>
<p>Participiul se acordă cu subiectul: <i>Exercițiul este corectat. Exercițiile sunt corectat<b>e</b>.</i></p>
<h3>2. Trecerea activ → pasiv</h3>
<div class="ex"><i>Alina citește o carte.</i> → <i>Cartea <b>este citită</b> de Alina.</i><br>Complementul direct devine subiect; subiectul devine complement de agent; <b>auxiliarul „a fi” păstrează modul și timpul</b> verbului din activă.</div>
<div class="ex"><i>Profesorii <b>au dat</b> notele.</i> (perfect compus) → <i>Notele <b>au fost date</b> de profesori.</i> (tot perfect compus)</div>
<h3>3. Complementul de agent</h3>
<ul><li>răspunde la <b>de cine? de către cine?</b></li><li>se exprimă prin substantiv (<i>de spectatori</i>), pronume (<i>de noi</i>), numeral (<i>de cei patru</i>)</li><li><b>poate lipsi</b>: <i>Testele sunt corectate repede.</i> (agentul se subînțelege)</li></ul>
<h3>4. Capcana: „a fi” + participiu NU înseamnă mereu pasiv!</h3>
<div class="ex"><b>a)</b> <i>Cireșele erau coapte la tarabă.</i> → arată o <b>stare</b>, nu o acțiune suferită: <b>„erau” – copulativ</b>, „coapte” – nume predicativ (construcție activă).<br><b>b)</b> <i>Testele fuseseră corectate de profesori.</i> → există agent: <b>„fuseseră” – auxiliar</b>, construcție pasivă.</div>
<h3>5. Alte construcții din programă</h3>
<ul><li><b>Impersonală</b> – fără subiect posibil: <i>Plouă. Se înserează. Trebuie să înveți.</i></li>
<li><b>Reflexivă</b>: <i>Mă spăl. Își amintește.</i></li>
<li><b>Incidentală</b> – o idee „strecurată”, între virgule/linii: <i>Mâine, <b>cred</b>, va ploua.</i></li>
<li><b>Concesivă</b>: <i>Deși era obosit, a învățat.</i> · <b>Condițională</b>: <i>Dacă înveți, reușești.</i></li></ul>`,
 tricks:`
<div class="tip"><b>🎯 Test pasiv:</b> poți adăuga „<b>de către cineva</b>” și propoziția are sens? → pasiv. <i>Cireșele erau coapte <s>de către cineva</s></i> ✗ → copulativ.</div>
<div class="tip"><b>🧠 Activ → pasiv în 3 pași:</b> 1) CD devine subiect; 2) verbul devine „a fi” (același timp) + participiu acordat; 3) subiectul devine „de + ...”.</div>
<div class="trap"><b>⚠️</b> Nu schimba timpul! <i>citește</i> (prezent) → <i>este citită</i> (prezent), nu „a fost citită”.</div>`,
 q:[
 {t:'mc',q:'„Testele sunt corectate repede la clasa noastră.” conține o construcție:',o:['activă','pasivă','impersonală','reflexivă'],a:1,e:'sunt + participiul „corectate” – subiectul suportă acțiunea (agentul lipsește).'},
 {t:'mc',q:'Transformarea corectă în pasiv: „Eliza cumpără pachetul.”',o:['Pachetul a fost cumpărat de Eliza.','Pachetul este cumpărat de Eliza.','Eliza este cumpărată de pachet.','Pachetul cumpără Eliza.'],a:1,e:'Prezent → „este cumpărat” (tot prezent).'},
 {t:'mc',q:'Complementul de agent din „Maria este apreciată de spectatori.”:',o:['„Maria”','„este apreciată”','„de spectatori”','nu există'],a:2,e:'„de spectatori” – de către cine este apreciată.'},
 {t:'mc',q:'În „Cireșele erau coapte și am făcut o tartă.”, „erau” este:',o:['auxiliar','copulativ','predicativ','impersonal'],a:1,e:'Exprimă o stare (coapte = nume predicativ) → construcție activă cu verb copulativ.'},
 {t:'mc',q:'Transformarea corectă în activ: „Notele au fost date de profesori.”',o:['Profesorii dau notele.','Profesorii au dat notele.','Profesorii dăduseră notele.','Notele dau profesorii.'],a:1,e:'„au fost date” = perfect compus → „au dat” (perfect compus).'},
 {t:'tf',q:'Complementul de agent poate lipsi din construcția pasivă.',a:true,e:'Adevărat: „Testele sunt corectate.” – agentul se subînțelege.'},
 {t:'mc',q:'Construcția impersonală este:',o:['„Plouă mărunt.”','„Mama gătește.”','„Mă spăl.”','„Cartea e citită.”'],a:0,e:'„Plouă” nu poate avea subiect.'},
 {t:'mc',q:'Modul și timpul auxiliarului din „fuseseră corectate”:',o:['indicativ, imperfect','indicativ, mai-mult-ca-perfect','conjunctiv, perfect','indicativ, perfect simplu'],a:1,e:'„fuseseră” – mai-mult-ca-perfect (sufixul „-se-”).'},
 {t:'mc',q:'În „Testele fuseseră corectate de noi.”, complementul de agent e exprimat prin:',o:['substantiv','pronume personal','numeral','adverb'],a:1,e:'„noi” – pronume personal, pers. I plural, cazul acuzativ.'},
 {t:'mc',q:'Enunțul cu o construcție incidentală:',o:['Mâine, cred, vom pleca la munte.','Mâine plecăm la munte.','Plouă.','Muntele e frumos.'],a:0,e:'„cred” este strecurat între virgule – construcție incidentală.'}
 ]},

{id:'g5', title:'Substantivul și articolul', icon:'🧱',
 exam:'Subiectul I, Partea a II-a, itemul 6 (alcătuire: substantiv într-un caz dat) și itemul 8 (forme corecte de genitiv-dativ).',
 theory:`
<h3>1. Genul și numărul</h3>
<table class="t"><tr><th>Gen</th><th>Truc</th><th>Exemplu</th></tr>
<tr><td>Masculin</td><td>un ... / doi ...</td><td>un pom – doi pomi</td></tr>
<tr><td>Feminin</td><td>o ... / două ...</td><td>o floare – două flori</td></tr>
<tr><td>Neutru</td><td>un ... / două ...</td><td>un scaun – două scaune</td></tr></table>
<p><b>Defective</b>: doar singular (<i>aur, lapte, curaj, miere</i>) sau doar plural (<i>ochelari, tăiței, câlți</i>). <b>Colective</b>: arată o grupare: <i>stol, turmă, frunziș, cârd</i>.</p>
<h3>2. Cazurile și funcțiile lor</h3>
<div class="tw"><table class="t"><tr><th>Caz</th><th>Întrebări</th><th>Funcții posibile</th><th>Exemple</th></tr>
<tr><td><b>Nominativ</b></td><td>cine? ce?</td><td>subiect, nume predicativ, apoziție</td><td><i><b>Mama</b> gătește. Tata e <b>medic</b>.</i></td></tr>
<tr><td><b>Acuzativ</b></td><td>pe cine? ce? + prepoziții (cu, la, pe, în, din, despre, pentru...)</td><td>complement direct, complement prepozițional, circumstanțiale, atribut prepozițional</td><td><i>Citesc o <b>carte</b>. Vorbesc despre <b>film</b>.</i></td></tr>
<tr><td><b>Genitiv</b></td><td>al cui? a cui? ai cui? ale cui?</td><td>atribut genitival, nume predicativ, circumstanțial (cu prepoziții: asupra, împotriva, în fața, din cauza, în jurul)</td><td><i>Cartea <b>fetei</b>. Am stat în fața <b>casei</b>.</i></td></tr>
<tr><td><b>Dativ</b></td><td>cui?</td><td>complement indirect; circumstanțial (cu: datorită, grație, mulțumită, conform, potrivit, contrar)</td><td><i>I-am dat <b>fratelui</b> o carte. Datorită <b>ploii</b> am stat acasă.</i></td></tr>
<tr><td><b>Vocativ</b></td><td>cel strigat</td><td><b>nu are funcție sintactică</b>; se desparte prin virgulă!</td><td><i><b>Ioane</b>, vino! Vino, <b>bunico</b>!</i></td></tr></table></div>
<h4>Forme de genitiv-dativ utile</h4>
<p><i>broască → broaștei / unei broaște; fată → fetei; mamă → mamei; ploaie → ploii; ciocolată → ciocolatei; copil → copilului / copiilor; bunică → bunicii</i></p>
<h3>3. Articolul</h3>
<table class="t"><tr><th>Tip</th><th>Forme</th><th>Exemple</th></tr>
<tr><td>Hotărât (lipit la final)</td><td>-ul, -le, -a, -i, -le, -lui, -lor</td><td><i>pomul, fata, copiii</i></td></tr>
<tr><td>Nehotărât</td><td>un, o, niște, unui, unei, unor</td><td><i>un pom, o fată</i></td></tr>
<tr><td>Posesiv (genitival)</td><td>al, a, ai, ale</td><td><i>un prieten <b>al</b> meu, carte <b>a</b> Mariei</i></td></tr>
<tr><td>Demonstrativ (adjectival)</td><td>cel, cea, cei, cele</td><td><i>Ștefan <b>cel</b> Mare, fata <b>cea</b> harnică</i></td></tr></table>`,
 tricks:`
<div class="tip"><b>🎯 Genitiv sau dativ?</b> Aceeași formă (<i>fetei</i>)! Pune întrebarea: <b>a cui?</b> → genitiv; <b>cui?</b> → dativ. Sau încearcă să pui „al/a/ai/ale” în față: <i>cartea (a) fetei</i> → genitiv.</div>
<div class="trap"><b>⚠️ Capcana „datorită”:</b> „datorită, grație, mulțumită, conform, potrivit, contrar” cer <b>DATIVUL</b>, nu genitivul: <i>datorită <b>ploii</b></i> = dativ.</div>
<div class="tip"><b>🧠 Alcătuire cerută la examen:</b> „propoziție afirmativă cu substantivul «broască» în genitiv” → <i>Oracăitul <b>broaștei</b> se aude din lac.</i> ✅</div>`,
 q:[

{id:'g6', title:'Pronumele și adjectivul pronominal', icon:'👥',
 exam:'Itemii 5 (valoare morfologică) și 6 (ex.: „pronume personal, pers. a III-a, sg., genitiv”; „adjectiv pronominal posesiv, pers. a II-a, acuzativ”).',
 theory:`
<h3>Regula de aur</h3>
<div class="tip"><b>Pronume</b> = <b>ține locul</b> unui substantiv și are funcție proprie.<br><b>Adjectiv pronominal</b> = <b>stă lângă</b> un substantiv, se acordă cu el și este <b>atribut</b>.<br><i>Cartea ta e nouă, <b>a mea</b> e veche.</i> (pronume) vs. <i>cartea <b>mea</b></i> (adjectiv pronominal)</div>
<h3>Felurile pronumelui</h3>
<div class="tw"><table class="t"><tr><th>Fel</th><th>Forme</th><th>Exemplu</th></tr>
<tr><td><b>Personal</b></td><td>eu, tu, el, ea, noi, voi, ei, ele + forme neaccentuate: îmi/mi, îți/ți, îi/i, mă/m-, te, îl/l-, o, ne, vă, le/li<br>Genitiv pers. a III-a: <b>lui, ei, lor</b></td><td><i>Am găsit caietul <b>lui</b>.</i> (G) <i>I-am dat <b>lui</b>.</i> (D) <i>Eu <b>o</b> văd.</i></td></tr>
<tr><td><b>De politețe</b></td><td>dumneata, dumneavoastră, dânsul, dânsa, Domnia Sa</td><td><i><b>Dumneavoastră</b> ați sosit.</i></td></tr>
<tr><td><b>Reflexiv</b></td><td>mă, te, se, ne, vă, se; sine; își, își, sie</td><td><i><b>Mă</b> spăl. <b>Își</b> amintește.</i></td></tr>
<tr><td><b>Posesiv</b></td><td>al meu, a ta, ai lui (al său), ale noastre...</td><td><i>Al meu e mai mare.</i></td></tr>
<tr><td><b>Demonstrativ</b></td><td>acesta, aceasta, acela, ăsta, același, celălalt, cel</td><td><i><b>Acesta</b> e fratele meu.</i></td></tr>
<tr><td><b>Interogativ</b></td><td>cine, ce, care, cât, al câtelea (în întrebări)</td><td><i><b>Cine</b> a venit?</i></td></tr>
<tr><td><b>Relativ</b></td><td>aceleași forme, dar <b>leagă propoziții</b></td><td><i>Băiatul <b>care</b> citește...</i></td></tr>
<tr><td><b>Nehotărât</b></td><td>cineva, ceva, oricine, fiecare, toți, unii, alții, mulți, câțiva</td><td><i><b>Cineva</b> bate la ușă.</i></td></tr>
<tr><td><b>Negativ</b></td><td>nimeni, nimic, niciunul, niciuna</td><td><i><b>Nimeni</b> nu a venit.</i></td></tr>
<tr><td><b>De întărire</b></td><td>însumi, însuți, însuși, însăși, înșine, înșivă, înșiși, înseși</td><td><i>Ea <b>însăși</b> a recunoscut.</i></td></tr></table></div>
<h3>Scriere</h3>
<ul><li><b>niciun, nicio, niciunul</b> – legat (DOOM). <i>Nu am <b>nicio</b> grijă.</i></li>
<li><b>aceeași</b> (fem. sg.), <b>aceiași</b> (masc. pl.), <b>aceleași</b> (fem. pl.).</li>
<li><b>însăși</b> (ea), <b>însuși</b> (el), <b>înseși</b> (ele), <b>înșiși</b> (ei).</li></ul>`,
 tricks:`
<div class="tip"><b>🎯 Pronume sau adjectiv?</b> Acoperă cu degetul cuvântul din dreapta. Dacă rămâne singur și are sens („<i>a mea e veche</i>”) → pronume. Dacă stă lipit de un substantiv („<i>cartea mea</i>”) → adjectiv pronominal.</div>
<div class="tip"><b>🧠 Relativ vs. interogativ:</b> dacă e la început de întrebare → interogativ. Dacă e în mijlocul frazei și leagă două propoziții → relativ.</div>
<div class="exam"><b>Alcătuire tipică:</b> „enunț negativ cu un pronume personal, pers. a III-a, sg., în genitiv” → <i>Nu am găsit caietul <b>lui</b>.</i> ✅</div>`,
 q:[
 {t:'mc',q:'„Cartea ta e nouă, <u class=s>a mea</u> e veche.” – „a mea” este:',o:['adjectiv pronominal posesiv','pronume posesiv','pronume personal','articol'],a:1,e:'Ține locul substantivului „cartea” → pronume posesiv.'},
 {t:'mc',q:'„Prietenul <u class=s>meu</u> a sosit.” – „meu” este:',o:['pronume posesiv','adjectiv pronominal posesiv','pronume personal','adverb'],a:1,e:'Stă lângă substantiv și se acordă cu el → adjectiv pronominal posesiv.'},
 {t:'mc',q:'Forma corectă a pronumelui de întărire:',o:['Ea însuși a recunoscut.','Ea însăși a recunoscut.','Ea înseși a recunoscut.','Ea însăș a recunoscut.'],a:1,e:'Feminin singular: însăși.'},
 {t:'mc',q:'Enunțul cu un pronume personal, pers. a III-a, sg., în genitiv:',o:['Am găsit caietul lui.','I-am dat lui o carte.','El citește.','L-am văzut.'],a:0,e:'caietul a cui? – lui → genitiv.'},
 {t:'mc',q:'„Băiatul <u class=s>care</u> citește e fratele meu.” – „care” este:',o:['pronume interogativ','pronume relativ','adjectiv pronominal','conjuncție'],a:1,e:'Leagă propoziția „care citește” de regentă → relativ.'},
 {t:'mc',q:'„<u class=s>Nimeni</u> nu a venit.” – „nimeni” este pronume:',o:['nehotărât','negativ','relativ','personal'],a:1,e:'nimeni, nimic, niciunul = pronume negative.'},
 {t:'mc',q:'Scrierea corectă:',o:['Nu am nici o grijă.','Nu am nicio grijă.','Nu am niciio grijă.','Nu am nic-io grijă.'],a:1,e:'„nicio” se scrie legat.'},
 {t:'mc',q:'„Dumneavoastră” este pronume:',o:['de politețe','de întărire','reflexiv','demonstrativ'],a:0,e:'Pronume personal de politețe.'},
 {t:'mc',q:'„<u class=s>Mă</u> spăl pe mâini.” – „mă” este pronume:',o:['personal','reflexiv','de politețe','posesiv'],a:1,e:'Acțiunea se întoarce asupra subiectului → reflexiv.'},
 {t:'mc',q:'Enunțul imperativ cu un adjectiv pronominal posesiv, pers. a II-a, în acuzativ:',o:['Ia-ți caietul tău!','Caietul tău e pe masă.','Al tău e pe masă!','Ce caiet ai?'],a:0,e:'„caietul tău” = complement direct (acuzativ); „tău” = adj. pron. posesiv, pers. a II-a; enunț imperativ.'},
 {t:'mc',q:'Forma corectă: „Am primit ___ notă ca tine.”',o:['aceiași','aceeași','aceleași','aceeaș'],a:1,e:'feminin singular („notă”) → aceeași.'}
 ]},

{id:'g7', title:'Adjectivul, numeralul, adverbul', icon:'📏',
 exam:'Itemul 5 (valori morfologice), itemul 6 (alcătuire cu funcții: „acolo” – atribut), itemul 8 (ex.: „bine” – superlativ relativ).',
 theory:`
<h3>1. Adjectivul</h3>
<ul><li>Arată o <b>însușire</b>: ce fel de? Se acordă cu substantivul: <i>frumos, frumoasă, frumoși, frumoase</i>.</li>
<li><b>Invariabile</b>: <i>gri, roz, maro, oranj, cumsecade, asemenea</i>.</li>
<li><b>Provenit din participiu</b>: <i>geam <b>spart</b>, ușă <b>închisă</b></i>.</li>
<li>Funcții: <b>atribut adjectival</b> (<i>casă <b>mare</b></i>) sau <b>nume predicativ</b> (<i>Casa e <b>mare</b>.</i>).</li></ul>
<h3>2. Gradele de comparație (adjectiv și adverb)</h3>
<table class="t"><tr><th>Grad</th><th>Exemplu</th></tr>
<tr><td>Pozitiv</td><td>bun / bine</td></tr>
<tr><td>Comparativ de superioritate</td><td><b>mai</b> bun <b>decât</b></td></tr>
<tr><td>Comparativ de egalitate</td><td><b>la fel de / tot așa de</b> bun <b>ca</b></td></tr>
<tr><td>Comparativ de inferioritate</td><td><b>mai puțin</b> bun <b>decât</b></td></tr>
<tr><td>Superlativ relativ de superioritate</td><td><b>cel mai</b> bun (dintre) / <b>cel mai</b> bine</td></tr>
<tr><td>Superlativ relativ de inferioritate</td><td><b>cel mai puțin</b> bun</td></tr>
<tr><td>Superlativ absolut</td><td><b>foarte</b> bun, extrem de bun, nemaipomenit de bun</td></tr></table>
<h3>3. Numeralul</h3>
<table class="t"><tr><th>Fel</th><th>Exemple</th></tr>
<tr><td>Cardinal</td><td>unu, doi, doisprezece, douăzeci</td></tr>
<tr><td>Ordinal</td><td>primul, întâiul, al doilea, a doua, al treilea</td></tr>
<tr><td>Colectiv</td><td>amândoi, câteșitrei, toți patru</td></tr>
<tr><td>Fracționar / multiplicativ / distributiv / adverbial</td><td>o jumătate, două treimi / îndoit / câte doi / o dată, de două ori</td></tr></table>
<div class="trap"><b>Norme:</b> <i>unsprezece, doisprezece/douăsprezece, <b>paisprezece</b>, <b>șaisprezece</b>, <b>ora două</b></i> (nu „ora doi”), <i>al doilea / a doua</i>.</div>
<h3>4. Adverbul</h3>
<ul><li><b>De mod</b>: bine, repede, frumos, așa · <b>De timp</b>: azi, ieri, acum, mâine, atunci · <b>De loc</b>: aici, acolo, sus, jos, departe.</li>
<li>Funcții: <b>circumstanțial</b> de mod/timp/loc (<i>Vino <b>acum</b>.</i>) sau <b>atribut adverbial</b> pe lângă un substantiv (<i>Casa <b>de acolo</b> e veche.</i>).</li></ul>`,
 tricks:`
<div class="tip"><b>🎯 Adjectiv sau adverb?</b> Adjectivul stă lângă un <b>substantiv</b> și se acordă (<i>fată frumoas<b>ă</b></i>). Adverbul stă lângă un <b>verb</b> și nu se schimbă (<i>cântă frumos</i>).</div>
<div class="exam"><b>Alcătuire cerută la examen:</b> „enunț exclamativ în care «acolo» are funcția de atribut” → <i>Ce frumoasă e priveliștea <b>de acolo</b>!</i> ✅ (Priveliștea care? – de acolo).</div>
<div class="tip"><b>🧠 Superlativ relativ = „cel mai”</b>. Superlativ absolut = „foarte”. Ține minte: „cel” = relativ (comparat cu alții).</div>`,
 q:[
 {t:'mc',q:'„cel mai înalt dintre colegi” – gradul de comparație:',o:['comparativ de superioritate','superlativ relativ de superioritate','superlativ absolut','pozitiv'],a:1,e:'„cel mai” = superlativ relativ.'},
 {t:'mc',q:'„foarte bun” este la gradul:',o:['superlativ absolut','superlativ relativ','comparativ','pozitiv'],a:0,e:'„foarte” = superlativ absolut.'},
 {t:'in',q:'Scrie adverbul „bine” la superlativ relativ de superioritate:',a:['cel mai bine'],e:'cel mai bine.'},
 {t:'mc',q:'Scrierea corectă:',o:['patrusprezece','paisprezece','paișpe','patrusprăzece'],a:1,e:'Forma literară: paisprezece.'},
 {t:'mc',q:'„Am sosit <u class=s>al doilea</u>.” – „al doilea” este numeral:',o:['cardinal','ordinal','colectiv','fracționar'],a:1,e:'Arată ordinea → ordinal.'},
 {t:'mc',q:'Funcția lui „de acolo” în „Casa <u class=s>de acolo</u> e veche.”:',o:['circumstanțial de loc','atribut adverbial','complement direct','nume predicativ'],a:1,e:'Determină substantivul „casa” → atribut adverbial.'},
 {t:'mc',q:'„Ea cântă <u class=s>frumos</u>.” – „frumos” este:',o:['adjectiv','adverb de mod','substantiv','numeral'],a:1,e:'Determină verbul „cântă” → adverb de mod.'},
 {t:'mc',q:'Adjectivul invariabil este:',o:['„gri”','„verde”','„mare”','„vechi”'],a:0,e:'„gri” are o singură formă.'},
 {t:'mc',q:'„amândoi” este numeral:',o:['cardinal','ordinal','colectiv','distributiv'],a:2,e:'Arată o grupare → colectiv.'},
 {t:'tf',q:'Corect este: „E ora doi.”',a:false,e:'Corect: „E ora două.”'},
 {t:'mc',q:'Enunțul exclamativ în care „acolo” are funcția de atribut:',o:['Acolo e frumos!','Ce frumoasă e priveliștea de acolo!','Mergem acolo?','Stai acolo!'],a:1,e:'„de acolo” determină substantivul „priveliștea” → atribut adverbial.'},
 {t:'mc',q:'Comparativ de egalitate:',o:['mai înalt decât','la fel de înalt ca','cel mai înalt','foarte înalt'],a:1,e:'la fel de / tot așa de ... ca.'}

{id:'g8', title:'Cuvinte-capcană și părți de vorbire neflexibile', icon:'🪤',
 exam:'Itemul 5 (6 p): „Precizează valoarea morfologică a cuvântului «o» / «a» / «un» / «ce»...” – apare aproape în fiecare an!',
 theory:`
<h3>1. Prepoziția, conjuncția, interjecția</h3>
<ul><li><b>Prepoziția</b> leagă un cuvânt de altul în propoziție: <i>de, la, pe, cu, în, din, pentru, despre</i>; compuse: <i>de la, de pe, pe la</i>; locuțiuni: <i>în fața, din cauza, cu privire la</i>.<br>Regim: <b>Ac</b> (majoritatea), <b>G</b> (asupra, contra, deasupra, împotriva, înaintea, în fața, în urma, din cauza, în jurul), <b>D</b> (datorită, grație, mulțumită, conform, potrivit, contrar, asemenea).</li>
<li><b>Conjuncția</b> leagă propoziții sau părți de propoziție:<br>coordonatoare – copulative (<i>și, nici</i>), adversative (<i>dar, iar, însă, ci</i>), disjunctive (<i>sau, ori, fie</i>), conclusive (<i>deci, așadar, prin urmare</i>);<br>subordonatoare – <i>că, să, dacă, deși, fiindcă, deoarece, încât, ca să</i>.</li>
<li><b>Interjecția</b> exprimă stări, sunete, îndemnuri: <i>vai, au, hai, iată, na, zup!</i> Când ține loc de verb e <b>interjecție predicativă</b> (predicat verbal): <i><b>Hai</b> la joacă! <b>Iată</b>-l!</i> <b>Onomatopeele</b> imită sunete: <i>miau, tic-tac</i>.</li></ul>
<h3>2. Tabelul cuvintelor-capcană 🪤</h3>
<div class="tw"><table class="t"><tr><th>Cuvânt</th><th>Valori + exemple</th></tr>
<tr><td><b>o</b></td><td>articol nehotărât (<i><b>o</b> carte</i>) · pronume personal (<i><b>o</b> văd, eu <b>o</b> îngânam</i>) · numeral (<i>am <b>o</b> soră și doi frați</i>) · verb auxiliar al viitorului popular (<i><b>o</b> să plec</i>) · interjecție (<i><b>O</b>, ce frumos!</i>)</td></tr>
<tr><td><b>a</b></td><td>articol hotărât (<i>fat<b>a</b></i>) · articol posesiv (<i>carte <b>a</b> Mariei</i>) · prepoziție (<i>miroase <b>a</b> fum</i>) · verb auxiliar (<i><b>a</b> plecat</i>) · marcă a infinitivului (<i><b>a</b> cânta</i>) · interjecție (<i><b>A</b>, te-am prins!</i>)</td></tr>
<tr><td><b>un</b></td><td>articol nehotărât (<i><b>un</b> copil</i>) · numeral (<i>am <b>un</b> frate, nu doi</i>)</td></tr>
<tr><td><b>ce</b></td><td>pronume interogativ (<i><b>Ce</b> faci?</i>) · pronume relativ (<i>Știu <b>ce</b> faci.</i>) · adjectiv pronominal (<i><b>Ce</b> carte citești?</i>) · adverb (<i><b>Ce</b> frumos cântă!</i>)</td></tr>
<tr><td><b>ia</b></td><td>verb (<i><b>Ia</b> cartea!</i> – a lua) · interjecție (<i><b>Ia</b> uite!</i>). ≠ <i>i-a</i> (pronume + verb auxiliar: <i><b>i-a</b> dat</i>)</td></tr>
<tr><td><b>mele / meu</b></td><td>adjectiv pronominal posesiv (<i>prietenele <b>mele</b></i>) · pronume posesiv (<i>ale <b>mele</b></i> – împreună cu articolul)</td></tr>
<tr><td><b>să</b></td><td>conjuncție subordonatoare / marcă a conjunctivului (<i>vreau <b>să</b> plec</i>)</td></tr>
<tr><td><b>decât</b></td><td>adverb (<i>Nu am <b>decât</b> doi lei.</i>) · conjuncție (<i>mai mare <b>decât</b> mine</i>). ≠ <i>de cât</i> (<i><b>De cât</b> timp aștepți?</i>)</td></tr>
<tr><td><b>mai</b></td><td>adverb (<i><b>mai</b> vreau</i>) · substantiv (<i>luna <b>mai</b></i>)</td></tr>
<tr><td><b>i</b></td><td>pronume personal (<i><b>i</b>-am dat</i>) · articol hotărât (<i>pomi<b>i</b>, copii<b>i</b></i>)</td></tr></table></div>`,
 tricks:`
<div class="tip"><b>🎯 Algoritmul pentru „o”:</b> 1) Urmează un substantiv? → articol nehotărât (sau numeral, dacă se opune lui „două”). 2) Urmează un verb? → pronume personal (<i>o văd</i>) sau auxiliar (<i>o să</i>). 3) E urmat de virgulă/semnul exclamării? → interjecție.</div>
<div class="tip"><b>🎯 Pentru „a”:</b> lipit la final → articol hotărât; înainte de participiu (<i>a mers</i>) → verb auxiliar; înainte de genitiv (<i>a Mariei</i>) → articol posesiv; înainte de infinitiv → marcă a infinitivului; „miroase a” → prepoziție.</div>
<div class="trap"><b>⚠️</b> La examen scrie valoarea completă: <b>„pronume personal”</b>, nu doar „pronume”; <b>„verb auxiliar”</b>, nu doar „verb”.</div>`,
 q:[
 {t:'mc',q:'„Yolanda cânta, eu <u class=s>o</u> îngânam.” – „o” este:',o:['articol nehotărât','pronume personal','numeral','interjecție'],a:1,e:'Ține locul unui substantiv (melodia/Yolanda) și stă lângă verb → pronume personal.'},
 {t:'mc',q:'„Era <u class=s>o</u> toamnă frumoasă.” – „o” este:',o:['articol nehotărât','pronume personal','numeral','verb'],a:0,e:'Stă în fața substantivului „toamnă” → articol nehotărât.'},
 {t:'mc',q:'„<u class=s>A</u> plecat devreme.” – „a” este:',o:['articol hotărât','prepoziție','verb auxiliar','articol posesiv'],a:2,e:'a + participiu (plecat) = perfect compus → verb auxiliar.'},
 {t:'mc',q:'„Miroase <u class=s>a</u> trandafiri.” – „a” este:',o:['prepoziție','verb auxiliar','articol','interjecție'],a:0,e:'„a miroși a ceva” – „a” este prepoziție.'},
 {t:'mc',q:'„<u class=s>Ce</u> frumos cântă!” – „ce” este:',o:['pronume interogativ','pronume relativ','adverb','adjectiv pronominal'],a:2,e:'Întărește adverbul „frumos” într-un enunț exclamativ → adverb.'},

{id:'g9', title:'Sintaxa propoziției: părți de propoziție', icon:'🧩',
 exam:'Itemul 6 (6 p): alcătuiri cu tipuri de enunțuri + funcții sintactice; folosită și la itemul 7 (fraza).',
 theory:`
<h3>1. Tipuri de enunțuri</h3>
<table class="t"><tr><th>După scop</th><th>Exemplu</th></tr>
<tr><td><b>Asertiv</b> (enunțiativ) – transmite o informație</td><td><i>Plouă de ieri.</i></td></tr>
<tr><td><b>Interogativ</b> – întrebare</td><td><i>Ai citit cartea?</i></td></tr>
<tr><td><b>Exclamativ</b> – emoție, uimire</td><td><i>Ce zi frumoasă!</i></td></tr>
<tr><td><b>Imperativ</b> – ordin, rugăminte, sfat</td><td><i>Închide ușa, te rog.</i> / <i>Să taci!</i></td></tr></table>
<p>Propoziția poate fi <b>afirmativă</b> sau <b>negativă</b> (nu, nici, nimeni, nimic, niciodată); <b>simplă</b> (doar subiect + predicat) sau <b>dezvoltată</b>; <b>eliptică</b> (lipsește predicatul: <i>— Unde mergi? — Acasă.</i>).</p>
<h3>2. Părțile principale</h3>
<ul><li><b>Subiectul</b> (cine? ce?): exprimat – simplu/multiplu; neexprimat – <b>inclus</b> (<i>Citesc.</i> = eu) sau <b>subînțeles</b> (din context).</li>
<li><b>Predicatul verbal</b> = verb predicativ la mod personal (sau interjecție predicativă): <i>Copilul <b>doarme</b>.</i></li>
<li><b>Predicatul nominal</b> = verb copulativ + <b>nume predicativ</b>: <i>Florile <b>sunt parfumate</b>.</i> Numele predicativ se acordă cu subiectul.</li></ul>
<h3>3. Părțile secundare</h3>
<div class="tw"><table class="t"><tr><th>Funcție</th><th>Întrebări</th><th>Exemplu</th></tr>
<tr><td><b>Atribut</b> (pe lângă substantiv)</td><td>care? ce fel de? al cui? câți?</td><td><i>casa <b>mare</b>, cartea <b>fetei</b>, cartea <b>de pe masă</b>, casa <b>de acolo</b></i></td></tr>
<tr><td><b>Apoziție</b></td><td>explică un substantiv; între virgule</td><td><i>Ana, <b>colega mea</b>, a câștigat.</i></td></tr>
<tr><td><b>Complement direct</b></td><td>pe cine? ce?</td><td><i>Mama a cumpărat <b>pâine</b>. Îl văd <b>pe Ion</b>.</i></td></tr>
<tr><td><b>Complement indirect</b></td><td>cui?</td><td><i>Am scris <b>prietenului</b>.</i></td></tr>
<tr><td><b>Complement prepozițional</b></td><td>despre cine/ce? la ce? cu cine? de cine?</td><td><i>Vorbim <b>despre vacanță</b>. Mă gândesc <b>la tine</b>.</i></td></tr>
<tr><td><b>Circ. de loc</b></td><td>unde? de unde? până unde?</td><td><i>Stau <b>acasă</b>.</i></td></tr>
<tr><td><b>Circ. de timp</b></td><td>când? de când? până când?</td><td><i>Plec <b>mâine</b>.</i></td></tr>
<tr><td><b>Circ. de mod</b></td><td>cum?</td><td><i>Doarme <b>liniștit</b>.</i></td></tr>
<tr><td><b>Circ. de cauză</b></td><td>de ce? din ce cauză?</td><td><i>Tremură <b>de frică</b>.</i></td></tr>
<tr><td><b>Circ. de scop</b></td><td>cu ce scop? pentru ce?</td><td><i>Învăț <b>pentru examen</b>.</i></td></tr>
<tr><td><b>Complement de agent</b></td><td>de cine? de către cine? (în pasiv)</td><td><i>E lăudat <b>de profesor</b>.</i></td></tr></table></div>`,
 tricks:`
<div class="tip"><b>🎯 Regula de aur:</b> întrebarea se pune <b>de la cuvântul regent</b> (cel determinat). Pentru atribut întrebi de la substantiv, pentru complement – de la verb.</div>
<div class="tip"><b>🧠 Complement prepozițional vs. circumstanțial:</b> dacă prepoziția e „cerută” de verb (<i>a se gândi <b>la</b>, a vorbi <b>despre</b>, a se teme <b>de</b></i>) → complement prepozițional. Dacă arată loc/timp/mod → circumstanțial.</div>
<div class="trap"><b>⚠️ La alcătuiri:</b> respectă AMBELE cerințe (tipul enunțului + funcția). Un enunț exclamativ se termină cu „!”, unul interogativ cu „?”. Greșeala de ortografie sau punctuație îți taie punctul de „norme”.</div>`,
 q:[
 {t:'mc',q:'Tipul enunțului „Închide ușa, te rog.”:',o:['asertiv','interogativ','imperativ','exclamativ'],a:2,e:'Exprimă o rugăminte → imperativ (chiar dacă se termină cu punct).'},
 {t:'mc',q:'Subiectul din „Citesc o carte.” este:',o:['„carte”','neexprimat, inclus (eu)','„citesc”','neexprimat, subînțeles'],a:1,e:'Desinența verbului arată persoana I → subiect inclus.'},
 {t:'mc',q:'Predicatul din „Florile sunt parfumate.” este:',o:['verbal','nominal','nu există','eliptic'],a:1,e:'„sunt” (copulativ) + „parfumate” (nume predicativ).'},
 {t:'mc',q:'Funcția lui „despre vacanță” în „Am vorbit despre vacanță.”:',o:['circumstanțial de loc','complement prepozițional','complement direct','atribut'],a:1,e:'„a vorbi despre” – prepoziția e cerută de verb.'},
 {t:'mc',q:'„Am trimis un mesaj <u class=s>prietenului</u>.” – funcția:',o:['complement direct','complement indirect','atribut','subiect'],a:1,e:'Cui am trimis? – prietenului (dativ).'},
 {t:'mc',q:'„A tremurat <u class=s>de frică</u>.” – funcția:',o:['circumstanțial de cauză','circumstanțial de mod','complement prepozițional','atribut'],a:0,e:'De ce a tremurat? – de frică.'},
 {t:'mc',q:'„Ana, <u class=s>colega mea</u>, a câștigat.” – funcția lui „colega”:',o:['subiect','apoziție','atribut','complement direct'],a:1,e:'Explică substantivul „Ana”, între virgule → apoziție.'},
 {t:'mc',q:'„Învăț <u class=s>pentru examen</u>.” – funcția:',o:['circumstanțial de scop','circumstanțial de cauză','complement indirect','atribut'],a:0,e:'Cu ce scop învăț? – pentru examen.'},
 {t:'mc',q:'Propoziția negativă este:',o:['Toți au venit.','Nimeni nu a întârziat.','Cine a venit?','Ce bine e!'],a:1,e:'Conține negația „nu” (și pronumele negativ „nimeni”).'},
 {t:'mc',q:'„Cartea <u class=s>de pe masă</u> este a mea.” – funcția:',o:['circumstanțial de loc','atribut substantival prepozițional','complement prepozițional','nume predicativ'],a:1,e:'Care carte? – de pe masă → atribut (determină un substantiv).'},
 {t:'mc',q:'Complementul direct din „Mama a cumpărat pâine.”:',o:['„Mama”','„a cumpărat”','„pâine”','nu are'],a:2,e:'Ce a cumpărat? – pâine.'},
 {t:'mc',q:'„Copilul doarme <u class=s>liniștit</u>.” – funcția:',o:['atribut','circumstanțial de mod','nume predicativ','complement direct'],a:1,e:'Cum doarme? – liniștit.'},
 {t:'mc',q:'Enunțul asertiv în care „copilărie” e complement prepozițional:',o:['Copilăria e frumoasă.','Mă gândesc des la copilărie.','Ce copilărie fericită!','Ți-a plăcut copilăria?'],a:1,e:'„a se gândi la ceva” → complement prepozițional; enunțul e asertiv.'}
 ]},

{id:'g10', title:'Fraza: coordonare și subordonate', icon:'🔗',
 exam:'Itemul 7 (6 p): „Transcrie trei propoziții subordonate și precizează felul fiecăreia” (1 p transcriere + 2 p felul, pentru fiecare).',
 theory:`
<h3>1. Câte propoziții are fraza?</h3>
<div class="tip"><b>Regula:</b> câte <b>predicate</b> (verbe la mod personal / interjecții predicative), atâtea propoziții.</div>
<h3>2. Coordonarea</h3>
<ul><li>prin <b>juxtapunere</b> (virgulă): <i>Am venit, am văzut.</i></li>
<li>prin conjuncții: <b>copulative</b> (și, nici), <b>adversative</b> (dar, iar, însă, ci), <b>disjunctive</b> (sau, ori, fie), <b>conclusive</b> (deci, așadar, prin urmare).</li></ul>
<h3>3. Subordonarea</h3>
<p>Elemente de relație: <b>conjuncții subordonatoare</b> (că, să, dacă, deși, fiindcă, deoarece, încât, ca să), <b>pronume relative</b> (care, ce, cine, cât), <b>adverbe relative</b> (unde, când, cum, cât).</p>
<h4>Subordonatele din programa EN</h4>
<div class="tw"><table class="t"><tr><th>Subordonata</th><th>Întrebare</th><th>Introdusă de</th><th>Exemplu</th></tr>
<tr><td><b>Atributivă</b></td><td>care? ce fel de? (de la un substantiv)</td><td>care, ce, unde, când, cum</td><td><i>Am citit cartea [<b>pe care mi-ai dat-o</b>].</i></td></tr>
<tr><td><b>Completivă directă</b></td><td>ce? pe cine?</td><td>că, să, dacă, ce, cine, cum</td><td><i>Știu [<b>că vei reuși</b>].</i></td></tr>
<tr><td><b>Completivă indirectă</b></td><td>cui?</td><td>cui, cine (în D)</td><td><i>Dă premiul [<b>cui îl merită</b>].</i></td></tr>
<tr><td><b>Completivă prepozițională</b></td><td>despre ce? la ce? de ce?</td><td>prepoziție + ce/cine/cum; să</td><td><i>Mă gândesc [<b>la ce mi-ai spus</b>].</i></td></tr>
<tr><td><b>Circ. de loc</b></td><td>unde?</td><td>unde, încotro</td><td><i>Merg [<b>unde vrei tu</b>].</i></td></tr>
<tr><td><b>Circ. de timp</b></td><td>când?</td><td>când, până să, după ce, înainte să</td><td><i>[<b>Când plouă</b>], stau acasă.</i></td></tr>
<tr><td><b>Circ. de mod</b></td><td>cum?</td><td>cum, precum</td><td><i>Fă [<b>cum te-am învățat</b>].</i></td></tr>
<tr><td><b>Cauzală</b></td><td>de ce? din ce cauză?</td><td>fiindcă, deoarece, pentru că, întrucât</td><td><i>Am întârziat [<b>fiindcă a plouat</b>].</i></td></tr>
<tr><td><b>Finală</b> (de scop)</td><td>cu ce scop?</td><td>ca să, să, pentru ca să</td><td><i>Învăț [<b>ca să iau notă mare</b>].</i></td></tr></table></div>
<p class="dim small">Notă: subiectiva și predicativa nu apar în programa EN 2027 (lista oficială cuprinde subordonatele de mai sus).</p>
<h3>4. Algoritmul în 5 pași (item 7)</h3>
<ol><li>Subliniază <b>verbele la mod personal</b>.</li><li>Încercuiește <b>elementele de relație</b>.</li><li>Pune <b>paranteze</b> pentru fiecare propoziție.</li><li>Găsește <b>regenta</b> și pune întrebarea de la ea.</li><li><b>Transcrie exact</b> propoziția, cu tot cu elementul de relație.</li></ol>
<div class="ex"><b>Exemplu:</b> <i>[Când primăvara a venit,]<sub>CT</sub> [popa a săpat straturi]<sub>principală</sub> [ca să semene legumele]<sub>finală</sub> [pe care le iubea preoteasa.]<sub>atributivă</sub></i></div>`,
 tricks:`
<div class="tip"><b>🎯 „care” → aproape mereu atributivă</b> (determină un substantiv din față). <b>„că” după a ști / a spune / a vedea → completivă directă.</b> <b>„ca să” → finală.</b> <b>„fiindcă/deoarece” → cauzală.</b></div>
<div class="tip"><b>🧠 Truc „înlocuire”:</b> înlocuiește subordonata cu un singur cuvânt: <i>Merg [unde vrei tu]</i> → <i>Merg <b>acolo</b></i> (circumstanțial de loc) → circumstanțială de loc.</div>
<div class="trap"><b>⚠️ Greșeli care costă:</b> transcrii doar o bucată (fără „care”/„că”); scrii „subordonată” fără fel; confunzi „când” atributiv (<i>ziua <b>când</b> am plecat</i> – atributivă!) cu „când” temporal.</div>`,
 q:[
 {t:'mc',q:'„Am citit cartea [<u class=s>pe care mi-ai dat-o</u>].” – subordonata este:',o:['completivă directă','atributivă','circumstanțială de mod','cauzală'],a:1,e:'Determină substantivul „cartea” – care carte? → atributivă.'},
 {t:'mc',q:'„Știu [<u class=s>că vei reuși</u>].” – subordonata este:',o:['completivă directă','completivă indirectă','finală','cauzală'],a:0,e:'Ce știu? – că vei reuși → completivă directă.'},
 {t:'mc',q:'„Am întârziat [<u class=s>fiindcă a plouat</u>].” – subordonata este:',o:['finală','cauzală','temporală','atributivă'],a:1,e:'De ce am întârziat? → cauzală.'},
 {t:'mc',q:'„Învăț [<u class=s>ca să iau notă mare</u>].” – subordonata este:',o:['finală','cauzală','completivă directă','circumstanțială de mod'],a:0,e:'Cu ce scop? → finală.'},
 {t:'mc',q:'„[<u class=s>Când plouă</u>], stau acasă.” – subordonata este:',o:['circumstanțială de loc','circumstanțială de timp','atributivă','cauzală'],a:1,e:'Când stau acasă? → circumstanțială de timp.'},
 {t:'mc',q:'„Merg [<u class=s>unde vrei tu</u>].” – subordonata este:',o:['circumstanțială de loc','completivă directă','atributivă','circumstanțială de mod'],a:0,e:'Unde merg? → circumstanțială de loc.'},
 {t:'mc',q:'„Mă gândesc [<u class=s>la ce mi-ai spus</u>].” – subordonata este:',o:['completivă directă','completivă prepozițională','atributivă','cauzală'],a:1,e:'La ce mă gândesc? (a se gândi la) → completivă prepozițională.'},
 {t:'mc',q:'„Fă [<u class=s>cum te-am învățat</u>]!” – subordonata este:',o:['circumstanțială de mod','completivă directă','finală','atributivă'],a:0,e:'Cum să fac? → circumstanțială de mod.'},
 {t:'mc',q:'„Îmi amintesc ziua [<u class=s>când am plecat</u>].” – subordonata este:',o:['circumstanțială de timp','atributivă','completivă directă','cauzală'],a:1,e:'Determină substantivul „ziua” – care zi? → atributivă (capcană cu „când”!).'},
 {t:'mc',q:'Câte propoziții are fraza „Când am ajuns, am văzut că toți plecaseră.”?',o:['două','trei','patru','una'],a:1,e:'Trei predicate: am ajuns, am văzut, plecaseră.'},
 {t:'mc',q:'„Dau premiul [<u class=s>cui îl merită</u>].” – subordonata este:',o:['completivă indirectă','completivă directă','atributivă','finală'],a:0,e:'Cui dau premiul? → completivă indirectă.'},
 {t:'mc',q:'Conjuncția coordonatoare conclusivă:',o:['„dar”','„deci”','„sau”','„și”'],a:1,e:'deci, așadar, prin urmare = conclusive.'}
 ]},

{id:'g11', title:'Ortografie și punctuație', icon:'✍️',
 exam:'Itemul 8 (6 p): „Scrie forma corectă a cuvintelor subliniate” + punctele de ortografie/punctuație din TOATE răspunsurile deschise și din compunere.',
 theory:`
<h3>1. Scrierea cu cratimă – perechile celebre</h3>
<div class="tw"><table class="t"><tr><th>Legat</th><th>Cu cratimă</th><th>Truc</th></tr>
<tr><td><b>sa</b> (al său): <i>cartea sa</i></td><td><b>s-a</b> (se + a): <i>s-a dus</i></td><td>pune „lui/ei” în loc → <i>sa</i></td></tr>
<tr><td><b>sau</b> (ori): <i>vii sau nu?</i></td><td><b>s-au</b> (se + au): <i>ei s-au dus</i></td><td>pune „ori” → <i>sau</i></td></tr>
<tr><td><b>ia</b> (a lua): <i>ia cartea!</i></td><td><b>i-a</b> (îi + a): <i>i-a dat</i></td><td>pune „îi” → <i>i-a</i></td></tr>
<tr><td><b>la</b> (prepoziție): <i>la școală</i></td><td><b>l-a</b> (îl + a): <i>l-a văzut</i></td><td>pune „îl” → <i>l-a</i></td></tr>
<tr><td><b>va</b> (viitor): <i>va veni</i></td><td><b>v-a</b> (vă + a): <i>v-a spus</i></td><td>pune „vă” → <i>v-a</i></td></tr>
<tr><td><b>nea</b> (zăpadă), <b>mia</b> (o mie), <b>nai</b> (instrument)</td><td><b>ne-a, mi-a, n-ai</b></td><td>„ne/mi/nu” + verb</td></tr>
<tr><td><b>cei</b> (cei harnici)</td><td><b>ce-i</b> (ce îi / ce este)</td><td>„ce este?” → <i>ce-i</i></td></tr></table></div>
<p>Alte cratime: <i>într-un, dintr-o, printr-un, dă-mi, spune-mi, du-te, să-și, și-a, și-au, ia-ți, mi-am, ți-am</i>.</p>
<h3>2. Legat sau separat?</h3>
<table class="t"><tr><th>Legat</th><th>Separat</th></tr>
<tr><td><b>odată</b> = cândva / odinioară / simultan (<i>A fost odată; odată cu tine</i>)</td><td><b>o dată</b> = o singură dată (<i>Am fost <b>o dată</b>, nu de două ori</i>)</td></tr>
<tr><td><b>deodată</b> = brusc / în același timp</td><td><b>de odată</b> (rar)</td></tr>
<tr><td><b>numai</b> = doar</td><td><b>nu mai</b> = negație + mai (<i>nu mai vreau</i>)</td></tr>
<tr><td><b>niciodată</b> = în niciun moment</td><td><b>nici o dată</b> = nici măcar o singură dată</td></tr>
<tr><td><b>decât</b> = doar / comparație</td><td><b>de cât</b> (<i>De cât timp?</i>)</td></tr>
<tr><td><b>deseară, altfel, niciun, nicio</b></td><td><b>alt fel</b> (alt tip)</td></tr></table>
<h3>3. Câți de „i”?</h3>
<table class="t"><tr><th>Nearticulat</th><th>Articulat</th></tr>
<tr><td>copii, fii, membri, miniștri</td><td><b>copiii, fiii, membrii, miniștrii</b> (cu un „i” în plus = articolul)</td></tr></table>

function genQ(g, i, d){ const G=GENS[g]; const n=G.n(); i=((i%n)+n)%n; const r=rngOf(g+':'+i+':'+Math.floor(Math.random()*1e9)); const q=G.make(i,r,d||0); q.qid='gen:'+g+':'+i; q.mod=null; q.gen=g; return q; }
function seenN(k){ try{ return (ST.seen&&ST.seen[k])||0; }catch(e){ return 0; } }
function genMany(list, count, d){ const out=[], used=new Set(); let guard=0; while(out.length<count && guard++<count*30){ const g=list[Math.floor(Math.random()*list.length)]; let best=null; for(let t=0;t<6;t++){ const i=Math.floor(Math.random()*GENS[g].n()); const k='gen:'+g+':'+i; if(used.has(k)) continue; const sc=seenN(k)+Math.random()*0.5; if(!best||sc<best[0]) best=[sc,i,k]; } if(!best) continue; used.add(best[2]); out.push(genQ(g,best[1],d)); } return out; }
function getQ(qid){ if(QBANK[qid]) return QBANK[qid]; if(String(qid).startsWith('gen:')){ const [,g,i]=qid.split(':'); if(GENS[g]) return genQ(g,+i); } return null; }
function genTotal(){ return Object.values(GENS).reduce((s,g)=>s+g.n(),0); }
