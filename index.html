function PA(src, ans, e){ return {t:'wr', q:'Transformă construcția <b>pasivă</b> în construcție <b>activă</b>:<div class="txt" style="margin-top:8px">'+src+'</div>', a:ans, e:e||'Complementul de agent devine subiect; subiectul devine complement direct; verbul trece la forma activă, la același mod și timp.'}; }
function TT(src, from, to, ans, e){ return {t:'wr', q:'Rescrie enunțul, trecând verbele de la <b>'+from+'</b> la <b>'+to+'</b>:<div class="txt" style="margin-top:8px">'+src+'</div>', a:ans, e}; }
function CR(src, ans, e){ return {t:'wr', strict:true, q:'Rescrie enunțul, <b>corectând greșelile de orice natură</b>:<div class="txt" style="margin-top:8px">'+src+'</div>', a:ans, e}; }
function CO(base, kind, model){ return {t:'wr', check:'coord', base, kind, q:'Completează cu o propoziție enunțul „'+base+'”, astfel încât fraza obținută să conțină un raport de <b>coordonare '+kind+'</b>. Scrie fraza întreagă.', a:[model], e:({'disjunctivă':'Coordonarea disjunctivă se face prin: sau, ori, fie.','adversativă':'Coordonarea adversativă se face prin: dar, însă, iar, ci.','copulativă':'Coordonarea copulativă se face prin: și, nici.','conclusivă':'Coordonarea conclusivă se face prin: deci, așadar, prin urmare.','prin juxtapunere':'Juxtapunerea = propozițiile sunt alăturate cu virgulă (sau punct și virgulă), fără conjuncție.'})[kind]}; }

 theory:`
<h3>1. Cum lucrezi aici</h3>
<p>Scrii răspunsul întreg, iar aplicația îl compară cu variantele corecte. Dacă greșești, vezi răspunsul corect și cuvintele care diferă.</p>
<div class="tip"><b>📱 Pe telefon:</b> activează tastatura cu diacritice (ă, â, î, ș, ț). La exercițiile de corectare, diacriticele sunt obligatorii.</div>
<h3>2. Activ → pasiv, în 3 pași</h3>
<div class="ex"><i>Elevii <b>au plantat</b> copacii.</i> → 1) CD „copacii” devine subiect; 2) „au plantat” (perfect compus) → „<b>au fost plantați</b>” (tot perfect compus, participiul acordat cu „copacii”); 3) „elevii” devine „<b>de elevi</b>”.<br>→ <i>Copacii au fost plantați de elevi.</i></div>
<table class="t"><tr><th>Timpul/modul</th><th>Activ</th><th>Pasiv</th></tr>
<tr><td>prezent</td><td>corectează</td><td>este corectată</td></tr><tr><td>imperfect</td><td>aplaudau</td><td>erau aplaudați</td></tr><tr><td>perfect compus</td><td>a câștigat</td><td>a fost câștigat</td></tr><tr><td>perfect simplu</td><td>dădu</td><td>fu dată</td></tr><tr><td>mai-mult-ca-perfect</td><td>pregătise</td><td>fusese pregătită</td></tr><tr><td>viitor</td><td>va repara</td><td>va fi reparat</td></tr><tr><td>condițional prezent</td><td>ar ajuta</td><td>ar fi ajutată</td></tr><tr><td>condițional perfect</td><td>ar fi citit</td><td>ar fi fost citit</td></tr></table>
<h3>3. Coordonarea</h3>
<p><b>copulativă</b>: și, nici · <b>adversativă</b>: dar, însă, iar, ci · <b>disjunctivă</b>: sau, ori, fie · <b>conclusivă</b>: deci, așadar, prin urmare · <b>juxtapunere</b>: doar virgulă, fără conjuncție.</p>

<h3>4. Modurile verbale – semne de recunoaștere</h3>

<tr><td><b>💬 Dialogat</b></td><td><b>schimb de replici</b> între două sau mai multe persoane; interlocutori; formule de inițiere/menținere/încheiere</td><td><b>linia de dialog (—)</b>, verbe de declarație (<i>zice, întreabă</i>), semne de întrebare/exclamare, vocative</td></tr>
<tr><td><b>⚖️ Argumentativ</b></td><td>susține un <b>punct de vedere</b> (ipoteză) prin <b>argumente</b>, cu o <b>concluzie</b>; vrea să convingă</td><td><i>cred că, în opinia mea, în primul rând, pe de o parte, de aceea, în concluzie</i></td></tr>
<tr><td><b>🔎 Explicativ</b></td><td>oferă <b>explicații, definiții, informații</b>; răspunde la „De ce? Cum?”</td><td>termeni de specialitate, cifre, date, prezentul, ton obiectiv</td></tr></table></div>
<h3>Exemple din textele tale</h3>
<div class="ex"><b>Narativ</b> – Creangă, <i>La cireșe</i>: copilul sare din cireș, fuge prin cânepă cu mătușa după el, mătușa cade, el sare gardul și fuge acasă. Narator la persoana I, verbe de mișcare: <i>„mă dau iute pe-o creangă”</i>.</div>
<div class="ex"><b>Dialogat</b> – Caragiale, <i>D-l Goe...</i>: <i>„— Mamițo, nu ți-am spus că nu se zice marinel?”</i></div>
<div class="ex"><b>Descriptiv</b> – Slavici, <i>Popa Tanda</i>: satul Sărăceni – <i>„Ici o casă, colo o casă…”</i>, case fără garduri, acoperișuri de paie.</div>
<h3>Răspunsul-model (6 p)</h3>
<div class="exam"><b>Barem oficial:</b> trăsătura – 2 p · secvența ilustrativă – 2 p · ortografie și punctuație (0–1 greșeli) – 1 p · minimum două enunțuri – 1 p.</div>
<div class="ex"><b>Șablon:</b> „O trăsătură a tiparului <i>[dialogat]</i> din textul 1 este <i>[prezența schimbului de replici dintre personaje, marcate prin linia de dialog]</i>. Această trăsătură se observă în secvența „<i>— Mamițo, nu ți-am spus că nu se zice marinel?</i>”, în care Goe îi răspunde bunicii.”</div>`,

<div class="tip"><b>🎯 Formula itemului 6:</b> 1 enunț cu trăsătura + 1 enunț cu citatul între ghilimele + o mică explicație. Gata, 6 p.</div>
<div class="trap"><b>⚠️</b> Nu numi doar tiparul – <b>explică trăsătura</b> („prezența naratorului la persoana I”, nu doar „e narativ”). Citatul trebuie să ilustreze <b>exact</b> trăsătura numită.</div>`,

{id:'l8', title:'Lectura: temă, idei, plan, rezumat, mesaj', icon:'🔍',
 exam:'Itemii 1–5 (înțelegere), item 7 (element comun), Subiectul al II-lea (poate fi REZUMAT – cerut la EN 2026!).',
 theory:`
<h3>1. Instrumentele cititorului</h3>
<ul><li><b>Cuvinte-cheie</b> – cuvintele care poartă sensul principal al unui fragment.</li>
<li><b>Tema</b> – subiectul general (copilăria, natura, prietenia, călătoria, familia, școala).</li>
<li><b>Ideea principală</b> – esențialul unui fragment; <b>ideile secundare</b> – detalii.</li>
<li><b>Planul simplu</b> – ideile principale, formulate scurt (titluri). <b>Planul dezvoltat</b> – idei principale + secundare, în propoziții complete.</li>
<li><b>Mesajul / semnificația</b> – „lecția” sau ideea pe care o transmite textul.</li>
<li><b>Inferențe</b> – deduceri din text: cauză–efect, problemă–soluție, predicții.</li></ul>
<h3>2. Rezumatul (100–150 cuvinte)</h3>
<div class="tip"><b>Reguli de aur ale rezumatului:</b><br>✅ persoana a III-a (chiar dacă textul e la persoana I)<br>✅ prezent sau perfect compus, păstrat la fel peste tot<br>✅ doar întâmplările <b>importante</b>, în <b>ordinea</b> din text<br>✅ conectori: <i>la început, apoi, după aceea, în cele din urmă</i><br>✅ 3 paragrafe (început – desfășurare – final)<br>❌ fără dialog, fără citate, fără figuri de stil, fără păreri personale, fără titlu</div>
<div class="ex"><b>Exemplu (La cireșe, fragmentul din fișa ta):</b> „Prins în cireșul mătușii Mărioara, Nică sare dintr-o creangă într-un lan de cânepă. Mătușa îl urmărește, iar cei doi aleargă prin cânepă până la gardul din fundul grădinii.<br>Neputând sări gardul, băiatul se întoarce mereu, așa că, în urma fugii, toată cânepa ajunge culcată la pământ. La un moment dat, mătușa se încurcă în cânepă și cade.<br>Profitând de ocazie, Nică sare gardul și fuge acasă, unde se poartă foarte cuminte în ziua aceea.” (≈ 90 cuvinte – ar mai trebui completat cu contextul dinainte pentru 100+.)</div>
<h3>3. Compararea a două texte (item 7)</h3>
<p>Caută un <b>element comun</b>: aceeași temă, același tip de personaj, aceeași atitudine, același spațiu, aceeași valoare. Ilustrează cu <b>câte o secvență din fiecare text</b>.</p>`,
 tricks:`
<div class="tip"><b>🎯 Truc de citire în 3 treceri:</b> 1) citește cerințele; 2) citește textele subliniind nume, cifre, locuri; 3) recitește doar paragraful care răspunde la fiecare cerință.</div>
<div class="tip"><b>🧠 Rezumat = „povestea pe scurt, spusă de altcineva”</b>. Dacă textul zice „eu am fugit”, tu scrii „<b>băiatul</b> fuge / a fugit”.</div>
<div class="trap"><b>⚠️</b> La rezumat, redactarea (8 p) se acordă doar dacă ai <b>minimum 100 de cuvinte</b>. Numără!</div>`,

 {t:'mc',q:'Varianta potrivită pentru rezumatul frazei „Atunci eu mă dau iute pe-o creangă și fac zup! în cânepă.”:',o:['Atunci eu mă dau iute pe-o creangă.','Băiatul sare dintr-o creangă într-un lan de cânepă.','„Fac zup!” în cânepă.','Eu sar repede din cireș.'],a:1,e:'Persoana a III-a, fără citate și fără onomatopee.'}

{id:'l3', title:'Genul epic: narator, personaje, acțiune, specii', icon:'🗺️',
 exam:'Compunerea despre semnificație cere „două elemente specifice textului narativ” (narator, personaje, timp, spațiu, acțiune, momentele subiectului).',
 theory:`
<h3>1. Instanțele comunicării narative</h3>
<ul><li><b>Autorul</b> – persoana reală care a scris textul (Ion Creangă).</li>
<li><b>Naratorul</b> – „vocea” care povestește în text. Poate fi:<br>• <b>la persoana I</b> – narator-personaj (participă la întâmplări), subiectiv: <i>„eu mă dau iute pe-o creangă”</i>;<br>• <b>la persoana a III-a</b> – narator obiectiv, omniscient (știe tot), nu participă: <i>„Părintele Trandafir intră în biserică.”</i></li>
<li><b>Personajele</b> – participanții la acțiune: principale, secundare, episodice.</li>
<li><b>Cititorul</b> – cel căruia i se adresează textul.</li></ul>
<h3>2. Timpul, spațiul, acțiunea</h3>
<p><b>Timpul</b> – când se petrec întâmplările (<i>„foarte de dimineață”, de 10 Mai</i>). <b>Spațiul</b> – unde (<i>peronul, trenul, grădina mătușii</i>). <b>Acțiunea</b> – totalitatea întâmplărilor.</p>
<h3>3. Momentele subiectului</h3>
<table class="t"><tr><th>Moment</th><th>Ce se întâmplă</th><th>Exemplu (D-l Goe...)</th></tr>
<tr><td>Expozițiunea</td><td>se prezintă timpul, locul, personajele</td><td>Goe și cele trei dame așteaptă trenul pe peron.</td></tr>
<tr><td>Intriga</td><td>întâmplarea care declanșează acțiunea</td><td>Goe nu vrea să intre în cupeu, scoate capul pe fereastră.</td></tr>
<tr><td>Desfășurarea acțiunii</td><td>întâmplările propriu-zise</td><td>Îi zboară pălăria cu biletul, conductorul cere biletul.</td></tr>
<tr><td>Punctul culminant</td><td>momentul de maximă tensiune</td><td>Goe trage semnalul de alarmă, iar trenul se oprește.</td></tr>
<tr><td>Deznodământul</td><td>finalul, rezolvarea</td><td>Familia ajunge, în cele din urmă, la București.</td></tr></table>
<h3>4. Moduri de expunere</h3>
<p><b>Narațiunea</b> (povestirea faptelor), <b>descrierea</b>, <b>dialogul</b>, <b>monologul</b>.</p>
<h3>5. Specii ale genului epic</h3>
<table class="t"><tr><th>Specie</th><th>Trăsături</th><th>Exemplu</th></tr>
<tr><td>Basm</td><td>fabulos, lupta binelui cu răul, formule (inițială, mediană, finală), cifre magice</td><td><i>Prâslea cel voinic și merele de aur</i></td></tr>
<tr><td>Legendă</td><td>explică originea unui lucru, fenomen, nume</td><td><i>Legenda ciocârliei</i></td></tr>
<tr><td>Fabulă</td><td>personaje animale cu trăsături omenești, morală</td><td><i>Uleul și găinile</i> (Gr. Alexandrescu)</td></tr>
<tr><td>Schiță</td><td>scurtă, puține personaje, un singur episod, comic</td><td><i>D-l Goe...</i>, <i>Vizită...</i> (Caragiale)</td></tr>
<tr><td>Povestire</td><td>întâmplare povestită de un narator-martor, atmosferă de ascultare</td><td><i>Iapa lui Vodă</i> (M. Sadoveanu)</td></tr>
<tr><td>Nuvelă</td><td>mai amplă decât schița, un fir narativ, personaj complex</td><td><i>Popa Tanda</i> (Slavici)</td></tr>
<tr><td>Roman</td><td>amplu, multe planuri, multe personaje</td><td><i>Toate pânzele sus!</i>, <i>Cireșarii</i></td></tr></table>`,
 tricks:`
<div class="tip"><b>🧠 Narator ≠ autor!</b> Creangă e autorul; Nică (copilul care povestește) e naratorul-personaj.</div>
<div class="tip"><b>🎯 Truc persoana naratorului:</b> caută verbele care nu sunt în dialog. „mă dau”, „fac” → persoana I. „intră”, „zice” → persoana a III-a.</div>
<div class="trap"><b>⚠️</b> Momentele subiectului se referă la <b>întreaga operă</b>; un fragment de la examen poate conține doar unul-două.</div>`,

{id:'l4', title:'Personajul și caracterizarea', icon:'🦸',
 exam:'Subiectul al II-lea poate fi „caracterizarea unui personaj” (modelul 2025 – Yolanda). Cerințele: 2 date de identificare, 2 trăsături morale cu secvențe comentate, 2 mijloace de caracterizare, corelarea unei valori personale cu una a personajului.',
 theory:`
<h3>1. Tipuri de personaje</h3>
<p>După importanță: <b>principal</b>, <b>secundar</b>, <b>episodic</b>. După atitudinea autorului: pozitiv / negativ. Personajul poate fi <b>complex</b> (are trăsături contradictorii) sau <b>plat</b>.</p>
<h3>2. Mijloace de caracterizare</h3>
<table class="t"><tr><th>Caracterizare DIRECTĂ</th><th>Caracterizare INDIRECTĂ (deduci tu)</th></tr>
<tr><td>• de către <b>narator</b>: <i>„D. Goe este foarte impacient”</i><br>• de către <b>alte personaje</b>: <i>„Ce e vinovat băiatul...”</i> (mam’ mare)<br>• prin <b>autocaracterizare</b> (personajul despre sine)</td><td>• din <b>fapte</b>, acțiuni: Goe scoate capul pe fereastră deși i s-a spus să nu o facă<br>• din <b>limbaj</b>: <i>„Vezi că sunteți proaste amândouă?”</i> → obrăznicie<br>• din <b>gesturi, mimică</b>: bate din picioare, zbiară<br>• din <b>nume</b>: „Goe” – diminutiv alintat<br>• din <b>relațiile cu ceilalți</b><br>• din <b>mediul</b> în care trăiește</td></tr></table>
<h3>3. Planul compunerii de caracterizare (Subiectul al II-lea)</h3>
<ol><li><b>Introducere</b> – cine e personajul, din ce text, 2 <b>date de identificare</b> (vârstă, statut, familie, origine, ocupație).</li>
<li><b>Trăsătura morală 1</b> + secvență comentată + mijlocul de caracterizare (direct/indirect).</li>
<li><b>Trăsătura morală 2</b> + secvență comentată + alt mijloc de caracterizare.</li>
<li><b>Corelarea</b> unei valori personale cu una dintre valorile personajului.</li>
<li><b>Concluzie</b> – ce reprezintă personajul.</li></ol>
<div class="ex"><b>Exemplu de paragraf:</b> „O trăsătură definitorie a lui Goe este obrăznicia, care reiese în mod indirect, din limbajul său. Când bunica și mama nu se înțeleg asupra cuvântului «marinel», băiatul le jignește: «Vezi că sunteți proaste amândouă?». Replica arată lipsa de respect față de adulții care îl răsfață.”</div>
<h3>4. Personajul dramatic (din fișa ta)</h3>
<p>Se caracterizează gradat, de-a lungul actelor și scenelor, <b>direct</b> (indicații scenice, alte personaje) și <b>indirect</b> (limbaj, gesturi, mimică, mișcare scenică, relații). Indicațiile scenice (didascaliile) arată vestimentația, gestica, mișcarea scenică, elementele paraverbale (râs, plâns, oftat, tuse, zâmbet).</p>`,
 tricks:`
<div class="tip"><b>🎯 Formula T-S-C:</b> pentru fiecare trăsătură scrie <b>T</b>răsătura → <b>S</b>ecvența (citat scurt, între ghilimele) → <b>C</b>omentariul („Secvența arată/sugerează că...”).</div>
<div class="tip"><b>🧠 Corelarea valorii personale</b> (punct sigur!): „Asemenea lui X, și eu prețuiesc <i>prietenia</i>, deoarece...” sau „Spre deosebire de X, eu...”.</div>
<div class="trap"><b>⚠️</b> Trăsăturile morale (curajos, generos) ≠ trăsături fizice (înalt, blond). Cerința cere de obicei <b>morale</b>!</div>`,

 {t:'mc',q:'Goe scoate capul pe fereastră deși i s-a spus să nu o facă. Trăsătura reiese:',o:['direct','indirect, din fapte','prin autocaracterizare','direct, de alt personaj'],a:1,e:'Deducem neascultarea din faptele lui → caracterizare indirectă.'},
 {t:'mc',q:'Autocaracterizarea înseamnă că:',o:['naratorul descrie personajul','personajul vorbește despre sine','alt personaj îl descrie','cititorul deduce'],a:1,e:'Personajul își prezintă singur trăsăturile.'},

{id:'l5', title:'Genul liric și versificația', icon:'🎵',
 exam:'Textul liric poate fi text-suport; cerințe frecvente: figuri de stil, sentimente, versificație.',
 theory:`
<h3>1. Ce este textul liric?</h3>
<p>Textul în care autorul își exprimă <b>direct</b> gândurile, sentimentele, emoțiile, prin vocea <b>eului liric</b>. Nu povestește o acțiune; transmite stări. Mărci ale eului liric: verbe și pronume la persoana I (<i>eu, mă, aștept</i>).</p>
<p><b>Imaginile artistice</b>: vizuale (culori, forme), auditive (sunete), olfactive (mirosuri), tactile, motorii (mișcare).</p>
<h3>2. Versificația</h3>
<ul><li><b>Versul</b> – un rând dintr-o poezie. <b>Strofa</b> – grup de versuri: distih (2), terțină (3), <b>catren (4)</b>.</li>
<li><b>Măsura</b> – numărul de silabe dintr-un vers (numărate cum se pronunță).</li>
<li><b>Rima</b> – potrivirea sunetelor de la finalul versurilor:<br>• <b>împerecheată</b> (aabb) · <b>încrucișată</b> (abab) · <b>îmbrățișată</b> (abba) · <b>monorimă</b> (aaaa).</li>
<li><b>Ritmul</b> – alternanța silabelor accentuate și neaccentuate (îl simți intuitiv).</li></ul>
<div class="ex"><b>Mihai Eminescu, <i>Lacul</i></b> (prima strofă):<br><i>Lacul codrilor albastru<br>Nuferi galbeni îl încarcă;<br>Tresărind în cercuri albe<br>El cutremură o barcă.</i><br>→ catren; rimează versurile 2 și 4 (<i>încarcă – barcă</i>); măsura 8 silabe; imagini vizuale (albastru, galbeni, albe); epitete cromatice.</div>
<div class="ex"><b>Vasile Alecsandri, <i>Iarna</i></b>:<br><i>Din văzduh cumplită iarnă cerne norii de zăpadă,<br>Lungi troiene călătoare adunate-n cer grămadă;</i><br>→ rimă împerecheată (<i>zăpadă – grămadă</i>); <b>pastel</b> (poezie lirică ce descrie un tablou din natură); epitete: <i>cumplită iarnă, lungi troiene</i>.</div>
<h3>3. Specii lirice de știut</h3>
<p><b>Pastelul</b> – descrie natura și transmite sentimentele poetului (<i>Iarna</i> – Alecsandri). <b>Doina</b> – specie populară cu sentimente de dor, jale. <b>Poezia lirică de dragoste / de natură</b> (<i>Lacul</i>).</p>`,
 tricks:`
<div class="tip"><b>🎯 Rimă rapid:</b> notează cu litere finalurile versurilor: <i>-adă, -adă</i> = aa → împerecheată.</div>
<div class="tip"><b>🧠 Eu liric ≠ poet</b> (la fel ca narator ≠ autor). Spune „eul liric transmite...”.</div>
<div class="trap"><b>⚠️ Măsura:</b> numără silabele cum le <b>pronunți</b>: „adunate-n” = a-du-na-te-n (4 silabe, „-n” se lipește).</div>`,
 q:[
 {t:'mc',q:'Strofa de patru versuri se numește:',o:['distih','terțină','catren','sonet'],a:2,e:'Catren = 4 versuri.'},
 {t:'mc',q:'Rima de tip aabb se numește:',o:['încrucișată','împerecheată','îmbrățișată','monorimă'],a:1,e:'Versurile 1-2 și 3-4 rimează → împerecheată.'},
 {t:'mc',q:'Rima abab se numește:',o:['încrucișată','împerecheată','îmbrățișată','albă'],a:0,e:'Versurile 1-3 și 2-4 → încrucișată.'},
 {t:'mc',q:'Rima abba se numește:',o:['îmbrățișată','încrucișată','împerecheată','monorimă'],a:0,e:'1-4 și 2-3 → îmbrățișată.'},
 {t:'mc',q:'Instanța care își exprimă sentimentele într-o poezie este:',o:['naratorul','eul liric','personajul','autorul real'],a:1,e:'Eul liric.'},
 {t:'mc',q:'Pastelul este o poezie lirică în care:',o:['se povestește o luptă','se descrie un tablou din natură','apar replici','se dă o morală'],a:1,e:'Pastelul descrie natura.'},
 {t:'mc',q:'Măsura versului înseamnă:',o:['numărul de strofe','numărul de silabe dintr-un vers','numărul de cuvinte','tipul rimei'],a:1,e:'Măsura = numărul de silabe.'},
 {t:'mc',q:'În versul „Lacul codrilor albastru”, imaginea artistică este:',o:['auditivă','vizuală','olfactivă','tactilă'],a:1,e:'Culoarea (albastru) → imagine vizuală.'},
 {t:'tf',q:'Textul liric povestește o acțiune cu momentele subiectului.',a:false,e:'Fals: asta e trăsătura textului epic.'}

{id:'l6', title:'Figurile de stil (cele 9 din programă)', icon:'✨',
 exam:'Ex. model 2025: „Transcrie două figuri de stil diferite și precizează-le” (6 p). Apar și în comentarii, compunere, caracterizare.',
 theory:`
<div class="tw"><table class="t"><tr><th>Figura</th><th>Definiție</th><th>Exemplu</th><th>Truc</th></tr>
<tr><td><b>Epitetul</b></td><td>însușire expresivă a unui obiect/ființe (de obicei adjectiv)</td><td><i>cumplită iarnă, nuferi galbeni</i></td><td>întrebarea „ce fel de?”</td></tr>
<tr><td><b>Personificarea</b></td><td>atribuie însușiri omenești lucrurilor, animalelor, fenomenelor</td><td><i>Răpița se supără</i> (Slavici); <i>vântul cântă</i></td><td>un „ne-om” face ce face un om</td></tr>
<tr><td><b>Comparația</b></td><td>alătură doi termeni pe baza unei asemănări</td><td><i>o iarbă ca mătasea</i>; <i>fuga iepurește</i></td><td>caută: <b>ca, precum, cum, asemenea, cât</b></td></tr>
<tr><td><b>Enumerația</b></td><td>înșiruire de termeni de același fel</td><td><i>o soție bolnavă, trei copii mici, o casă numai hârb</i></td><td>virgule multe, aceeași funcție</td></tr>
<tr><td><b>Repetiția</b></td><td>reluarea unui cuvânt/grup pentru a-l accentua</td><td><i>Și eu fuga, și ea fuga, și eu fuga, și ea fuga</i> (Creangă); <i>am urcat, am tot urcat</i></td><td>același cuvânt de mai multe ori</td></tr>
<tr><td><b>Metafora</b></td><td>comparație „scurtată”: un termen e înlocuit cu altul, pe baza asemănării, fără „ca”</td><td><i>ochii ei, două stele</i>; <i>un mărgăritar de rouă</i></td><td>sens figurat, fără „ca”</td></tr>
<tr><td><b>Hiperbola</b></td><td>exagerare (mărire sau micșorare)</td><td><i>Ți-am spus de o mie de ori!</i>; <i>plângea cu lacrimi cât pumnul</i></td><td>imposibil în realitate</td></tr>
<tr><td><b>Antiteza</b></td><td>opune doi termeni / idei</td><td><i>oamenii cunoșteau binele, râdeau de rău</i> (Slavici)</td><td>antonime puse față în față</td></tr>
<tr><td><b>Aliterația</b></td><td>repetarea aceleiași consoane pentru efect sonor</td><td><i>Vâjâind ca vijelia și ca plesnetul de ploaie</i> (Eminescu)</td><td>sunete care se repetă (v, j)</td></tr></table></div>
<h3>Cum scrii răspunsul</h3>
<div class="ex"><b>Șablon (2 p pentru fiecare figură):</b> „<i>«o iarbă ca mătasea»</i> – <b>comparație</b>; <i>«am urcat, am tot urcat»</i> – <b>repetiție</b>.”<br>Pentru comentariu adaugi rolul: „Comparația sugerează moliciunea și frumusețea ierbii.”</div>`,
 tricks:`
<div class="tip"><b>🧠 Mnemonic „PEC-MAREHA”:</b> <b>P</b>ersonificare, <b>E</b>pitet, <b>C</b>omparație – <b>M</b>etaforă, <b>A</b>literație, <b>R</b>epetiție, <b>E</b>numerație, <b>H</b>iperbolă, <b>A</b>ntiteză.</div>
<div class="tip"><b>🎯 Comparație vs. metaforă:</b> dacă vezi „<b>ca</b>” → comparație. Dacă e aceeași idee fără „ca” → metaforă.</div>
<div class="trap"><b>⚠️</b> Transcrie <b>exact</b> secvența, între ghilimele, și scrie figuri <b>diferite</b> dacă cerința zice „diferite”.</div>`,

 {t:'mc',q:'„Vâjâind ca vijelia și ca plesnetul de ploaie” – repetarea sunetului „v” este:',o:['aliterație','enumerație','hiperbolă','personificare'],a:0,e:'Aliterație (efect sonor).'},

 {t:'mc',q:'Cuvântul-semn al comparației este:',o:['„ca”','„și”','„dar”','„nu”'],a:0,e:'ca, precum, cum, asemenea.'}

{id:'l7', title:'Genul dramatic', icon:'🎬',
 exam:'Text dramatic ca suport: cerințe despre indicații scenice, dialog, personaj dramatic, conflict.',
 theory:`
<h3>1. Ce este textul dramatic?</h3>
<p>Textul scris pentru a fi <b>jucat pe scenă</b>. Nu are narator: acțiunea „merge” prin <b>dialogul</b> și <b>monologul</b> personajelor.</p>
<ul><li><b>Autorul</b> = dramaturgul (ex.: I.L. Caragiale, Matei Vișniec).</li>
<li><b>Lista personajelor</b> la început.</li>
<li><b>Structura</b>: <b>acte</b> → <b>scene</b> (o scenă se schimbă când intră/iese un personaj); uneori <b>tablouri</b>.</li>
<li><b>Indicațiile scenice (didascaliile)</b> – scrise de obicei între paranteze, cu italic: arată decorul, gesturile, mimica, tonul, mișcarea scenică, vestimentația. Sunt singurul loc în care autorul „vorbește” direct.</li>
<li><b>Conflictul</b> – opoziția dintre personaje (exterior) sau în sufletul unui personaj (interior).</li></ul>
<h3>2. De la text la spectacol</h3>
<p>Actori, <b>regizor</b> (coordonează spectacolul), <b>scenograf</b> (decor), costume, lumini, muzică, sunet, sufleur, public.</p>
<h3>3. Specii</h3>
<p><b>Comedia</b> – stârnește râsul, critică defecte omenești, final fericit (<i>O scrisoare pierdută</i> – Caragiale). <b>Drama</b>, <b>tragedia</b> – conflicte grave.</p>
<h3>4. Compunerea – caracterizarea personajului dramatic (din fișa ta)</h3>
<ol><li>Personajul participă la acțiunea textului... și este surprins în momentul în care... (rezumă în 2–3 enunțuri).</li>
<li><b>Trăsătura dominantă</b> + secvența din care reiese (+ alte 2–3 trăsături, în ordinea din text).</li>
<li><b>Conflictul</b> (exterior/interior) – între cine și cine, când se declanșează.</li>
<li><b>Dialogul</b> – tipar principal, mijloc de caracterizare indirectă.</li>
<li><b>Indicațiile scenice</b> – vestimentație, gestică, mișcare scenică, elemente paraverbale (râs, plâns, oftat) – cu citate.</li>
<li><b>Relația</b> cu alte personaje.</li>
<li><b>Corelarea</b> unei valori personale cu una a personajului.</li>
<li><b>Concluzia</b> – personajul ca tip uman.</li></ol>`,
 tricks:`
<div class="tip"><b>🎯 Didascalia = „vocea regizorului”.</b> Tot ce e în paranteză și nu e rostit de personaj.</div>
<div class="tip"><b>🧠</b> „Epic = povestit, Liric = simțit, Dramatic = jucat.”</div>`,

{id:'l10', title:'Itemii 6–9: răspunsurile scrise din Subiectul I', icon:'🎯',
 exam:'Itemii 6, 7, 8, 9 = 24 p (aproape un sfert din notă!). Se punctează și ortografia, și numărul de cuvinte.',
 theory:`
<h3>Item 6 – Tiparul textual (6 p)</h3>
<p>Vezi lecția „Tipare textuale”. Formula: <b>trăsătură + citat + scurtă explicație</b>, minimum 2 enunțuri.</p>
<h3>Item 7 – Element comun celor două texte (6 p, minimum 30 de cuvinte)</h3>
<div class="exam"><b>Barem:</b> elementul comun – 2 p · câte o secvență relevantă din fiecare text – 1 p + 1 p · exprimare, ortografie, punctuație – 1 p · minimum 30 de cuvinte – 1 p. (Ultimele se acordă doar dacă faci comparația!)</div>
<div class="ex"><b>Șablon:</b> „Un element de conținut comun celor două texte este <i>[tema călătoriei cu trenul]</i>. În textul 1, <i>[Goe și familia sa călătoresc spre București]</i>, așa cum reiese din secvența „...”. În textul 2, <i>[conductorul vorbește despre călătorii]</i>: „...”. Așadar, ambele texte <i>[prezintă]</i>...”</div>
<p>Elemente comune posibile: <b>tema</b>, un <b>personaj</b> (copil, animal), o <b>atitudine</b> (grija, curiozitatea), un <b>spațiu</b> (grădina, trenul), un <b>obiect</b>, o <b>valoare</b>.</p>
<h3>Item 8 – Opinia argumentată (6 p, 50–100 de cuvinte)</h3>
<div class="exam"><b>Barem:</b> răspunsul (da/nu) – 1 p · motivarea – 1 p · valorificarea textului (cu secvență) – 2 p · norme de exprimare – 1 p · încadrarea în 50–100 de cuvinte – 1 p.</div>
<div class="ex"><b>Șablon:</b> „Consider că <i>[da/nu]</i>, ... (răspuns). În primul rând, ... (argument). Acest lucru reiese și din textul 2, unde ... „citat” ... (valorificarea textului). Prin urmare, ... (concluzie).”</div>
<h3>Item 9 – Asocierea cu alt text literar (6 p, 50–100 de cuvinte)</h3>
<div class="exam"><b>Barem:</b> numirea unei valori comune – 1 p · titlul și autorul textului asociat – 1 p · prezentarea valorii prin câte o secvență din fiecare text – 2 p · norme – 1 p · 50–100 de cuvinte – 1 p.</div>
<div class="ex"><b>Șablon:</b> „Fragmentul din <i>«...»</i> de ... poate fi asociat cu <i>«...»</i> de ..., deoarece ambele texte evidențiază <b>valoarea [prieteniei]</b>. În primul text, ... În cel de-al doilea, ... Astfel, ambele opere arată că...”</div>
<h3>🗂️ Banca ta de texte pentru itemul 9</h3>
<p class="dim small">Învață bine 3–4 texte, cu câte o scenă de citat. Valorile: prietenie, curaj, familie, generozitate, hărnicie, perseverență, respect, empatie, responsabilitate, onestitate.</p>
<div class="tw"><table class="t"><tr><th>Text</th><th>Valori</th><th>Scena de folosit</th></tr>
<tr><td><i>Amintiri din copilărie</i> – Ion Creangă</td><td>copilăria, familia, onestitatea</td><td>Nică se urcă în cireșul mătușii Mărioara, e descoperit, fuge prin cânepă și, ajuns acasă, se poartă foarte cuminte de teama urmărilor.</td></tr>
<tr><td><i>D-l Goe...</i> – I.L. Caragiale</td><td>educația, respectul (prin contrast)</td><td>Goe scoate capul pe fereastră, își pierde pălăria cu biletul și își jignește familia.</td></tr>
<tr><td><i>Popa Tanda</i> – Ioan Slavici</td><td>hărnicia, perseverența, exemplul personal</td><td>Părintele Trandafir nu reușește prin sfaturi, dar își face casă și grădină, iar sătenii încep să-l imite.</td></tr>
<tr><td><i>Toate pânzele sus!</i> – Radu Tudoran</td><td>prietenia, curajul, perseverența</td><td>Anton Lupan și echipajul pornesc cu goeleta „Speranța” spre Țara de Foc, înfruntând furtuni și pericole.</td></tr>
<tr><td><i>Cireșarii</i> – Constantin Chiriță</td><td>prietenia, curiozitatea, curajul</td><td>Grupul de adolescenți pornește să descopere tainele unei peșteri, sprijinindu-se unii pe alții în momentele grele.</td></tr>
<tr><td><i>Micul Prinț</i> – Antoine de Saint-Exupéry</td><td>prietenia, responsabilitatea</td><td>Vulpea îl învață pe Micul Prinț că devii responsabil pentru cel pe care l-ai îmblânzit.</td></tr>
<tr><td><i>Lacul</i> – Mihai Eminescu</td><td>iubirea, natura</td><td>Eul liric își așteaptă iubita pe malul lacului cu nuferi.</td></tr></table></div>`,
 tricks:`

{id:'l9', title:'Subiectul al II-lea: compunerea (20 p)', icon:'🏆',
 exam:'20 p = 12 p conținut + 8 p redactare. Minimum 150 de cuvinte (rezumat: 100–150). Fără titlu, fără motto.',
 theory:`
<h3>1. Ce poate cădea (după modelele 2025–2027)</h3>
<ul><li><b>Semnificația / mesajul textului</b> (modelul 2026–2027)</li><li><b>Caracterizarea unui personaj</b> (modelul 2025)</li><li><b>Rezumatul</b> (EN iunie 2026)</li><li>Programa mai permite: narațiune, descriere, text argumentativ, comentariu de text, scrisoare, e-mail, jurnal.</li></ul>
<h3>2. Compunerea despre semnificație (model oficial 2026–2027)</h3>
<div class="exam"><b>Cerințe + barem conținut (12 p):</b><br>• mesajul/semnificația textului – 1 p · tema – 1 p<br>• două elemente specifice textului narativ care construiesc semnificația – 2 p + 2 p<br>• interpretarea a două secvențe relevante – 2 p + 2 p<br>• o emoție/sentiment al unui personaj, justificat – 1 p + 1 p</div>
<div class="ex"><b>Plan în 5 paragrafe:</b><br>1️⃣ <b>Introducere</b>: textul + autorul + tema + mesajul („Fragmentul din «...» de ... are ca temă ..., iar mesajul este că ...”).<br>2️⃣ <b>Element narativ 1</b> (ex.: naratorul la persoana I) – cum construiește mesajul.<br>3️⃣ <b>Element narativ 2</b> (ex.: personajele / timpul și spațiul / acțiunea) + <b>secvența 1 interpretată</b>.<br>4️⃣ <b>Secvența 2 interpretată</b> + <b>emoția personajului</b> justificată.<br>5️⃣ <b>Concluzie</b>: reluarea mesajului.</div>
<h3>3. Caracterizarea (vezi lecția Personajul)</h3>
<p>2 date de identificare · 2 trăsături morale + secvențe comentate · 2 mijloace de caracterizare diferite · corelarea unei valori personale.</p>
<h3>4. Rezumatul (vezi lecția Lectura)</h3>
<p>100–150 de cuvinte, persoana a III-a, fără dialog/citate, întâmplările în ordine.</p>
<h3>5. Textul argumentativ</h3>
<p><b>Ipoteză</b> (Consider că...) → <b>2 argumente</b> (În primul rând... În al doilea rând...) cu exemple → <b>concluzie</b> (În concluzie...).</p>
<h3>6. Redactarea (8 p – câte 1 p)</h3>
<table class="t"><tr><th>Criteriu</th><th>Cum îl iei</th></tr>
<tr><td>Marcarea corectă a paragrafelor</td><td>alineat (retragere) la fiecare paragraf nou</td></tr>
<tr><td>Coerența textului</td><td>ideile se leagă logic, conectori</td></tr>
<tr><td>Proprietatea termenilor</td><td>0–2 greșeli; folosește termenii potriviți (narator, secvență, personaj)</td></tr>
<tr><td>Corectitudinea gramaticală</td><td>0–1 greșeli (acorduri!)</td></tr>
<tr><td>Claritatea exprimării</td><td>fraze clare, nu foarte lungi</td></tr>
<tr><td>Ortografia</td><td>0–1 greșeli</td></tr>
<tr><td>Punctuația</td><td>0–2 greșeli</td></tr>
<tr><td>Lizibilitatea</td><td>scris citeț</td></tr></table>
<div class="trap"><b>⚠️ Regula de aur:</b> punctajul pentru redactare se acordă <b>doar</b> dacă ai minimum 150 de cuvinte (100 la rezumat) și tratezi subiectul. Sub limită pierzi 8 p dintr-odată!</div>
<h3>7. Conectori utili</h3>
<p><i>În primul rând, în al doilea rând, de asemenea, mai mult decât atât, pe de o parte… pe de altă parte, de exemplu, așa cum reiese din secvența…, prin urmare, așadar, în concluzie.</i></p>`,

{id:'l12', title:'Textele și noțiunile din clasa a VIII-a', icon:'🎒',
 exam:'Textele studiate în clasa a VIII-a sunt cele mai „proaspete” pentru itemul 9 (asociere) și pot fi model pentru compunere. Noțiunile noi (povestire în ramă, roman, conflict, versificație) pot apărea în cerințe.',
 theory:`
<h3>1. Textul liric – „O, rămâi...” de Mihai Eminescu</h3>
<p>Poezia are două voci: <b>pădurea</b>, care îl roagă pe copil să rămână la ea (monologul din primele strofe), și <b>adultul</b> de azi, care își amintește că a ieșit râzând din pădure și că acum nu mai poate înțelege chemarea ei.</p>
<div class="ex"><i>„Unde ești, copilărie,<br>Cu pădurea ta cu tot?”</i> → interogație retorică: nostalgia după copilărie și după armonia cu natura. Teme: <b>natura, copilăria, trecerea timpului</b>.</div>
<ul><li><b>Vocea lirică</b> nu e autorul real, ci o construcție ficțională (copilul, îndrăgostitul, admiratorul naturii...). Mărci ale subiectivității: persoana I (<i>mă, eu</i>), interjecții (<i>O</i>), exclamații, interogații retorice, verbe și substantive care exprimă trăiri.</li>
<li><b>Măsura</b> poate fi scurtă (5–8 silabe), medie (9–11) sau lungă (12–18). Pe lângă rimele știute există <b>semirima</b> (a b c b) și <b>rima imperfectă</b> (se potrivesc doar vocalele: <i>creștet – veșted</i>).</li></ul>
<p class="small mut">Alte texte lirice din manual: <i>Izvorul nopții</i> de Lucian Blaga (frumusețea umană), <i>Lecția de citire</i> de Nichita Stănescu (frumusețea artei), <i>O pasăre înaltă</i> de Dan Coman.</p>
<h3>2. Textul dramatic – „Take, Ianke și Cadâr” de Victor Ion Popa</h3>
<p><b>Comedie în trei acte</b> (premiera: 1932). Take (român) și Ianke (evreu) sunt negustori vecini, cu case și prăvălii aproape identice; se ciondănesc toată ziua, dar sunt prieteni buni. Vecinul lor, bătrânul Cadâr (turc), vinde dulciuri și trăiește singur. Copiii celor doi, <b>Ionel și Ana</b>, se iubesc și vor să se căsătorească, însă tații se opun, de teama „gurii lumii”. Cadâr îi sprijină pe tineri: el însuși a renunțat, din frică, la iubirea vieții lui și a rămas singur. Comedia se încheie cu împăcarea.</p>
<div class="ex"><b>Valori:</b> toleranța, prietenia peste diferențele de etnie și religie, iubirea, familia. <b>Mijloace:</b> indicațiile scenice (casele colorate „în oglindă” arată asemănarea dintre cei doi), comicul de limbaj (replicile morocănoase ale lui Take și Ianke), limbajul stâlcit și duios al lui Cadâr.</div>
<ul><li><b>Actul</b> (cifre romane) – subdiviziune mare, separată de pauză/lăsarea cortinei; <b>scena</b> (cifre arabe) – se schimbă la intrarea sau ieșirea unui personaj.</li>
<li><b>Timpul</b> în teatru: durata reprezentației + momentul ficțiunii. <b>Spațiul</b>: spațiul-scenă + spațiul ficțiunii.</li>
<li><b>Conflictul dramatic</b> = înfruntarea dintre personaje, idei, situații, din interese sau sentimente opuse.</li>
<li><b>Personajul dramatic</b> are dublă natură: ființă ficțională + actorul care îl joacă.</li></ul>
<h3>3. Textul epic – „Iapa lui Vodă” de Mihail Sadoveanu</h3>
<p>Prima povestire din volumul <i>Hanu-Ancuței</i> (1928). Într-o toamnă aurie, la han, comisul Ioniță, un răzăș bătrân, povestește o întâmplare din tinerețe: plecase la Iași să ceară dreptate pentru o judecată veche despre pământul familiei. La han îi spusese unui boier necunoscut că, dacă nici Vodă nu-i face dreptate, Măria Sa poate să-i „pupe iapa”. La Curte descoperă că boierul era chiar Vodă Mihai Sturza. Ioniță nu-și ia vorba înapoi, iar domnitorul, amuzat de curajul lui, îi face dreptate.</p>
<div class="ex"><b>Povestirea în ramă (inserția)</b> = o poveste inclusă în alta: naratorul din povestirea-cadru devine ascultător, iar un personaj (comisul Ioniță) devine narator. Planurile narative se leagă prin <b>înlănțuire, alternanță, inserție</b>. <b>Valori:</b> curajul, cuvântul dat, dreptatea, onestitatea.</div>
<p><b>Antiteza</b> se poate construi și la nivelul întregii opere: personaje sau planuri narative opuse (calul slab ↔ mândria stăpânului).</p>
<h3>4. Romanul – „Fahrenheit 451” de Ray Bradbury</h3>
<p>Roman <b>distopic</b>: într-o societate a viitorului, cărțile sunt interzise, iar pompierii nu sting incendii, ci ard cărți. Pompierul Guy Montag începe să se îndoiască după întâlnirea cu tânăra Clarisse, ascunde cărți și, în cele din urmă, fuge și se alătură unor oameni care păstrează cărțile învățându-le pe de rost.</p>
<ul><li><b>Romanul</b> – cel mai amplu text epic, multe personaje, mai multe fire narative; poate fi social, istoric, de aventuri, polițist, de dragoste, SF.</li>
<li><b>Distopia</b> – opusul utopiei (societatea ideală): o societate a viitorului dezumanizată de control politic, tehnologic sau religios.</li>
<li><b>Tipuri de conflict</b>: omul cu alt om, cu societatea, cu natura, cu tehnologia, cu sine însuși, cu soarta.</li></ul>
<h3>5. Alte texte din manual, bune pentru itemul 9</h3>
<table class="t"><tr><th>Text</th><th>Pe scurt</th><th>Valori</th></tr>
<tr><td><i>Hainele cele noi ale împăratului</i> – H.C. Andersen</td><td>Doi impostori „țes” o stofă pe care, spun ei, proștii n-o pot vedea; nimeni nu recunoaște că nu vede nimic, până când un copil strigă că împăratul e gol.</td><td>adevărul, curajul de a-l spune</td></tr>
<tr><td><i>Pescărușul Jonathan Livingston</i> – Richard Bach</td><td>Un pescăruș vrea să zboare perfect, nu doar ca să-și facă rost de hrană; e alungat din stol, învață și apoi se întoarce să-i învețe pe alții.</td><td>perseverența, libertatea, depășirea limitelor</td></tr>
<tr><td><i>Nathan Înțeleptul</i> – G.E. Lessing</td><td>Parabola celor trei inele: trei religii, la fel de prețioase.</td><td>toleranța</td></tr></table>
<h3>6. Structurile textuale se combină</h3>
<p>Un text literar poate îmbina structuri narative, descriptive, dialogate, explicative și argumentative, prin <b>succesiune</b> (una după alta), <b>alternanță</b> (pe rând, repetat) sau <b>inserție</b> (una în interiorul alteia).</p>`,
 tricks:`
<div class="tip"><b>🎯 Pentru itemul 9 alege un text pe care îl știi „pe dinafară”:</b> <i>Iapa lui Vodă</i> (curaj, cuvântul dat), <i>Take, Ianke și Cadâr</i> (toleranță, prietenie), <i>Fahrenheit 451</i> (valoarea cărții), <i>Hainele cele noi ale împăratului</i> (adevăr).</div>
<div class="tip"><b>🧠 Povestire în ramă = „păpușa Matrioșka”:</b> o poveste mare care conține o poveste mai mică.</div>
<div class="trap"><b>⚠️</b> Nu confunda: <b>distopie</b> (lume a viitorului, rea, controlată) ≠ <b>utopie</b> (lume ideală, care nu există).</div>`,

 theory:`
<h3>1. Texte nonliterare din programă</h3>
<table class="t"><tr><th>Text</th><th>Ce este</th><th>Semne de recunoaștere</th></tr>
<tr><td><b>Cronica de spectacol / de film</b></td><td>text scris după vizionare, care analizează regia, scenariul, jocul actorilor, muzica, efectele speciale</td><td>opinii personale argumentate; nu dezvăluie finalul, ca să te facă să mergi la spectacol</td></tr>
<tr><td><b>Reclama</b></td><td>text <b>multimodal</b> (cuvinte + imagini + culori + sunete) care vrea să convingă</td><td>slogan, imperative (<i>Încearcă!</i>), adjective la superlativ, structuri descriptive</td></tr>
<tr><td><b>Textul de opinie</b></td><td>exprimă punctul de vedere al autorului despre o temă</td><td><i>cred că, în opinia mea</i>, argumente pro sau contra, concluzie</td></tr>
<tr><td><b>Interviul</b></td><td>dialog real între reporter și invitat</td><td>întrebări + răspunsuri, numele interlocutorilor</td></tr>
<tr><td><b>Textul discontinuu</b></td><td>informații organizate neliniar</td><td>liste, tabele, hărți, diagrame, orare, reclame</td></tr>
<tr><td><b>Textul mixt</b></td><td>combină text continuu cu imagini/grafice</td><td>reviste, pagini web</td></tr></table>
<h3>2. Personalități românești în cultura lumii</h3>
<ul><li><b>Constantin Brâncuși</b> (1876, Hobița – 1957, Paris) – sculptor, unul dintre întemeietorii artei moderne: <i>Sărutul, Domnișoara Pogany, Măiastra</i>; ansamblul de la Târgu Jiu (1938): <i>Masa tăcerii, Poarta sărutului, Coloana fără sfârșit</i>.</li>
<li><b>George Enescu</b> – compozitor și violonist: <i>Rapsodiile române</i>, opera <i>Oedip</i>.</li>
<li><b>Eugen Ionescu</b> – dramaturg, creator al teatrului absurdului (<i>Cântăreața cheală, Rinocerii</i>), membru al Academiei Franceze.</li>
<li><b>Henri Coandă, Traian Vuia</b> – pionieri ai aviației; <b>Ana Aslan</b> – medic (gerontologie); <b>Mircea Eliade</b> – istoric al religiilor, scriitor; <b>Hariclea Darclée</b> – soprană.</li></ul>
<h3>3. Istoria cărții românești</h3>
<ul><li><b>1508</b> – <i>Liturghierul</i> lui Macarie, prima carte tipărită pe teritoriul țării noastre (în limba slavonă).</li>
<li><b>1521</b> – <i>Scrisoarea lui Neacșu din Câmpulung</i>, cel mai vechi text păstrat scris în limba română.</li>
<li><b>Secolul al XVI-lea</b> – diaconul <b>Coresi</b> tipărește, la Brașov, primele cărți în limba română.</li>
<li>Azi: cartea digitală (e-book), audiobook.</li></ul>
<h3>4. Mitologie și valori populare</h3>
<ul><li><b>Baba Dochia</b> – legenda zilelor schimbătoare de la începutul lui martie; legată de tradiția mărțișorului.</li>
<li><b>Ursitoarele</b> – hotărăsc soarta copilului nou-născut; <b>ielele</b>, <b>zburătorul</b> – ființe fabuloase; <b>Făt-Frumos, Ileana Cosânzeana, zmeii</b> – personajele basmelor.</li>
<li><b>Legenda Meșterului Manole</b> – sacrificiul pentru creație.</li>
<li>Valori ale culturii populare: ospitalitatea, hărnicia, respectul pentru bătrâni, înțelepciunea proverbelor.</li></ul>
<h3>5. Modele de comportament din mituri și din literatura universală</h3>
<p><b>Prometeu</b> – fură focul de la zei pentru oameni și este pedepsit (sacrificiul pentru ceilalți). <b>Ulise</b> – inteligența, dorul de casă. <b>Heracle</b> – forța și curajul. <b>Dedal și Icar</b> – măsura și pericolul orgoliului. <b>Tezeu</b> – curajul (învinge Minotaurul).</p>
<h3>6. Noi și ceilalți</h3>
<p>Diversitatea culturală: comunitățile din România și românii de pretutindeni, limba română în Europa, relațiile cu țările vecine. Diferența dintre a trăi <b>alături</b> de ceilalți și a trăi <b>împreună</b> cu ei (ideea lui Slavici din <i>Lumea prin care am trecut</i>).</p>`,

<div class="tip"><b>🧠 Cronica = „recenzie de film”:</b> spune ce merită văzut și de ce, dar nu dezvăluie finalul.</div>`,

{id:'l14', title:'Redactare: scrisoare, e-mail, jurnal, descriere, opinie', icon:'📮',
 exam:'Programa EN permite la Subiectul al II-lea și: scrisoare, e-mail, jurnal, descriere, narațiune, text argumentativ, exprimarea opiniilor și preferințelor, cronică.',
 theory:`
<h3>1. Scrisoarea</h3>
<ol><li><b>Localitatea și data</b> (sus, în dreapta): <i>Iași, 20 noiembrie 2026</i></li>
<li><b>Formula de adresare</b>: <i>Dragă Andrei,</i> (familială/amicală) · <i>Stimate domnule director,</i> (oficială)</li>
<li><b>Introducerea</b> – motivul scrisorii · <b>Cuprinsul</b> – mesajul, pe paragrafe · <b>Încheierea</b> – urări, rugămintea de a răspunde</li>
<li><b>Formula de încheiere</b>: <i>Cu drag,</i> / <i>Cu stimă,</i> + <b>semnătura</b> · eventual <i>P.S.</i> (post-scriptum)</li></ol>
<p>Tipuri: familială, amicală, de mulțumire, oficială. Adaptează <b>registrul</b>: familiar pentru prieteni, solemn/standard pentru instituții.</p>
<h3>2. E-mailul</h3>
<p><b>Destinatar</b> · <b>Subiect</b> scurt și clar (<i>Proiect la română – întrebare</i>) · formulă de adresare · mesaj scurt, pe paragrafe · formulă de încheiere · semnătură. Se pot adăuga atașamente.</p>
<h3>3. Jurnalul</h3>
<p><b>Data</b> (și locul) la fiecare însemnare · <b>persoana I</b> · întâmplările zilei + <b>trăiri, reflecții</b> · sinceritate (e scris pentru tine). Variante: jurnal de călătorie, jurnal de lectură.</p>
<h3>4. Descrierea</h3>
<ul><li><b>Tablou</b> (peisaj, loc): privire de ansamblu → detalii (de aproape/de departe, sus/jos) → impresia personală.</li>
<li><b>Portret</b> (persoană, personaj): trăsături fizice → trăsături morale → atitudinea ta.</li>
<li>Instrumente: epitete, comparații, personificări, imagini vizuale/auditive/olfactive, imperfectul (<i>se întindea, era</i>).</li></ul>
<h3>5. Narațiunea</h3>
<p>Narator (persoana I sau a III-a), timp și spațiu precizate, momentele subiectului (expozițiune → intrigă → desfășurare → punct culminant → deznodământ), puțin dialog, conectori temporali.</p>
<h3>6. Textul argumentativ / de opinie / pro-contra</h3>
<ol><li><b>Ipoteza</b>: <i>Consider că...</i></li><li><b>Argumente pro</b> + exemple: <i>În primul rând... În al doilea rând...</i></li><li>(opțional) <b>Contraargument</b> + răspuns: <i>Pe de altă parte, unii cred că... Cu toate acestea...</i></li><li><b>Concluzia</b>: <i>Așadar / În concluzie...</i></li></ol>
<p><b>Conectori pro-contra</b>: <i>dar, totuși, cu toate acestea, în schimb, dimpotrivă, de fapt, spre deosebire de, pe de altă parte</i>.</p>
<h4>Exprimarea preferințelor și a opiniilor</h4>
<table class="t"><tr><th>Valoare</th><th>Expresii</th></tr>
<tr><td>certitudine</td><td>știu că, sunt convins că, e limpede că, firește</td></tr>
<tr><td>incertitudine / probabilitate</td><td>presupun că, mă îndoiesc că, s-ar putea să, probabil, poate</td></tr>
<tr><td>necesitate</td><td>trebuie să, e nevoie să, se impune să</td></tr>
<tr><td>apreciere pozitivă / negativă</td><td>apreciez, merită să, îmi place / îmi displace, regret că, din păcate</td></tr></table>
<h3>7. Comparația și analogia (tipare de structurare a ideilor)</h3>
<p><b>Comparația</b> – asemănări și deosebiri între două texte/personaje/idei (<i>asemenea, la fel ca, spre deosebire de, în schimb</i>). <b>Analogia</b> – explici ceva necunoscut prin ceva cunoscut (<i>Un text este ca o clădire...</i>).</p>
<h3>8. Etica redactării</h3>
<p><b>Originalitatea</b>: scrii cu ideile tale; când preiei idei sau citate, <b>menționezi sursa</b> (altfel e plagiat). Redactarea de mână cere scris lizibil și alineate clare; cea pe calculator – font citeț, titlu, paragrafe.</p>`,
 tricks:`

 texts:[
 {h:'Textul 1', html:`<p>„Atunci eu mă dau iute pe-o creangă, mai spre poale, și odată fac zup! în niște cânepă, care se întindea de la cireș înainte și era crudă și până la brâu de naltă. Și nebuna de mătușa Mărioara, după mine, și eu fuga iepurește prin cânepă, și ea pe urma mea, până la gardul din fundul grădinii, pe care neavând vreme să-l sar, o cotigeam înapoi, iar prin cânepă, fugind tot iepurește, și ea după mine până-n dreptul ocolului pe unde-mi era iar greu de sărit; pe de laturi iar gard, și hârsita de mătușă nu mă slăbea din fugă nici în ruptul capului! Cât pe ce să pună mâna pe mine! Și eu fuga, și ea fuga, și eu fuga, și ea fuga, până ce dăm cânepa toată palancă la pământ; căci, să nu spun minciuni, erau vro zece-douăsprezece prăjini de cânepă, frumoasă și deasă cum îi peria, de care nu s-a ales nimica. Și după ce facem noi trebușoara asta, mătușa, nu știu cum, se încâlcește prin cânepă, ori se împiedică de ceva, și cade jos. Eu, atunci, iute mă răsucesc într-un picior, fac vro două sărituri mai potrivite, mă azvârl peste gard, de parcă nici nu l-am atins, și-mi pierd urma, ducându-mă acasă și fiind foarte cuminte în ziua aceea…”</p>`, src:'Ion Creangă, <i>Amintiri din copilărie</i> (fragment din „La cireșe”)<br>ocol – loc îngrădit pentru vite; hârsită – (pop.) înverșunată, încăpățânată; palancă – (pop.) culcat, prăbușit; prăjină – veche unitate de măsură pentru suprafețe'},
 {h:'Textul 2', html:`<p>Cireșul este unul dintre primii pomi fructiferi care rodesc la începutul verii. În România, cireșele se coc, de obicei, între sfârșitul lunii mai și începutul lunii iulie, în funcție de soi și de zonă. Fructele conțin multă apă și vitamina C, de aceea nutriționiștii le recomandă proaspete, consumate cu măsură.</p><p>Pomul poate depăși 15 metri înălțime, iar lemnul lui, de culoare roșiatică, este apreciat de tâmplari pentru mobilă și instrumente muzicale. Florile albe apar primăvara, înaintea frunzelor, și sunt polenizate mai ales de albine.</p><p>În multe sate, culesul cireșelor este un prilej de întâlnire: vecinii se ajută între ei, iar copiii primesc, de obicei, sarcina de a strânge fructele de pe crengile de jos. Specialiștii atrag însă atenția că urcatul în copaci fără supravegherea unui adult este periculos, deoarece ramurile cireșului sunt fragile și se rup ușor.</p>`, src:'text informativ realizat pentru acest exercițiu'}
 ],

 {part:1,nr:8,type:'open',pts:6,min:50,max:100,req:'Crezi că o întâmplare nefericită din copilărie poate deveni, mai târziu, o amintire frumoasă? Motivează-ți răspunsul, în 50–100 de cuvinte, valorificând textul 1.',crit:C_OPINIE,
  model:'Cred că o întâmplare nefericită din copilărie poate deveni, mai târziu, o amintire frumoasă. Cu trecerea timpului, spaima se estompează și rămâne doar farmecul aventurii. De exemplu, în textul 1, naratorul povestește cu umor fuga prin cânepă: „Și eu fuga, și ea fuga, și eu fuga, și ea fuga”. Deși atunci copilul era speriat, adultul care scrie râde de propria năzbâtie. Așadar, timpul transformă necazurile copilăriei în amintiri dragi.'},

  model:'Fragmentul din „Amintiri din copilărie” de Ion Creangă poate fi asociat cu „D-l Goe...” de I.L. Caragiale, deoarece ambele texte pun în discuție educația copiilor și responsabilitatea pentru faptele proprii. Nică știe că a greșit și, după fugă, este „foarte cuminte în ziua aceea”, semn că își asumă vina. Spre deosebire de el, Goe nu ascultă sfatul de a nu scoate capul pe fereastră și își pierde pălăria cu biletul. Ambele texte arată că faptele au consecințe.'},

 {part:3,nr:1,type:'essay',pts:20,min:150,max:0,req:'Scrie o compunere de minimum 150 de cuvinte, în care să prezinți o semnificație a fragmentului din „Amintiri din copilărie” de Ion Creangă (textul 1).',
  bullets:['să precizezi mesajul sau o semnificație a textului, în raport cu tema','să prezinți două elemente specifice textului narativ, care contribuie la construirea semnificației','să interpretezi două secvențe relevante pentru semnificația identificată','să menționezi o emoție/un sentiment al unui personaj, justificându-l'],
  crit:[{c:'Mesajul/semnificația textului',p:1},{c:'Tema',p:1},{c:'Primul element specific textului narativ (adecvat 2 p, schematic 1 p)',p:2},{c:'Al doilea element specific textului narativ',p:2},{c:'Interpretarea primei secvențe (adecvat 2 p, încercare 1 p)',p:2},{c:'Interpretarea celei de-a doua secvențe',p:2},{c:'Emoția/sentimentul unui personaj – menționare',p:1},{c:'Emoția/sentimentul – justificare',p:1}],
  model:'Fragmentul din „Amintiri din copilărie” de Ion Creangă are ca temă copilăria, iar mesajul său este că năzbâtiile copilăriei, deși aduc necazuri pe moment, devin mai târziu amintiri pline de farmec.\n\nUn prim element specific textului narativ care construiește această semnificație este naratorul la persoana I, care este și personaj. Adultul își amintește cu umor de copilul de odinioară, ceea ce transformă o întâmplare neplăcută într-o poveste hazlie.\n\nAl doilea element este acțiunea alertă, construită din verbe de mișcare: copilul sare din cireș, fuge prin cânepă, se întoarce, sare gardul. Secvența „Și eu fuga, și ea fuga, și eu fuga, și ea fuga” sugerează, prin repetiție, ritmul amețitor al urmăririi și comicul situației.\n\nO a doua secvență relevantă este finalul: copilul ajunge acasă, „fiind foarte cuminte în ziua aceea”. Cumințenia neobișnuită arată că Nică știe că a greșit și se teme de urmări.\n\nEmoția dominantă a personajului este teama de a fi prins, justificată de exclamația „Cât pe ce să pună mâna pe mine!”.\n\nÎn concluzie, textul arată că amintirile din copilărie rămân vii tocmai prin bucuria și emoțiile lor.'}
 ]},

{id:'s2', title:'Simularea 2 · „D-l Goe...”', emoji:'🚂', sub:'I.L. Caragiale + interviu · caracterizarea personajului',
 texts:[
 {h:'Textul 1', html:`<p>Ca să nu mai rămâie repetent și anul acesta, mam’ mare, mamițica și tanti Mița au promis tânărului Goe să-l ducă-n București de 10 Mai. Puțin ne importă dacă aceste trei dame se hotărăsc a părăsi locul lor spre a veni în capitală numai de hatârul fiului și nepoțelului lor. Destul că foarte de dimineață, dumnealor, frumos gătite, împreună cu tânărul Goe, așteaptă cu multă nerăbdare, pe peronul din urbea X, trenul accelerat care trebuie să le ducă la București. […] Trenul în care se vor sui ajunge în Gara de Nord la opt fără zece a.m. D. Goe este foarte impacient și, cu un ton de comandă, zice încruntat:</p>
<p>— Mam’ mare! De ce nu mai vine?... Eu vreau să vie!<br>— Vine, vine acuma, puișorul mamii! răspunde cucoana.</p>
<p>Și sărută pe nepoțel; apoi îi potrivește pălăria. Tânărul Goe poartă un frumos costum de marinar, pălărie de paie, cu inscripția pe pamblică: <i>Le Formidable</i>, și sub pamblică biletul de călătorie înfipt de tanti Mița, că „așa țin bărbații biletul”.</p>
<p>— Vezi ce bine-i șade lui, zice mam’ mare, cu costumul de marinel?<br>— Mamițo, nu ți-am spus că nu se zice marinel?<br>— Da’ cum?<br>— Marinal...<br>— Ei! Ziceți voi cum știți; eu zic cum am apucat. […]<br>— Vezi că sunteți proaste amândouă? întrerupe tânărul Goe. Nu se zice nici marinal, nici marinel...<br>— Da’ cum, procopsitule? întreabă tanti Mița cu un zâmbet simpatic.<br>— Mariner...</p>
<p>[…] Trenul a plecat... Mam’ mare își face cruce, apoi aprinde o țigară... Goe nu vrea să intre în cupeu; vrea să șadă în coridorul vagonului cu bărbații.</p>
<p>— Nu!... nu e voie să scoți capul pe fereastră, mititelule! zice unul dintre tineri lui d. Goe, și-l trage puțin înapoi.<br>— Ce treabă ai tu, urâtule? zice mititelul smucindu-se.</p>
<p>Și după ce se strâmbă la urâtul, se spânzură iar cu amândouă mânile de vergeaua de alamă și scoate iar capul. […] Mititelul își retrage îngrozit capul gol înăuntru și-ncepe să zbiere.</p>
<p>— Mamițoo! mam’ maree! tantii!<br>— Ce e? ce e? sar cocoanele.<br>— Să oprească! zbiară și mai tare Goe, bătând din picioare. Mi-a zburat pălăria! Să opreascăăă!!!</p>
<p>Tot într-un timp, iacătă conductorul intră să vază cine s-a suit de la stația din urmă.</p>
<p>— Biletele, domnilor!</p>
<p>Cocoanele arată biletele dumnealor, explicând d-lui conductor de ce nu poate și Goe să facă același lucru: fiindcă biletul era în pamblica pălăriei, și, dacă a zburat pălăria, firește c-a zburat cu pamblică și cu bilet cu tot. Dar avea bilet...</p>
<p>— Parol! Chiar eu l-am cumpărat! zice tanti Mița. […]<br>— De ce-a scos capul pe fereastră? eu i-am spus să nu scoată capul pe fereastră! zice cu pică urâtul.</p>`, src:'I.L. Caragiale, <i>D-l Goe...</i><br>hatâr – plăcere, poftă; urbe – oraș; impacient – nerăbdător; pamblică – panglică; procopsit – (aici, ironic) învățat; cupeu – compartiment de tren; vergea – bară îngustă; parol – pe cuvânt; pică – ciudă'},
 {h:'Textul 2', html:`<p><b>„Un «bună ziua» face drumul mai frumos”</b> – de vorbă cu un conductor de tren</p>
<p>— De câți ani lucrați pe tren?<br>— De aproape douăzeci de ani. Am început ca impiegat într-o gară mică, apoi am devenit conductor.</p>
<p>— Ce vă place cel mai mult la meseria dumneavoastră?<br>— Oamenii. Fiecare călătorie e altfel: întâlnești familii care pleacă în vacanță, studenți care se întorc acasă, bunici care merg să-și vadă nepoții.</p>
<p>— Care sunt cele mai frecvente probleme pe care le întâlniți?<br>— Din păcate, unii copii se apleacă pe geam sau se joacă lângă uși. Părinții trebuie să știe că un tren care merge cu o sută de kilometri pe oră nu iartă neatenția. Apoi, sunt călători care își pierd biletul. Acum e mai simplu, pentru că biletele se pot cumpăra și pe telefon.</p>
<p>— Ce sfat le dați celor care călătoresc pentru prima dată?<br>— Să vină din timp la gară, să-și păstreze biletul la îndemână și să fie politicoși cu ceilalți. Un «bună ziua» și un «mulțumesc» fac drumul mai frumos pentru toată lumea.</p>`, src:'interviu imaginar, realizat pentru acest exercițiu'}
 ],

  model:'Un element comun celor două texte este pericolul la care se expun copiii neatenți în tren. În textul 1, Goe scoate capul pe fereastră deși un tânăr îi spune: „nu e voie să scoți capul pe fereastră”. În textul 2, conductorul avertizează că unii copii „se apleacă pe geam”, iar trenul „nu iartă neatenția”.'},
 {part:1,nr:8,type:'open',pts:6,min:50,max:100,req:'Crezi că regulile de comportament din mijloacele de transport în comun sunt necesare? Motivează-ți răspunsul, în 50–100 de cuvinte, valorificând textul 2.',crit:C_OPINIE,
  model:'Consider că regulile de comportament din mijloacele de transport sunt necesare, pentru că ne protejează și fac drumul plăcut pentru toți. În textul 2, conductorul explică faptul că un tren rapid „nu iartă neatenția”, de aceea copiii nu trebuie să se aplece pe geam. De asemenea, el recomandă politețea, deoarece un salut „face drumul mai frumos”. Prin urmare, respectarea regulilor înseamnă siguranță și respect față de ceilalți.'},
 {part:1,nr:9,type:'open',pts:6,min:50,max:100,req:'Asociază fragmentul din „D-l Goe...” cu un alt text literar studiat la clasă sau citit ca lectură suplimentară, prezentând, în 50–100 de cuvinte, o valoare comună (morală sau culturală), cu referire la câte o secvență relevantă din fiecare text.',crit:C_ASOC,
  model:'Fragmentul din „D-l Goe...” de I.L. Caragiale poate fi asociat cu „Amintiri din copilărie” de Ion Creangă, prin valoarea educației. Goe, răsfățat, nu ascultă de adulți și le jignește chiar pe cele care îl iubesc: „Vezi că sunteți proaste amândouă?”. Nică greșește și el, furând cireșe, dar înțelege că a făcut rău și e „foarte cuminte în ziua aceea”. Ambele texte arată că un copil are nevoie de limite și de o educație atentă.'},

 {part:2,nr:8,type:'forms',pts:6,req:'Alege forma corectă a cuvintelor din mesajul mamiței către tanti Mița.',html:'„Dragă Mițo, [[0]] biletul la tine! Goe [[1]] supărat că [[2]] zburat pălăria. Le-am spus [[3]] mai cuminți copii să nu se aplece pe geam. Am fost [[4]] în tren cu el, nu de două ori, dar mi-a ajuns! Mâine [[5]] veni și bunica.”',

 {part:3,nr:1,type:'essay',pts:20,min:150,max:0,req:'Scrie o compunere de minimum 150 de cuvinte, în care să-l caracterizezi pe Goe, personajul din textul lui I.L. Caragiale.',
  bullets:['să notezi două date de identificare a personajului (vârstă, statut, familie etc.)','să prezinți, prin câte o secvență comentată, două trăsături morale ale personajului','să precizezi două mijloace de caracterizare diferite, prin care se evidențiază trăsăturile morale prezentate','să corelezi o valoare personală cu una dintre valorile personajului'],
  crit:[{c:'Prima dată de identificare',p:1},{c:'A doua dată de identificare',p:1},{c:'Prima trăsătură morală + secvență comentată (adecvat 2 p)',p:2},{c:'A doua trăsătură morală + secvență comentată',p:2},{c:'Primul mijloc de caracterizare',p:2},{c:'Al doilea mijloc de caracterizare, diferit',p:2},{c:'Corelarea unei valori personale cu o valoare a personajului',p:2}],
  model:'Goe este personajul principal al schiței „D-l Goe...” de I.L. Caragiale. Este un copil de școală, care a mai rămas repetent, și călătorește cu trenul spre București, împreună cu mama, bunica și mătușa lui, care îl răsfață peste măsură.\n\nO primă trăsătură morală a lui Goe este obrăznicia. Ea reiese indirect, din limbajul personajului, atunci când le jignește pe cele două doamne care îl iubesc: „Vezi că sunteți proaste amândouă?”. Replica arată lipsa de respect față de adulți, consecință a educației greșite primite în familie.\n\nA doua trăsătură este nerăbdarea capricioasă, numită direct de narator: „D. Goe este foarte impacient”. Băiatul cere trenul pe un ton de comandă, ca și cum totul i s-ar cuveni. Neascultarea completează portretul: deși un călător îl avertizează, el scoate iar capul pe fereastră și își pierde pălăria cu biletul.\n\nAșadar, trăsăturile lui Goe sunt evidențiate atât prin caracterizare directă, de către narator, cât și prin caracterizare indirectă, prin limbaj și fapte.\n\nSpre deosebire de Goe, eu prețuiesc respectul față de cei din jur, pentru că bunele maniere ne fac să fim apreciați.\n\nÎn concluzie, Goe este tipul copilului răsfățat, needucat de o familie prea indulgentă.'}
 ]},

{id:'s3', title:'Simularea 3 · „Popa Tanda”', emoji:'🌽', sub:'Ioan Slavici + articol · rezumat (ca la EN 2026)',
 texts:[
 {h:'Textul 1', html:`<p>Dacă ar fi fost altfel de om, s-ar fi oprit aci. Părintele Trandafir e însă ca și capra în grădina cu curechi. Când îl scoți pe ușă, îți intră prin gard; când astupi gardul, dai că sare peste gard și îți face mai multă pagubă, stricând și streașina gardului. […] tot bun om rămâne părintele Trandafir.</p>
<p>— Așteptați! grăi el. Dacă nu veniți voi la mine, mă duc eu la voi!</p>
<p>Și apoi porni popa la colindă. Cât e ziua de mare, gura lui nu se mai oprea. Unde prindea oamenii, acolo îi ținea la sfaturi. […] Vrun an de zile a dus-o părintele Trandafir cu sfatul. Oamenii ascultau bucuros; le plăcea să stea de vorbă cu popa și chiar se prindeau de sfaturi. Atâta însă, și mai departe tot povestea cea veche: știau oamenii cum să facă, dar nu făceau. Părintele se cam necăjea. De la o vreme a fost sfârșit cu sfaturile. Nu era om în sat asupra căruia să nu fi descărcat întreaga sa învățătură: nu mai avea ce să spună.</p>
<p class="dim">[Nici glumele, nici ocările nu-i schimbă pe săteni. Necăjit, părintele Trandafir hotărăște să se îngrijească, în sfârșit, de propria casă.]</p>
<p>În câteva zile toți patru pereții erau lipiți și muruiți. Acum părintele ședea mai bucuros afară decât în casă, fiindcă din casă nu se vedea atât de bine muruiala casei; și era frumos lucru o casă muruită în Sărăceni. […] În cealaltă sâmbătă acoperișul era cârpit și tivit pe vârf cu snopi de trestie, peste care erau întinse doauă prăjini legate cu furci. Acum lucrul era chiar bun – și nu scump. Oamenii treceau pe lângă casa popii, clătinau din cap […]. Iară popa petrecea bucuros pe afară.</p>
<p class="dim">[Părintele face gard și portiță, iar preoteasa sapă straturi în care seamănă ceapă, morcovi, fasole, cartofi și varză.]</p>
<p>— Auzi tu, preoteasă, grăi acum popa. Oare n-ar fi bine să sămănăm păpușoi pe lângă gard și împregiurul straturilor?<br>— Ba bine, zău așa! Mie-mi place păpușoiul verde!<br>— Și mie, mai ales copt pe jăratec!</p>
<p>Lucru nou! Popa se-ncungiură cu păpușoi. Îi râdea inima când gândea cât se va face de frumoasă treaba, când giur împregiur păpușoiul va crește și va acoperi spinii din gard, care începeau a nu-i mai plăcea părintelui.</p>`, src:'Ioan Slavici, <i>Popa Tanda</i> (fragmente)<br>curechi – (reg.) varză; a grăi – (arh.) a vorbi; muruit – tencuit cu lut; doauă – (reg.) două; păpușoi – (reg.) porumb; jăratec – jar; giur împregiur – de jur împrejur'},
 {h:'Textul 2', html:`<p><b>Grădina din curtea școlii</b></p>
<p>Anul trecut, elevii unei școli gimnaziale dintr-un sat de munte au transformat un colț neîngrijit al curții într-o grădină de legume. Ideea a pornit de la profesoara de biologie, care le-a propus elevilor de clasa a VII-a un proiect: „Să vedem ce putem crește cu mâinile noastre!”</p>
<p>Copiii au curățat terenul de buruieni și de pietre, au construit un gard din nuiele și au amenajat opt straturi. În aprilie au semănat ridichi, salată și fasole, iar în mai au plantat roșii și dovlecei. Fiecare clasă a primit în grijă două straturi și a ținut un jurnal în care nota când a udat plantele și cum au crescut.</p>
<p>Prima recoltă a fost mică, dar elevii au fost foarte mândri de ea. Legumele au fost duse la cantina școlii, iar o parte au fost dăruite bătrânilor din sat. Văzând rezultatele, mai mulți părinți au început să-și amenajeze și ei grădini în spatele caselor.</p>
<p>„Cel mai mult am învățat din greșeli”, spune un elev de clasa a VIII-a. „Prima dată am udat prea mult răsadurile și s-au îngălbenit. Acum știm că plantele au nevoie de răbdare, nu doar de apă.”</p>`, src:'articol realizat pentru acest exercițiu'}
 ],

 {part:1,nr:7,type:'open',pts:6,min:30,max:0,req:'Prezintă, în minimum 30 de cuvinte, un element de conținut comun celor două texte, valorificând câte o secvență relevantă din fiecare text.',crit:C_COMUN,
  model:'Un element comun este grădina, prin care oamenii dau exemplu celorlalți. În textul 1, părintele Trandafir își îngrijește casa și curtea, iar oamenii trec pe lângă casa lui și „clătinau din cap”. În textul 2, elevii fac o grădină, iar „mai mulți părinți au început să-și amenajeze și ei grădini”.'},
 {part:1,nr:8,type:'open',pts:6,min:50,max:100,req:'Crezi că oamenii învață mai ușor dintr-un exemplu concret decât din sfaturi? Motivează-ți răspunsul, în 50–100 de cuvinte, valorificând textul 2.',crit:C_OPINIE,
  model:'Cred că oamenii învață mai ușor dintr-un exemplu concret, deoarece văd cu ochii lor că un lucru este posibil. În textul 2, elevii nu au ținut discursuri despre grădinărit, ci au muncit, iar rezultatele i-au convins pe ceilalți: „mai mulți părinți au început să-și amenajeze și ei grădini”. Chiar și elevii au învățat „din greșeli”, adică din experiență. Așadar, faptele au o putere mai mare decât vorbele.'},
 {part:1,nr:9,type:'open',pts:6,min:50,max:100,req:'Asociază fragmentul din „Popa Tanda” cu un alt text literar studiat la clasă sau citit ca lectură suplimentară, prezentând, în 50–100 de cuvinte, o valoare comună (morală sau culturală), cu referire la câte o secvență relevantă din fiecare text.',crit:C_ASOC,
  model:'Fragmentul din „Popa Tanda” de Ioan Slavici poate fi asociat cu romanul „Toate pânzele sus!” de Radu Tudoran, prin valoarea perseverenței. Părintele Trandafir nu renunță când sfaturile lui nu au efect, ci își schimbă metoda și se apucă singur de muncă: „În câteva zile toți patru pereții erau lipiți și muruiți”. La fel, Anton Lupan nu abandonează călătoria spre Țara de Foc, deși furtunile îi pun echipajul în pericol. Ambele texte arată că reușita vine prin efort continuu.'},

{id:'s4', title:'Simularea 4 · „Take, Ianke și Cadâr”', emoji:'🎭', sub:'Victor Ion Popa (text dramatic) + cronică de spectacol · caracterizarea personajului dramatic',
 texts:[
 {h:'Textul 1', html:`<p class="dim">[Ana, fiica lui Ianke, studentă la București, se întoarce acasă după doi ani.]</p>
<p>ANA (<i>se oprește, zâmbind la Ionel, apoi la Ianke</i>): Papa!<br>
IANKE (<i>înlemnit</i>): Ce vorbești? Așa o surpriză... așa o surpriză... Ei, asta zău că se poate să-i zici o surpriză... (<i>Și-i așa de emoționat că nu poate să mai vorbească.</i>)<br>
ANA: Ei! Papa... și nu mă săruți?<br>
IANKE: Să te sărut? Cum să te sărut! Mi-i și rușine să te sărut, așa prost îmbrăcat cum sunt... Așa o cucoană ca tine... Mă duc să mă îmbrac... ca să am curaj...<br>
ANA: Ei haide, lasă! Acu te iert! Te îmbraci după aceea... Hai, sărută-mă...<br>
IANKE: Unde-i maică-ta să te vadă...<br>
ANA (<i>înduioșată</i>): Papa!<br>
IANKE (<i>lui Ionel</i>): Mă rog, sunt eu așa un dobitoc, ori e frumoasă de-a binelea?<br>
IONEL: Îi frumoasă de-a binelea, nene Ianke.<br>
ANA: Vai, Ionel! Înțeleg să-mi facă tata complimente, că nu m-a văzut de doi ani, dar tu...<br>
IANKE: Ce vorbești? Ce complimente! Astea nu-s complimente... Ești așa de frumoasă – așa de frumoasă... ești mai frumoasă decât era maică-ta când eram eu logodit cu ea... […]<br>
ANA: Și ce mai face moș Cadâr?<br>
IANKE: Ce să facă, doarme! Ce grijă are el?<br>
ANA: Tot nu s-a însurat?<br>
IANKE: Așa un păcătos să se însoare? Dar să nu-i zici de asta nimic – că asta-i mare durere la inima lui. (<i>Ana s-a oprit în fața prăvăliei lui Cadâr și bate în geam.</i>)</p>
<p>CADÂR (<i>iese în prag, o recunoaște și uluit și duios</i>): Frumooos estem! Ca un trandafir de la Eyub frumos estem! Frumos! Ana-Aniki. Înapoi venit! Dai voie Cadâr sarutam. (<i>O sărută printre lacrimi.</i>) Ana-Aniki!<br>
ANA: Ana-Aniki a ta, moș Cadâr. I-a fost dor de tine... N-ai uitat-o, spune?<br>
CADÂR: Uitat? Ana-Aniki în inimă, în casă ținut, cum ținut Coran. Asta fată, Ianke bre – tu făcut? Asta fată așa frumos? Halal bre! Asta soare în casa estem – asta soare la inima batrina estem... numai Cadâr singur estem... (<i>Și plânge.</i>)<br>
ANA: Moș Cadâr! Ai să mă faci să plâng.<br>
CADÂR: Asta mâna lui Allah! Asta comoară de la Allah! Ana-Aniki... iubeștem puțin moș Cadâr batrin... viața ridem puțin...<br>
ANA: Dar te iubesc, moș Cadâr – te iubesc mult... Apoi de ce crezi că am venit eu aici? Hai? Să-mi dai coșulețul meu cu bomboane... Unde-i coșulețul meu cu bomboane?</p>`, src:'Victor Ion Popa, <i>Take, Ianke și Cadâr</i> (fragment din Actul I, scenele 7–8)<br>Eyub – cartier al Istanbulului; halal – (aici) bravo; Ana-Aniki – alint pentru Ana'},
 {h:'Textul 2', html:`<p><b>Comedia care ne învață să trăim împreună</b></p>
<p>Trupa de teatru a unui liceu a pus în scenă, luna trecută, comedia „Take, Ianke și Cadâr” de Victor Ion Popa. Sala de festivități a fost plină în toate cele trei seri, iar publicul, format din elevi, părinți și profesori, a râs și s-a emoționat deopotrivă.</p>
<p>Decorul, realizat chiar de elevii de la clubul de arte, reproduce cele trei prăvălii colorate „în oglindă”, exact cum le descrie autorul în indicațiile scenice. Costumele sunt simple, dar atent alese: Take și Ianke poartă aceleași haine, în culori diferite.</p>
<p>Cel mai aplaudat a fost interpretul lui Cadâr, un elev de clasa a X-a, care a găsit tonul potrivit între comic și tristețe. Scena în care bătrânul o recunoaște pe Ana a stors lacrimi din sală. Mai puțin convingător ni s-a părut ritmul primului act, în care certurile dintre cei doi vecini se lungesc prea mult.</p>
<p>Spectacolul ne amintește că prietenia nu ține cont de neam sau de religie. Merită văzut, mai ales de cei care cred că diferențele ne despart.</p>`, src:'cronică de spectacol realizată pentru acest exercițiu'}

 {part:1,nr:8,type:'open',pts:6,min:50,max:100,req:'Crezi că teatrul îi poate face pe oameni mai toleranți? Motivează-ți răspunsul, în 50–100 de cuvinte, valorificând textul 2.',crit:C_OPINIE,

 {part:1,nr:9,type:'open',pts:6,min:50,max:100,req:'Asociază fragmentul din „Take, Ianke și Cadâr” cu un alt text literar studiat la clasă sau citit ca lectură suplimentară, prezentând, în 50–100 de cuvinte, o valoare comună (morală sau culturală), cu referire la câte o secvență relevantă din fiecare text.',crit:C_ASOC,

  crit:[{c:'Prima dată de identificare',p:1},{c:'A doua dată de identificare',p:1},{c:'Prima trăsătură morală + secvență comentată (adecvat 2 p)',p:2},{c:'A doua trăsătură morală + secvență comentată',p:2},{c:'Primul mijloc de caracterizare',p:2},{c:'Al doilea mijloc de caracterizare, diferit',p:2},{c:'Corelarea unei valori personale cu o valoare a personajului',p:2}],
  model:'Cadâr este unul dintre personajele comediei „Take, Ianke și Cadâr” de Victor Ion Popa. Este un turc bătrân, negustor de dulciuri, vecinul lui Take și al lui Ianke, și trăiește singur.\n\nO primă trăsătură a lui Cadâr este afecțiunea profundă pentru Ana, pe care a îndrăgit-o încă de când era copil. Ea reiese din indicațiile scenice: bătrânul „iese în prag, o recunoaște și uluit și duios” și o sărută „printre lacrimi”. Gesturile lui arată că o iubește ca pe propriul copil.\n\nA doua trăsătură este tristețea pricinuită de singurătate, care reiese din limbajul său: „numai Cadâr singur estem...”. Replica, rostită în româna lui stâlcită și emoționantă, dezvăluie regretul unui om care nu și-a întemeiat o familie. Această trăsătură este confirmată și de Ianke, care spune că însurătoarea „asta-i mare durere la inima lui” – caracterizare directă, făcută de alt personaj.\n\nAsemenea lui Cadâr, și eu prețuiesc familia și prietenii, pentru că fără ei viața ar fi goală.\n\nÎn concluzie, Cadâr este un personaj comic și înduioșător în același timp, care arată cât de prețioasă este iubirea.'}

{id:'s5', title:'Simularea 5 · „O, rămâi...”', emoji:'🌲', sub:'Mihai Eminescu (text liric) + articol · compunere despre semnificația poeziei',
 texts:[
 {h:'Textul 1', html:`<p>„O, rămâi, rămâi la mine,<br>Te iubesc atât de mult!<br>Ale tale doruri toate<br>Numai eu știu să le-ascult;</p>
<p>În al umbrei întuneric<br>Te asamăn unui prinț,<br>Ce se uit-adânc în ape<br>Cu ochi negri și cuminți;</p>
<p>Și prin vuietul de valuri,<br>Prin mișcarea naltei ierbi,<br>Eu te fac s-auzi în taină<br>Mersul cârdului de cerbi;</p>
<p>Eu te văd răpit de farmec<br>Cum îngâni cu glas domol,<br>În a apei strălucire<br>Întinzând piciorul gol</p>
<p>Și privind în luna plină<br>La văpaia de pe lacuri,<br>Anii tăi se par ca clipe,<br>Clipe dulci se par ca veacuri.”</p>
<p>Astfel zise lin pădurea,<br>Bolți asupră-mi clătinând;<br>Șuieram l-a ei chemare<br>Ș-am ieșit în câmp râzând.</p>
<p>Astăzi chiar de m-aș întoarce<br>A-nțelege n-o mai pot...<br>Unde ești, copilărie,<br>Cu pădurea ta cu tot?</p>`, src:'Mihai Eminescu, <i>O, rămâi...</i><br>a asămăna – a asemăna, a compara; văpaie – strălucire, flacără; boltă – (aici) coroana arborilor'},
 {h:'Textul 2', html:`<p><b>Școala din pădure</b></p>
<p>În mai multe țări europene, unele grădinițe și școli își țin o parte din ore în aer liber, în pădure. Copiii învață să recunoască arborii după frunze și scoarță, ascultă păsările și observă cum se schimbă natura de la un anotimp la altul.</p>
<p>Educatorii spun că lecțiile în natură îi fac pe copii mai atenți și mai calmi. În pădure nu există sonerie, iar timpul pare că trece altfel: o oră de explorare poate părea doar câteva minute.</p>
<p>Și în România există tabere și cluburi care organizează drumeții pentru elevi. Ghizii montani le explică participanților regulile de bază: nu se strigă, nu se rup crengi, gunoiul se ia înapoi acasă, iar animalele sălbatice se privesc doar de departe.</p>
<p>„Copiii care au mers în pădure cu părinții sau cu bunicii păstrează amintirea toată viața”, spune o educatoare care lucrează de cincisprezece ani cu grupe de preșcolari. „Uneori, după mulți ani, vin să-mi povestească despre ziua în care au văzut prima dată o căprioară.”</p>`, src:'articol realizat pentru acest exercițiu'}

  model:'Poezia „O, rămâi...” de Mihai Eminescu poate fi asociată cu „Amintiri din copilărie” de Ion Creangă, prin prețuirea copilăriei. Eul liric se întreabă cu nostalgie: „Unde ești, copilărie, / Cu pădurea ta cu tot?”. Naratorul lui Creangă își amintește cu drag și cu umor de năzbâtiile din satul natal, cum este fuga prin cânepa mătușii Mărioara. Ambele texte arată că anii copilăriei rămân cei mai frumoși.'},

function confetti(){
  const c=document.createElement('canvas'); c.className='confetti'; c.width=innerWidth; c.height=innerHeight; document.body.appendChild(c);
  const x=c.getContext('2d'), cols=['#58cc02','#1cb0f6','#ffc800','#a560f8','#ff4b4b','#ff9600'];
  const P=[...Array(140)].map(()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:5+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6}));
  let f=0; (function step(){ x.clearRect(0,0,c.width,c.height); P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore();}); if(++f<170) requestAnimationFrame(step); else c.remove(); })();
}
